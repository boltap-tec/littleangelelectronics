<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>Little Angel Electronics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --panel:#111c33; --panel2:#152344;
  --line:#22314f; --line2:#2c3e63;
  --text:#e8eefc; --muted:#93a4c8; --muted2:#6b7ba0;
  --brand:#6366f1; --brand2:#818cf8; --brandsoft:#312e81;
  --gold:#f5b301; --gold2:#ffcf3f;
  --green:#22c55e; --greensoft:#0f2e1e;
  --red:#ef4444; --redsoft:#3a1520;
  --amber:#f5cf7a; --ambersoft:#3a3016;
  --blue:#38bdf8;
  --radius:16px; --radius-sm:11px;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); color:var(--text);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(99,102,241,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(245,179,1,.10), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--brand2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#20304f;border-radius:20px}
.hidden{display:none !important}

/* ================= LIGHT (BRIGHT) THEME ================= */
body.light{
  --bg:#eef1f8; --bg2:#ffffff; --panel:#ffffff; --panel2:#f1f4fb;
  --line:#e4e9f3; --line2:#d6ddee;
  --text:#1b2440; --muted:#5a6785; --muted2:#8a97b4;
  --brandsoft:#e3e5ff; --greensoft:#e3f7ea; --redsoft:#fde7e7; --ambersoft:#fdf1d8;
  --gold2:#b6841c; --blue:#0f8fd1;
  --shadow:0 12px 30px rgba(28,40,80,.14);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(99,102,241,.10), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(245,179,1,.12), transparent 55%),
    var(--bg);
}
body.light .topbar{background:rgba(255,255,255,.86)}
body.light .topbar .logo,
body.light .brand-badge{background:radial-gradient(circle at 50% 40%,#fdf7e8,#f2e9d1)}
body.light .thumb{background:linear-gradient(135deg,#e9eefb,#dae3f5);color:#59668a}
body.light .sidebar{background:#ffffff}
body.light .stat.red .val{color:#d63b3b}
body.light .stat.amber .val{color:#b07d10}
body.light .note{background:#fdf1d8;color:#7a5b0f;border-color:#eeddb0}
body.light .mini-btn.red{color:#d63b3b;border-color:#f0c0c0}
body.light .mini-btn.gold{color:#9a6b0f;border-color:#ecd7a3}
body.light .li-x{color:#d63b3b;border-color:#f0c0c0}
body.light .tag.cash,body.light .tag.ok,body.light .tag.paid{background:#e3f7ea;color:#1f8a4c;border-color:#b6e6c8}
body.light .tag.card{background:#e6e7ff;color:#4338ca;border-color:#c3c6f5}
body.light .tag.bank{background:#e2f1fb;color:#1667a3;border-color:#bcdcf0}
body.light .tag.low,body.light .tag.due{background:#fde7e7;color:#c62b2b;border-color:#f4c4c4}
body.light .tag.partial{background:#fdf1d8;color:#9a6b0f;border-color:#f0dca6}
body.light ::-webkit-scrollbar-thumb{background:#c9d3e8}

/* ================= MINT (FRESH) THEME =================
   Built on top of the light component rules (body gets "light mint"),
   then overrides the palette + font. Inspired by soft-mint / emerald look. */
body.mint{
  --bg:#d2f0df; --bg2:#ffffff; --panel:#ffffff; --panel2:#e6f8ef;
  --line:#c1e6d2; --line2:#a6ddbf;
  --text:#13224c; --muted:#48695a; --muted2:#789a89;
  --brand:#1aae57; --brand2:#34d17a; --brandsoft:#d1f3df;
  --gold:#eaa800; --gold2:#a97b12;
  --green:#16a34a; --greensoft:#d7f5e4;
  --red:#dc2626; --redsoft:#fde7e7;
  --amber:#f5cf7a; --ambersoft:#fbf0d6;
  --blue:#2563eb;
  --shadow:0 14px 34px rgba(16,74,50,.16);
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(26,174,87,.20), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(37,99,235,.10), transparent 55%),
    var(--bg);
}
body.mint h1,body.mint h2,body.mint h3,body.mint .stat .val,body.mint .login-card h1{
  font-weight:800;letter-spacing:-.4px;color:var(--text)}
body.mint .topbar{background:rgba(210,240,223,.88)}
body.mint .brand-badge,body.mint .topbar .logo{background:radial-gradient(circle at 50% 40%,#e6f7ee,#c4ecd6)}
body.mint .sidebar{background:#ffffff}
body.mint .nav-item.active{background:var(--brandsoft);color:var(--brand)}
body.mint .chip .dot{background:var(--green)}
body.mint .tag.card{background:#e2ecff;color:#2141b8;border-color:#c2d2f7}
body.mint .tag.bank{background:#e2f1fb;color:#1667a3;border-color:#bcdcf0}
body.mint .btn-primary,body.mint .btn{--brand:#17a24d;--brand2:#2bc46a}
body.mint ::-webkit-scrollbar-thumb{background:#a6ddbf}

/* ================= OCEAN (PREMIUM) THEME =================
   Dark-based (no .light class) — deep teal panels with cyan accents. */
body.ocean{
  --bg:#07141c; --bg2:#0a1c27; --panel:#0d2431; --panel2:#123240;
  --line:#1c3a49; --line2:#27505f;
  --text:#e6f6fb; --muted:#93b6c4; --muted2:#638190;
  --brand:#06b6d4; --brand2:#22d3ee; --brandsoft:#0a3a45;
  --gold:#f5b301; --gold2:#ffcf3f;
  --green:#22c55e; --greensoft:#0e2e24;
  --red:#f43f5e; --redsoft:#3a1622;
  --amber:#f5cf7a; --ambersoft:#33301a;
  --blue:#38bdf8;
  --shadow:0 16px 42px rgba(0,0,0,.55);
  --font:'Plus Jakarta Sans','Poppins',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(6,182,212,.22), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(56,189,248,.12), transparent 55%),
    var(--bg);
}
body.ocean h1,body.ocean h2,body.ocean h3,body.ocean .stat .val,body.ocean .login-card h1{
  font-weight:800;letter-spacing:-.4px}
body.ocean .topbar{background:rgba(10,28,39,.82)}
body.ocean .brand-badge,body.ocean .topbar .logo{background:radial-gradient(circle at 50% 40%,#0e3644,#0a2530)}
body.ocean .nav-item.active{background:var(--brandsoft);color:var(--brand2)}
body.ocean .chip .dot{background:var(--brand2)}
body.ocean ::-webkit-scrollbar-thumb{background:#1c3a49}

/* ================= ROYAL (LUXURY) THEME =================
   Dark-based — deep navy-violet with gold accents. */
body.royal{
  --bg:#0d0a1f; --bg2:#150f30; --panel:#1a1340; --panel2:#221955;
  --line:#2f2560; --line2:#3f337d;
  --text:#f1ecff; --muted:#b5a8dd; --muted2:#8477b0;
  --brand:#8b5cf6; --brand2:#a78bfa; --brandsoft:#2e1d5e;
  --gold:#f5b301; --gold2:#ffd35c;
  --green:#22c55e; --greensoft:#14301f;
  --red:#f43f5e; --redsoft:#3a1622;
  --amber:#f5cf7a; --ambersoft:#332a16;
  --blue:#38bdf8;
  --shadow:0 16px 42px rgba(20,8,50,.6);
  --font:'Plus Jakarta Sans','Poppins',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(245,179,1,.12), transparent 55%),
    var(--bg);
}
body.royal h1,body.royal h2,body.royal h3,body.royal .stat .val,body.royal .login-card h1{font-weight:800;letter-spacing:-.4px}
body.royal .topbar{background:rgba(21,15,48,.82)}
body.royal .brand-badge,body.royal .topbar .logo{background:radial-gradient(circle at 50% 40%,#2a1e5c,#191140)}
body.royal .nav-item.active{background:var(--brandsoft);color:var(--brand2)}
body.royal .chip .dot{background:var(--brand2)}
body.royal ::-webkit-scrollbar-thumb{background:#2f2560}

/* ================= SLATE (PROFESSIONAL) THEME =================
   Dark-based — graphite grey with a steel-blue accent. */
body.slate{
  --bg:#0f1216; --bg2:#161b22; --panel:#1a2029; --panel2:#222a35;
  --line:#2b333f; --line2:#3a4552;
  --text:#e9edf2; --muted:#9aa6b4; --muted2:#6c7885;
  --brand:#3b82f6; --brand2:#60a5fa; --brandsoft:#17304f;
  --gold:#f5b301; --gold2:#ffcf3f;
  --green:#22c55e; --greensoft:#14301f;
  --red:#ef4444; --redsoft:#3a1520;
  --amber:#f5cf7a; --ambersoft:#33301a;
  --blue:#38bdf8;
  --shadow:0 16px 40px rgba(0,0,0,.5);
  --font:'Plus Jakarta Sans','Poppins',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(59,130,246,.14), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(148,163,184,.08), transparent 55%),
    var(--bg);
}
body.slate .topbar{background:rgba(22,27,34,.85)}
body.slate .brand-badge,body.slate .topbar .logo{background:radial-gradient(circle at 50% 40%,#26303c,#1a222c)}
body.slate .nav-item.active{background:var(--brandsoft);color:var(--brand2)}
body.slate ::-webkit-scrollbar-thumb{background:#2b333f}

/* ================= SUNSET (WARM) THEME =================
   Light-based (body also gets .light) — warm cream with coral accents. */
body.sunset{
  --bg:#fff3ea; --bg2:#ffffff; --panel:#ffffff; --panel2:#fff0e4;
  --line:#f6ddca; --line2:#efc9ad;
  --text:#3a2418; --muted:#8a6b58; --muted2:#b09480;
  --brand:#f97316; --brand2:#fb923c; --brandsoft:#ffe6d2;
  --gold:#e08a00; --gold2:#b5700f;
  --green:#16a34a; --greensoft:#dff5e5;
  --red:#dc2626; --redsoft:#fde7e7;
  --amber:#f5cf7a; --ambersoft:#fbeacf;
  --blue:#0f8fd1;
  --shadow:0 14px 34px rgba(120,60,20,.14);
  --font:'Plus Jakarta Sans','Poppins',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(249,115,22,.16), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(245,179,1,.14), transparent 55%),
    var(--bg);
}
body.sunset .topbar{background:rgba(255,243,234,.9)}
body.sunset .brand-badge,body.sunset .topbar .logo{background:radial-gradient(circle at 50% 40%,#fff0df,#ffe0c4)}
body.sunset .nav-item.active{background:var(--brandsoft);color:#c2560a}
body.sunset .btn-primary,body.sunset .btn{--brand:#f97316;--brand2:#fb923c}
body.sunset ::-webkit-scrollbar-thumb{background:#efc9ad}

/* ================= ROSE (ELEGANT) THEME =================
   Light-based (body also gets .light) — blush pink with magenta accents. */
body.rose{
  --bg:#fdf0f5; --bg2:#ffffff; --panel:#ffffff; --panel2:#fdeaf1;
  --line:#f6d6e2; --line2:#efbdd0;
  --text:#3d1f2c; --muted:#8a5c6e; --muted2:#b08898;
  --brand:#e11d74; --brand2:#f472b6; --brandsoft:#fbdcea;
  --gold:#c98a12; --gold2:#a5730f;
  --green:#16a34a; --greensoft:#dff5e5;
  --red:#dc2626; --redsoft:#fde7e7;
  --amber:#f5cf7a; --ambersoft:#fbeacf;
  --blue:#0f8fd1;
  --shadow:0 14px 34px rgba(150,40,90,.14);
  --font:'Plus Jakarta Sans','Poppins',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(225,29,116,.14), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(244,114,182,.12), transparent 55%),
    var(--bg);
}
body.rose .topbar{background:rgba(253,240,245,.9)}
body.rose .brand-badge,body.rose .topbar .logo{background:radial-gradient(circle at 50% 40%,#fde4ee,#f9cfe0)}
body.rose .nav-item.active{background:var(--brandsoft);color:#c01562}
body.rose .btn-primary,body.rose .btn{--brand:#e11d74;--brand2:#f472b6}
body.rose ::-webkit-scrollbar-thumb{background:#efbdd0}

/* theme picker in Settings */
.theme-choose{display:flex;gap:14px;flex-wrap:wrap}
.theme-opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--text);
  font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px;width:130px;transition:.14s}
.theme-opt:hover{border-color:var(--line2)}
.theme-opt.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.tp{width:100%;height:56px;border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:5px;justify-content:center;overflow:hidden}
.tp span{height:7px;border-radius:4px}
.tp span:nth-child(1){width:60%}.tp span:nth-child(2){width:85%}.tp span:nth-child(3){width:45%}
.tp-light{background:#eef1f8}.tp-light span{background:#c3ccdf}.tp-light span:nth-child(2){background:#6366f1}
.tp-dark{background:#0b1220}.tp-dark span{background:#2c3e63}.tp-dark span:nth-child(2){background:#818cf8}
.tp-mint{background:#d2f0df}.tp-mint span{background:#a6ddbf}.tp-mint span:nth-child(1){background:#13224c}.tp-mint span:nth-child(2){background:#1aae57}
.tp-ocean{background:#07141c}.tp-ocean span{background:#1c3a49}.tp-ocean span:nth-child(2){background:#22d3ee}
.tp-royal{background:#0d0a1f}.tp-royal span{background:#2f2560}.tp-royal span:nth-child(2){background:#a78bfa}
.tp-slate{background:#0f1216}.tp-slate span{background:#2b333f}.tp-slate span:nth-child(2){background:#60a5fa}
.tp-sunset{background:#fff3ea}.tp-sunset span{background:#f6ddca}.tp-sunset span:nth-child(1){background:#3a2418}.tp-sunset span:nth-child(2){background:#f97316}
.tp-rose{background:#fdf0f5}.tp-rose span{background:#f6d6e2}.tp-rose span:nth-child(1){background:#3d1f2c}.tp-rose span:nth-child(2){background:#e11d74}

/* ================= BOTTOM NAV (mobile) ================= */
.bottomnav{display:none}

/* ---------- LOGIN ---------- */
#login{min-height:100%; display:flex; align-items:center; justify-content:center; padding:22px;}
.login-card{width:100%; max-width:410px; background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line); border-radius:22px; padding:34px 28px; box-shadow:var(--shadow);}
.brand-badge{width:88px;height:88px;border-radius:20px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%, #1a2744, #0c1424);border:1px solid var(--line2);
  box-shadow:0 10px 26px rgba(0,0,0,.4);}
.login-card h1{margin:0;text-align:center;font-size:20px;letter-spacing:.3px;line-height:1.3}
.login-card .sub{text-align:center;color:var(--muted);margin:6px 0 24px;font-size:13.5px}
.role-toggle{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);padding:6px;border-radius:14px;border:1px solid var(--line)}
.role-toggle button{flex:1;border:none;background:transparent;color:var(--muted);padding:11px;border-radius:10px;
  font-weight:600;font-size:14px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.role-toggle button.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:13px 14px;border-radius:12px;font-size:15px;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
/* mandatory-field highlighting (bright, so required fields are easy to spot) */
.req-star{color:#ff6b8a;font-weight:800;margin-left:3px;font-size:1.05em}
body.light .req-star{color:#e11d48}
.field.req>label{color:var(--gold2)}
.field.req>input,.field.req>select,.field.req>textarea,.li-row .rq{border-color:var(--gold)!important;box-shadow:0 0 0 1px rgba(245,179,1,.22)}
.field.req>input:focus,.field.req>select:focus,.field.req>textarea:focus,.li-row .rq:focus{box-shadow:0 0 0 3px rgba(245,179,1,.30)!important}
.li-head .rqh{color:var(--gold2)}
.li-head .rqh:after{content:" *";color:#ff6b8a;font-weight:800}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 20px rgba(99,102,241,.35);transition:.12s}
.btn:active{transform:translateY(1px)}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:16px}
.hint{margin-top:18px;text-align:center;font-size:12px;color:var(--muted2);line-height:1.6}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(11,18,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#1a2744,#0c1424);border:1px solid var(--line2);flex:0 0 auto;overflow:hidden}
.topbar .logo img{width:100%;height:100%;object-fit:contain}
.topbar .t-brand{min-width:0}
.topbar .t-name{font-weight:700;font-size:15px;line-height:1.15;max-width:min(50vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .t-sub{font-size:11.5px;color:var(--muted)}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);
  padding:7px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.icon-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);width:38px;height:38px;border-radius:11px;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.hamburger{display:none}
/* wallet: show the amount chip on desktop; the compact 👛 icon only on mobile (where the chip is hidden) */
.wallet-btn{display:none}

.layout{display:flex;min-height:calc(100vh - 63px)}
.sidebar{width:230px;flex:0 0 auto;padding:16px 12px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(17,28,51,.5),transparent);position:sticky;top:63px;height:calc(100vh - 63px);overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;color:var(--muted);
  cursor:pointer;font-weight:600;font-size:14.5px;margin-bottom:4px;transition:.13s;border:1px solid transparent}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.05));color:#fff;border-color:var(--line2)}
.nav-sep{height:1px;background:var(--line);margin:12px 6px}
.nav-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);padding:6px 13px;font-weight:700}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
/* grouped sidebar: each category = a coloured icon-chip header + items hanging off a
   coloured left rail, so sub-items clearly belong to their category */
.nav-group{--grp:var(--muted2);margin:0 3px;padding:7px 0 9px;border-bottom:1px solid var(--line)}
.nav-group:last-of-type{border-bottom:0}
.nav-grouphead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;cursor:pointer;font-family:inherit;
  padding:6px 8px 8px;color:var(--grp);font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;transition:filter .15s}
.nav-grouphead:hover{filter:brightness(1.18)}
.nav-grouphead .ng-ic{width:28px;height:28px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:rgba(255,255,255,.06);
  background:color-mix(in srgb,var(--grp) 22%,transparent);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--grp) 34%,transparent)}
.nav-grouphead .ng-lab{flex:1;text-align:left}
.nav-grouphead .ng-caret{font-size:10px;opacity:.75;transition:transform .18s;color:var(--grp)}
.nav-group.collapsed .ng-caret{transform:rotate(-90deg)}
.nav-group.collapsed .nav-groupbody{display:none}
.nav-groupbody{margin:2px 0 0 15px;padding-left:12px;display:flex;flex-direction:column;gap:2px;
  border-left:2px solid rgba(255,255,255,.1);
  border-left:2px solid color-mix(in srgb,var(--grp) 34%,transparent)}
.nav-groupbody .nav-item{padding:9px 12px;border-radius:0 10px 10px 0;color:var(--muted)}
.nav-groupbody .nav-item .ico{font-size:16px}
.nav-groupbody .nav-item:hover{background:var(--panel);color:var(--text)}
.nav-groupbody .nav-item.active{color:var(--text);border-color:transparent;
  background:rgba(255,255,255,.07);
  background:color-mix(in srgb,var(--grp) 18%,transparent);
  box-shadow:inset 3px 0 0 var(--grp)}

/* min-width:0 lets this flex child shrink to the space left by the sidebar instead of
   overflowing past the viewport (which body{overflow-x:hidden} would then clip, hiding
   the right edge of wide tables & their scroll controls) */
.main{flex:1;min-width:0;padding:22px;max-width:1200px;margin:0 auto;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:22px;letter-spacing:.2px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

.btn-sm{border:none;border-radius:11px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 16px rgba(99,102,241,.32);display:inline-flex;align-items:center;gap:8px}
.btn-sm:active{transform:translateY(1px)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--text);box-shadow:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2c00}
.btn-red{background:linear-gradient(135deg,#ef4444,#f87171)}
.btn-green{background:linear-gradient(135deg,#16a34a,#22c55e)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat .label{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.3px}
.stat .val{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:.3px}
.stat .foot{font-size:12px;color:var(--muted2);margin-top:6px}
.stat .ic{position:absolute;top:14px;right:14px;font-size:22px;opacity:.85}
/* colour only the meaningful figures — green (good) & red (alert); neutral ones (limit/redeem/sales)
   stay in the normal text colour, with a subtle coloured left-rail + icon as the only hint */
.stat.green .val{color:var(--green)} .stat.gold .val{color:var(--text)} .stat.blue .val{color:var(--text)} .stat.red .val{color:#fca5a5} .stat.amber .val{color:var(--amber)}

.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .psub{color:var(--muted);font-size:13px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* let grid children shrink below content width so wide tables scroll INSIDE the panel
   instead of blowing the panel past the screen (content was hidden on mobile) */
.grid2>*,.grid3>*{min-width:0}
.row-actions{display:flex;gap:9px;flex-wrap:wrap}
.note{background:var(--ambersoft);border:1px solid #7a5b1e;color:#f5cf7a;padding:11px 14px;border-radius:11px;font-size:12.5px;line-height:1.5}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:11px 13px 11px 38px;border-radius:11px;font-size:14px;outline:none}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
/* horizontal-scroll affordance for wide tables: edge fades + CLICKABLE arrow buttons
   (so the right-hand action column is reachable even where drag/wheel scrolling
   doesn't work, e.g. inside an Android WebView) */
.scrollx{position:relative}
.scrollx .table-wrap::-webkit-scrollbar{height:9px}
.scrollx .table-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.scrollx::after,.scrollx::before{content:"";position:absolute;top:1px;bottom:1px;width:56px;pointer-events:none;z-index:2;opacity:0;transition:opacity .2s}
.scrollx::after{right:1px;border-radius:0 var(--radius) var(--radius) 0;background:linear-gradient(to left, var(--panel2), transparent)}
.scrollx::before{left:1px;border-radius:var(--radius) 0 0 var(--radius);background:linear-gradient(to right, var(--panel2), transparent)}
.scrollx.scrollable:not(.at-end)::after{opacity:1}
.scrollx.scrollable:not(.at-start)::before{opacity:1}
.sx-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff;line-height:0;padding:0;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 3px 12px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .12s}
.sx-arrow:active{transform:translateY(-50%) scale(.9)}
.sx-arrow.right{right:9px}
.sx-arrow.left{left:9px}
.scrollx.scrollable:not(.at-end) .sx-arrow.right{opacity:1;pointer-events:auto;animation:sxnudge 1.3s ease-in-out infinite}
.scrollx.scrollable:not(.at-start) .sx-arrow.left{opacity:1;pointer-events:auto}
@keyframes sxnudge{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(3px)}}
@media(prefers-reduced-motion:reduce){.scrollx .sx-arrow.right{animation:none}}
/* keep list-table product names from hogging the row on desktop/tablet so action columns stay in view */
@media(min-width:861px){
  #buyList .prodcell b,#saleList .prodcell b{display:inline-block;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  #buyList .prodcell>div,#saleList .prodcell>div{min-width:0}
}
/* click-to-set product image (inventory) */
.thumb-edit{position:relative;cursor:pointer;flex:0 0 auto;line-height:0}
.thumb-edit .thumb-cam{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid var(--panel)}
.thumb-edit:hover{filter:brightness(1.06)}
.imgfind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.imgfind-grid img{width:100%;height:86px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:4px;transition:transform .12s,border-color .12s}
.imgfind-grid img:hover{transform:translateY(-2px);border-color:var(--brand)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* hover a product photo → brighten + lift, and pop a big preview */
.thumb{transition:transform .13s ease,filter .13s ease,box-shadow .13s ease}
.thumb-edit:hover .thumb{transform:scale(1.08);filter:brightness(1.1);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:2}
#imgZoom{position:fixed;z-index:300;width:250px;height:250px;padding:9px;background:#fff;border:1px solid var(--line2);
  border-radius:16px;box-shadow:0 20px 55px rgba(0,0,0,.55);opacity:0;transform:scale(.9);transform-origin:center;
  transition:opacity .13s ease,transform .13s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}
#imgZoom.on{opacity:1;transform:scale(1)}
#imgZoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
/* ===== modern polish: view transitions + micro-interactions ===== */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.main.anim{animation:viewIn .30s cubic-bezier(.22,.61,.36,1)}
@media(prefers-reduced-motion:reduce){ .main.anim{animation:none} }
.stat{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand2);opacity:.95}
.stat.green::before{background:var(--green)}.stat.gold::before{background:var(--gold2)}.stat.blue::before{background:var(--blue)}.stat.red::before{background:#ef4444}.stat.amber::before{background:var(--amber)}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.30);border-color:var(--line2)}
.stat .ic{transition:transform .22s ease}
.stat:hover .ic{transform:scale(1.14) rotate(-5deg);opacity:1}
.tile{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tile .tic{transition:transform .18s ease}
.tile:hover .tic{transform:scale(1.1)}
.btn-sm{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
.btn-sm:hover{transform:translateY(-1px);filter:brightness(1.07)}
.panel{transition:border-color .18s ease,box-shadow .18s ease}
.table-wrap tbody tr{transition:background .12s ease}
.table-wrap tbody tr:hover{background:rgba(255,255,255,.035)}
body.light .table-wrap tbody tr:hover{background:rgba(20,30,60,.04)}
/* dashboard sales sparkline */
.spark{display:flex;align-items:stretch;gap:10px;height:130px;margin-top:16px}
.spark-col{flex:1;display:flex;flex-direction:column;min-width:0;cursor:default}
.spark-barwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.spark-bar{width:70%;max-width:36px;min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--brand2),var(--brand));
  transform-origin:bottom;animation:growBar .6s cubic-bezier(.22,.61,.36,1) both;transition:filter .15s ease}
.spark-col:hover .spark-bar{filter:brightness(1.2)}
.spark-bar.today{background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 14px rgba(245,179,1,.35)}
.spark-lab{font-size:11px;color:var(--muted2);font-weight:600;text-align:center;margin-top:8px}
.spark-col:hover .spark-lab{color:var(--text)}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
thead th{background:var(--panel2);text-align:left;padding:12px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:0}
tbody td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right}
/* clickable ref / invoice / product cells that open a detail view */
.rowlink{cursor:pointer;color:var(--brand2);border-bottom:1px dashed rgba(129,140,248,.5);text-decoration:none}
.rowlink:hover{border-bottom-style:solid;filter:brightness(1.15)}
/* Inventory: freeze the header row (vertical scroll) + Product column (horizontal scroll) */
#invList .table-wrap{max-height:70vh;overflow:auto;background:var(--bg2)}
#invList table{min-width:720px}
#invList thead th{z-index:2}
#invList thead th:first-child{left:0;z-index:3}
#invList tbody td:first-child{position:sticky;left:0;background:var(--bg2);z-index:1;box-shadow:inset -1px 0 0 var(--line)}
#invList thead th:first-child{box-shadow:inset -1px 0 0 var(--line)}
#invList tbody tr:hover td:first-child{background:var(--panel)}
/* out-of-stock group — dimmed like an inactive section */
#invList .inv-zero{opacity:.7}
#invList .inv-zero:hover{opacity:1}
/* Stock Check (temporary count sheet) */
#invList table.sc-grid{min-width:0}
#invList table.sc-grid tbody td:first-child,#invList table.sc-grid thead th:first-child{position:static;box-shadow:none;background:transparent;text-align:center;width:46px}
#invList tr.sc-done{background:rgba(46,216,115,.10)}
#invList tr.sc-done:hover{background:rgba(46,216,115,.16)}
body.light #invList tr.sc-done{background:rgba(31,138,76,.08)}
.sc-chk{width:20px;height:20px;cursor:pointer;accent-color:#2fd873;vertical-align:middle}
.sc-count{width:88px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:700;text-align:right}
.sc-count:focus{outline:none;border-color:var(--gold2,#f5b301)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.tag.cash{background:var(--greensoft);color:#7ee2a8;border:1px solid #1f5136}
.tag.card{background:var(--brandsoft);color:#c7c9ff;border:1px solid #4338ca}
.tag.bank{background:#10233a;color:#8fd3ff;border:1px solid #1d4e73}
.tag.cheque{background:#2a2140;color:#d6c2ff;border:1px solid #6d54b8}
body.light .tag.cheque{background:#efe8ff;color:#6b46c1;border-color:#d6c8f5}
.tag.low{background:var(--redsoft);color:#fca5a5;border:1px solid #7f1d2b}
.tag.ok{background:var(--greensoft);color:#7ee2a8;border:1px solid #1f5136}
.tag.paid{background:var(--greensoft);color:#7ee2a8;border:1px solid #1f5136}
.tag.partial{background:var(--ambersoft);color:#f5cf7a;border:1px solid #7a5b1e}
.tag.due{background:var(--redsoft);color:#fca5a5;border:1px solid #7f1d2b}
.mini-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}
.mini-btn.red{color:#fca5a5;border-color:#7f1d2b}
.mini-btn.gold{color:#f5cf7a;border-color:#7a5b1e}
.mini-btn:hover{background:var(--panel)}
.empty{padding:40px 20px;text-align:center;color:var(--muted2)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.7}

.prodcell{display:flex;align-items:center;gap:11px}
/* Online Orders: show the product name in full — no 2-line clamp, and give the column room */
#onlList table{min-width:960px}
#onlList .prodcell>div{min-width:140px}
#onlList .prodcell b,#onlList .prodcell>div>b{display:inline;-webkit-line-clamp:initial;max-height:none;max-width:none;overflow:visible;white-space:normal;overflow-wrap:break-word;word-break:normal}
.thumb{position:relative;width:56px;height:56px;border-radius:13px;flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#233457,#16233f);border:1px solid var(--line2);color:#aab8d8}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:56%;height:56%}
/* real product photos → bright white card, whole product shown (not cropped) */
.thumb.photo{background:#fff;border-color:#e2e8f4;padding:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.thumb.photo img{object-fit:contain;border-radius:9px}

.thumb.lg{width:120px;height:120px;border-radius:14px}

/* small overlapping thumbnails for multi-product rows (purchases / sales) */
.thumb.st{width:40px;height:40px;border-radius:10px}
.pstack{display:inline-flex;align-items:center;flex:0 0 auto}
.pstack>*{margin-left:-13px;border:2px solid var(--panel)!important;box-shadow:0 2px 7px rgba(0,0,0,.35);transition:transform .12s ease}
.pstack>*:first-child{margin-left:0}
.pstack:hover>*{transform:none}
.pstack>*:hover{transform:translateY(-2px);z-index:5}
.pstack .more{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--muted)}

/* ===== STORE (e-commerce grid) ===== */
.chk{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;white-space:nowrap;cursor:pointer}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-bottom:86px}
.shop-card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.shop-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.32);border-color:var(--brand)}

.shop-cat{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}

.shop-cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;align-items:center;gap:16px;

.thumb .cdot{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}

.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);cursor:pointer;padding:0;transition:.12s}

.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--brand)}

/* ===== FORM FLOW / PROGRESS STEPPER ===== */
.flow{margin:-2px 0 18px;padding:14px 16px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.flow-track{display:flex;align-items:flex-start}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto;z-index:2}
.flow-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  background:var(--bg);border:2px solid var(--line2);color:var(--muted2);transition:background .3s,border-color .3s,color .3s,box-shadow .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.flow-step.done .flow-dot{background:linear-gradient(135deg,var(--green),#3ddc84);border-color:transparent;color:#fff;box-shadow:0 4px 13px rgba(34,197,94,.42)}
.flow-step.active .flow-dot{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.22);transform:scale(1.08)}
.flow-lab{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.2px;white-space:nowrap;transition:color .25s}
.flow-step.done .flow-lab{color:var(--text)}
.flow-step.active .flow-lab{color:var(--brand2)}
.flow-line{flex:1;height:3px;border-radius:3px;background:var(--line2);margin:14px 6px 0;position:relative;overflow:hidden}
.flow-line>i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--green),#3ddc84);border-radius:3px;transition:width .45s cubic-bezier(.22,.61,.36,1)}
.flow-line.fill>i{width:100%}
.flow-bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden;margin-top:14px}
.flow-bar>i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2),var(--gold2));background-size:220% 100%;
  transition:width .5s cubic-bezier(.22,.61,.36,1);animation:flowsheen 2.4s linear infinite}
@keyframes flowsheen{to{background-position:220% 0}}
.flow-step.pulse .flow-dot{animation:flowpop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes flowpop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@media(max-width:560px){.flow-lab{display:none}.flow{padding:12px}}
@media(prefers-reduced-motion:reduce){.flow-dot,.flow-line>i,.flow-bar>i{transition:none}.flow-bar>i{animation:none}.flow-step.pulse .flow-dot{animation:none}}

/* ===== MODAL POP-IN + ROW / RIPPLE / TOAST MICRO-ANIMATIONS ===== */
.modal-back{animation:mbIn .2s ease}
@keyframes mbIn{from{opacity:0}to{opacity:1}}
.modal{animation:mpIn .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes mpIn{from{opacity:0;transform:translateY(20px) scale(.965)}to{opacity:1;transform:none}}
.li-row.row-new,.split-row.row-new{animation:rowIn .32s cubic-bezier(.22,.61,.36,1)}
@keyframes rowIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.btn,.btn-sm,.mini-btn{position:relative;overflow:hidden}
.rippling::after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,.5);transform:translate(-50%,-50%) scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(30);opacity:0}}
.toast{overflow:hidden}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;border-radius:0 0 12px 12px;
  background:linear-gradient(90deg,var(--brand2),var(--brand))}
.toast.show::after{animation:toastbar 2.4s linear forwards}
.toast.bad.show::after{background:linear-gradient(90deg,#fca5a5,var(--red))}
@keyframes toastbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* ===== VIEW TRANSITIONS (scoped to main content) ===== */
#main{view-transition-name:mainview}
@media(prefers-reduced-motion:no-preference){
  ::view-transition-old(mainview){animation:vtOut .2s ease both}
  ::view-transition-new(mainview){animation:vtIn .32s cubic-bezier(.22,.61,.36,1) both}
}
@keyframes vtOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal-back,.modal,.li-row.row-new,.split-row.row-new,.rippling::after,.toast.show::after{animation:none}}

/* ===== REPORTS: daily summary (day cards) & card statement ===== */
.rep-day{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;transition:border-color .18s,box-shadow .18s}
.rep-day:hover{border-color:var(--line2)}
.rep-day.open{box-shadow:0 12px 30px rgba(0,0,0,.24)}
.rep-dayhead{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none}
.rd-cal{width:46px;height:52px;flex:0 0 auto;border-radius:11px;overflow:hidden;text-align:center;border:1px solid var(--line2);background:var(--bg)}
.rd-cal .m{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 0;text-transform:uppercase}
.rd-cal .d{font-size:20px;font-weight:800;line-height:1.45;color:var(--text)}
.rep-dayhead .rd-title{min-width:0;flex:1 1 auto}
.rep-dayhead .rd-title .t1{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-dayhead .rd-title .t2{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-dayhead .rd-net{text-align:right;white-space:nowrap;flex:0 0 auto}
.rep-dayhead .rd-net .lab{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rep-dayhead .rd-net .val{font-size:17px;font-weight:800}
.rep-dayhead .rd-caret{flex:0 0 auto;color:var(--muted2);transition:transform .2s;font-size:12px}
.rep-day.open .rd-caret{transform:rotate(180deg)}
.rd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.rd-kpi{background:var(--panel);padding:10px 13px}
.rd-kpi .k{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rd-kpi .v{font-size:15px;font-weight:800;margin-top:3px;letter-spacing:.2px}
.rd-kpi .s{font-size:10.5px;color:var(--muted2);margin-top:1px}
.rep-daybody{display:none;padding:2px 16px 16px;border-top:1px solid var(--line)}
.rep-day.open .rep-daybody{display:block}
@media(prefers-reduced-motion:no-preference){.rep-day.open .rep-daybody{animation:revealUp .3s cubic-bezier(.22,.61,.36,1)}}
.rep-sec{margin-top:15px}
.rep-sec>.rsh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 2px 8px}
.rep-sec>.rsh .cc{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--text);font-weight:700}
.rep-sec>.rsh .amt{margin-left:auto;color:var(--text);font-weight:800}
.rep-cardhead{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;margin-bottom:8px}
.rep-cardhead .cv{width:300px;max-width:100%;flex:0 0 auto}
.rep-cardhead .cvk{flex:1 1 260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-content:start}
.cvk .kk{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.cvk .kk .k{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.cvk .kk .v{font-size:16px;font-weight:800;margin-top:3px}

/* ===== STAGGERED REVEAL (store grid, dashboard cards & tiles) ===== */
.reveal{opacity:0;animation:revealUp .45s cubic-bezier(.22,.61,.36,1) forwards;animation-delay:var(--d,0ms)}
@keyframes revealUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;animation:none}}

/* ===== SKELETON / IMAGE SHIMMER ===== */
@keyframes shim{to{background-position:-200% 0}}
.imgskel::before{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;
  background:linear-gradient(100deg,var(--panel2) 28%,var(--line2) 48%,var(--panel2) 68%);background-size:200% 100%;animation:shim 1.15s linear infinite}
.imgskel img{position:relative;z-index:1}
.imgloaded img{animation:imgFade .4s ease}
@keyframes imgFade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.imgskel::before{animation:none}.imgloaded img{animation:none}}
.skeleton{background:linear-gradient(100deg,var(--panel2) 28%,var(--line2) 48%,var(--panel2) 68%);background-size:200% 100%;animation:shim 1.15s linear infinite;border-radius:10px}

/* ===== CONFETTI (full-payment celebration) ===== */
#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.cfetti{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;opacity:0;will-change:transform,opacity;
  animation:cfall var(--dur,2.6s) cubic-bezier(.35,.6,.5,1) forwards;animation-delay:var(--cd,0ms)}
@keyframes cfall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:.9;transform:translate3d(var(--dx,0),105vh,0) rotate(var(--rot,540deg))}}

/* ===== ANIMATED TOAST ICON + EMPTY STATES ===== */
.toast.show .i{display:inline-flex;animation:iconPop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes iconPop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.empty{animation:revealUp .4s cubic-bezier(.22,.61,.36,1)}
.empty .big{display:inline-block;animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.toast.show .i,.empty,.empty .big{animation:none}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(4,8,16,.66);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
/* cap the height and let the BODY scroll on its own, so the header & Save
   button stay pinned and tall forms (Add Card, Purchase, Sale) always scroll */
.modal{width:100%;max-width:720px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);margin:auto}
.modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:17px}
.modal-body{flex:1 1 auto;min-height:0;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal-foot{flex:0 0 auto;padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.close-x{background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}

.line-items{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.li-head,.li-row{display:grid;grid-template-columns:2.4fr .9fr 1fr 1fr 34px;gap:8px;align-items:center;padding:9px 12px}
.li-head{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.li-row{border-top:1px solid var(--line)}
.li-row input,.li-row select{padding:9px;font-size:13.5px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text);width:100%}
.li-x{background:var(--redsoft);border:1px solid #7f1d2b;color:#fca5a5;border-radius:8px;cursor:pointer;height:34px}
.totbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--muted)}
.totrow.grand{border-top:1px dashed var(--line2);margin-top:8px;padding-top:12px;font-size:19px;font-weight:800;color:var(--text)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);padding:13px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.25s;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#1f5136}.toast.ok .i{color:var(--green)}
.toast.bad{border-color:#7f1d2b}.toast.bad .i{color:var(--red)}

.owner-lock{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--muted)}
.owner-lock .big{font-size:46px;margin-bottom:14px}

/* ===== CREDIT CARDS + BELL ===== */
.bellwrap{position:relative}
.bell-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg2)}
.bell-pop{position:absolute;top:48px;right:0;width:310px;max-width:88vw;background:var(--panel);border:1px solid var(--line2);
  border-radius:14px;box-shadow:var(--shadow);z-index:90;overflow:hidden}
.bell-pop .bh{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.bell-pop .bi2{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center;cursor:pointer}
.bell-pop .bi2:last-child{border-bottom:none}
.bell-pop .bi2:hover{background:var(--panel2)}
.bell-pop .bi2 .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.bell-empty{padding:22px 14px;text-align:center;color:var(--muted2);font-size:13px}

.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccard{position:relative;border-radius:18px;padding:18px;color:#fff;min-height:190px;cursor:pointer;
  box-shadow:0 14px 32px rgba(0,0,0,.30);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  border:1px solid rgba(255,255,255,.16)}
.ccard::after{content:"";position:absolute;inset:0;background:radial-gradient(150px 150px at 88% 8%,rgba(255,255,255,.25),transparent 60%);pointer-events:none}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .cc-name{font-weight:800;font-size:16px;letter-spacing:.3px}
.ccard .cc-bank{font-size:11.5px;opacity:.85;margin-top:1px}
.ccard .cc-holder{font-size:12.5px;font-weight:800;opacity:1;margin-top:3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ccard .cc-chip{width:40px;height:29px;border-radius:6px;background:linear-gradient(135deg,#f7e08a,#c9a43b);opacity:.95;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ccard .cc-num{font-size:16.5px;letter-spacing:2.5px;opacity:.96;margin-bottom:2px}
.ccard .cc-foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;gap:10px}
.ccard .cc-avail{font-size:20px;font-weight:800;letter-spacing:.3px}
.ccbar{height:7px;border-radius:6px;background:rgba(255,255,255,.30);overflow:hidden;margin:9px 0 8px}
.ccbar>i{display:block;height:100%;background:#fff;border-radius:6px}
.cc-due{display:inline-block;background:rgba(0,0,0,.22);padding:3px 9px;border-radius:999px;font-weight:700;margin-top:3px}
.cc-due.warn{background:rgba(255,70,70,.45)}
.cc-pct{position:absolute;top:16px;right:64px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
/* light-coloured cards (e.g. Simplylife yellow, liv silver) need dark text */
.ccard.cc-dark{color:#141a22}
.ccard.cc-dark .cc-holder{color:#141a22;text-shadow:none}
.ccard.cc-dark .ccbar{background:rgba(0,0,0,.16)}
.ccard.cc-dark .ccbar>i{background:rgba(0,0,0,.72)}
.ccard.cc-dark .cc-due{background:rgba(0,0,0,.12)}
.ccard.cc-dark .cc-due.warn{background:rgba(200,30,30,.35)}
.ccard.cc-dark .cc-pct{background:rgba(0,0,0,.12)}
.ccard.cc-dark::after{background:radial-gradient(150px 150px at 88% 8%,rgba(255,255,255,.55),transparent 60%)}
.ccard.cc-dark .cc-chip{background:linear-gradient(135deg,#e6d79a,#b5912f)}

.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}

/* ===== dashboard quick-tiles (screenshot style) ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-bottom:8px}
.tilegroup{margin-bottom:16px;--grp:var(--muted2)}
.tilegroup-head{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--grp);font-weight:800;margin:2px 2px 10px;display:flex;align-items:center;gap:8px;padding-left:10px;border-left:3px solid var(--grp);line-height:1.1}
.tilegroup-head span{font-size:14px}
.tile{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:15px;padding:16px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;text-align:center;transition:.14s;min-height:96px}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.18)}
.tile .tic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.06));border:1px solid var(--line2)}
.tile .tlab{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.25}
.li-hint{padding:1px 12px 9px;color:var(--muted2);font-size:11px}
.cat-head{display:flex;align-items:center;gap:9px;margin:18px 0 9px;font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--muted)}
.cat-head .cc{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--text)}
.cat-head .own-name{color:var(--text);font-weight:800;font-size:14.5px;letter-spacing:.2px}
.split-row{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 34px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.split-row select,.split-row input{padding:9px;font-size:13.5px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text);width:100%}

input.cardpick{padding:9px;font-size:13.5px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text);width:100%}

.urgent-banner .ub-head{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:8px;color:var(--text)}

.pickrow .pk-main{font-weight:700}
.pickrow .pk-sub{font-size:12px;color:var(--muted)}

#invoiceArea{background:#fff;color:#111}

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="brand-badge" id="loginBadge"></div>
    <h1>Little Angel Electronics</h1>
    <div class="sub">General Trading · Inventory · Billing — Abu Dhabi, UAE</div>
    <div class="field"><label>Phone Number</label><input id="loginUser" autocomplete="off" inputmode="tel" placeholder="Enter phone number" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <div class="field"><label>PIN</label><input id="loginPass" type="password" inputmode="numeric" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn" onclick="doLogin()">Sign In →</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <button class="icon-btn hamburger" onclick="toggleNav()">☰</button>
    <div class="logo" id="topLogo"></div>
    <div class="t-brand">
      <div class="t-name" id="brandName">Little Angel Electronics</div>
      <div class="t-sub" id="brandCity">Abu Dhabi, UAE</div>
    </div>
    <div class="spacer"></div>
    <span class="chip"><span class="dot"></span><span id="who">Owner</span></span>
    <span class="chip" id="walletChip" style="display:none;cursor:pointer" onclick="toggleWalletPop(event)">👛 <b id="walletChipAmt" style="color:var(--text)">—</b></span>
    <div class="bellwrap" id="walletWrap" style="display:none">
      <button class="icon-btn wallet-btn" title="My cash wallet" onclick="toggleWalletPop(event)">👛</button>
      <div class="bell-pop hidden" id="walletPop"></div>
    </div>
    <div class="bellwrap" id="bellWrap" data-owner>
      <button class="icon-btn" title="Card payment reminders" onclick="toggleBell(event)">🔔<span class="bell-badge hidden" id="bellBadge">0</span></button>
      <div class="bell-pop hidden" id="bellPop"></div>
    </div>
    <button class="icon-btn" id="soundBtn" title="Typing sound on / off" onclick="toggleSound()">🔊</button>
    <button class="icon-btn" id="themeBtn" title="Switch light / dark" onclick="toggleTheme()">🌙</button>

  <div class="layout">

  <nav class="bottomnav" id="bottomnav">

    <button onclick="toggleNav()"><span class="bi">☰</span>More</button>
  </nav>
</div>

<!-- Supabase JS SDK (loads global `supabase`; app still works offline if this fails) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- PDF bill generation (html2canvas -> jsPDF); needs internet the first time -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<!-- Excel export (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================
   Little Angel Electronics — offline single-file app
   Data: localStorage (per device) + optional Supabase cloud sync.
   Cloud: whole app state stored as ONE JSON row in table `app_state`.
   Designed for GitHub + Vercel + Supabase (500MB) migration:
   - product photos stored as URLs or small thumbnails, not big blobs
   - payment ledger kept per transaction
   ========================================================= */

const KEY='lae_db_v1';
const SKEY='lae_session_v1';   // remembers who is logged in, so a refresh keeps the session
/* roles & permissions — declared before load()/seed()/migrate() use them */
const ALL_VIEWS=['dashboard','buystore','shop','purchases','online','sales','payments','cards','cardpref','lenders','giftcards','cashbook','inventory','products','compare','profit','activity','settings'];
const WORKER_DEFAULT=['buystore','shop','purchases','sales','cashbook','giftcards'];
const VIEW_LABELS={dashboard:'Dashboard',buystore:'Buy Store',shop:'Sell Store',purchases:'Purchases',online:'Online Orders',sales:'Sales & Billing',payments:'Payments',cards:'Credit Cards',cardpref:'Card Preference',lenders:'Card Lenders',giftcards:'Gift Cards',cashbook:'Cash Book',inventory:'Inventory',products:'Products',compare:'Price Compare',bsreport:'Buy & Sell Report',daybook:'Daily Summary',cardreport:'Card Statement',cardusage:'Card Usage',profit:'Profit & Reports',activity:'Activity Log',settings:'Settings'};
/* Single source of truth for menu → sub-menu grouping (sidebar + dashboard tiles share it) */
const NAV_GROUPS=[
  {tag:'Overview', ic:'📊', color:'#818cf8', items:[
    {v:'dashboard', ic:'📊', lab:'Dashboard'} ]},
  {tag:'Buy & Stock', ic:'📦', color:'#f5b301', items:[
    {v:'buystore',  ic:'🛒', lab:'Buy Store'},
    {v:'purchases', ic:'📥', lab:'Purchases'},
    {v:'giftcards', ic:'🎁', lab:'Gift Cards'},
    {v:'online',    ic:'🛒', lab:'Online Orders', badge:'onlBadge'},
    {v:'inventory', ic:'📦', lab:'Inventory'},
    {v:'products',  ic:'🏷️', lab:'Products'},
    {v:'compare',   ic:'🔎', lab:'Price Compare'} ]},
  {tag:'Sell & Bill', ic:'🧾', color:'#22c55e', items:[
    {v:'shop',     ic:'🛍️', lab:'Sell Store'},
    {v:'sales',    ic:'🧾', lab:'Sales & Billing'},
    {v:'payments', ic:'💵', lab:'Payments'} ]},
  {tag:'Cash & Cards', ic:'💳', color:'#38bdf8', items:[
    {v:'cashbook',  ic:'🧰', lab:'Cash Book'},
    {v:'cards',     ic:'💳', lab:'Credit Cards', owner:true},
    {v:'cardpref',  ic:'⭐', lab:'Card Preference', owner:true},
    {v:'lenders',   ic:'🤝', lab:'Card Lenders', owner:true, badge:'lenderBadge'} ]},
  {tag:'Reports', ic:'📈', color:'#fbbf24', owner:true, items:[
    {v:'bsreport',   ic:'🛒', lab:'Buy & Sell Report', owner:true},
    {v:'daybook',    ic:'📅', lab:'Daily Summary', owner:true},
    {v:'cardreport', ic:'💳', lab:'Card Statement', owner:true},
    {v:'cardusage',  ic:'📊', lab:'Card Usage', owner:true},
    {v:'rcard',      ic:'💳', lab:'Recent Credit Card', owner:true},
    {v:'cusage',     ic:'📈', lab:'Card Usage & Cashback', owner:true},
    {v:'cprefrep',   ic:'⭐', lab:'Card Preference', owner:true} ]},
  {tag:'Management', ic:'🛠️', color:'#f472b6', owner:true, items:[
    {v:'approvals', ic:'📝', lab:'Approvals', owner:true, badge:'apprBadge'},
    {v:'activity',  ic:'🧾', lab:'Activity Log', owner:true},
    {v:'profit',    ic:'💰', lab:'Profit & Reports', owner:true},
    {v:'settings',  ic:'⚙️', lab:'Settings'} ]},
];
function navGroupOf(v){ return NAV_GROUPS.findIndex(g=>g.items.some(it=>it.v===v)); }

/* =========================================================
   SUPABASE CLOUD SYNC  (single shared JSON row)
   1) Create a free project at https://supabase.com
   2) Project Settings → API → copy "Project URL" and the "anon public" key
   3) Paste them below. Leave as-is to run offline (localStorage only).
   4) Run the SQL from SUPABASE_SETUP.sql in the Supabase SQL Editor.
   ========================================================= */
const SUPABASE_URL      = 'https://qnbhzeciebrpuuvzoljc.supabase.co'; // Project URL
const SUPABASE_ANON_KEY = 'sb_publishable_atQ3d2SUrIgvyaP2DhqhAg_oM8ciR4U'; // publishable (anon) key
const CLOUD_ROW_ID = 'main';   // one row holds the whole shop's data
let sb = null;
const cloudOn = () => /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL)
  && !SUPABASE_URL.includes('YOUR-PROJECT')
  && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR-')
  && typeof window!=='undefined' && window.supabase;
function cloudInit(){ if(cloudOn() && !sb){ try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ sb=null; } } return sb; }

/* ---------- sync internals: concurrency-safe writes + live merge ----------
   The whole DB is one JSON row. To avoid one device overwriting another's
   changes, every cloud write is guarded by the row's updated_at token, and a
   conflict triggers a 3-way merge (baseline / this device / cloud) before we
   retry. A Realtime subscription pulls & merges other devices' changes live. */
const _clone = x => JSON.parse(JSON.stringify(x==null?null:x));
const _byId  = arr => { const m={}; (arr||[]).forEach(x=>{ if(x&&x.id!=null) m[x.id]=x; }); return m; };
let   cloudUpdatedAt = null;   // updated_at token of the cloud copy we last synced with
let   _sub = null;             // realtime channel
let   baseline = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY+'_base')); }catch(e){ return null; } })();
function _setBaseline(){ baseline=_clone(DB); try{ localStorage.setItem(KEY+'_base', JSON.stringify(baseline)); }catch(e){} }

/* merge one collection of {id,...} records. Adds & edits are unioned (a record
   present on either side is kept); real deletions are NOT inferred here — they are
   carried explicitly by tombstones (see _mergeDeleted / _maintainTombstones) so a
   delete always wins and can't be resurrected by a stale copy on another device.
   preferLocal decides same-record edit conflicts (our write vs theirs). */
function _mergeColl(base, local, remote, preferLocal){
  const bi=_byId(base), li=_byId(local), ri=_byId(remote);
  const ids=new Set([...Object.keys(li),...Object.keys(ri)]);   // only records actually present somewhere
  const out=[];
  ids.forEach(id=>{
    const b=bi[id], l=li[id], r=ri[id];
    const sB=b?JSON.stringify(b):null, sL=l?JSON.stringify(l):null, sR=r?JSON.stringify(r):null;
    if(l && r){                                   // present on both sides → resolve the edit
      if(sL===sR) out.push(l);
      else if(b && sB===sL) out.push(r);          // only remote edited it
      else if(b && sB===sR) out.push(l);          // only local edited it
      else out.push(preferLocal ? l : r);         // both edited (or no base) → tie-break
    } else if(l){ out.push(l); }                  // present locally only → keep (added or edited)
    else if(r){ out.push(r); }                    // present remotely only → keep
  });
  return out;
}
/* merge two tombstone maps ({id:{t,dead}}) — the newer entry (larger t) wins,
   so a later "revive" (dead:false, e.g. reloading demo) beats an older delete. */
function _mergeDeleted(local, remote){
  const out={}, L=local||{}, R=remote||{};
  new Set([...Object.keys(L),...Object.keys(R)]).forEach(id=>{
    const a=L[id], b=R[id];
    out[id]= (a&&b) ? ((a.t||0)>=(b.t||0)?a:b) : (a||b);
  });
  return out;
}
function _mergeObj(base, local, remote, preferLocal){   // 3-way merge of a flat object (settings)
  base=base||{}; local=local||{}; remote=remote||{};
  const out={...local}; const keys=new Set([...Object.keys(local),...Object.keys(remote)]);
  keys.forEach(k=>{
    const bv=JSON.stringify(base[k]), lv=JSON.stringify(local[k]), rv=JSON.stringify(remote[k]);
    if(lv===rv) out[k]=local[k];
    else if(lv===bv) out[k]=remote[k];            // only remote changed
    else if(rv===bv) out[k]=local[k];             // only local changed
    else out[k]= preferLocal ? local[k] : remote[k];
  });
  return out;
}
function mergeDB(base, local, remote, preferLocal){
  base=base||{}; local=local||{}; remote=remote||{};
  const out=_clone(local);
  const deleted=_mergeDeleted(local.deleted, remote.deleted);
  const isDead=id=> !!(deleted[id] && deleted[id].dead);
  ['users','products','purchases','sales','cards','giftcards','cash','approvals','activity','online','lenders'].forEach(k=>{
    out[k]=_mergeColl(base[k]||[], local[k]||[], remote[k]||[], preferLocal)
             .filter(x=> !(x && x.id!=null && isDead(x.id)));   // tombstoned records stay deleted everywhere
  });
  out.deleted=deleted;
  out.counters=out.counters||{}; const lc=local.counters||{}, rc=remote.counters||{};
  new Set([...Object.keys(lc),...Object.keys(rc)]).forEach(k=>{ out.counters[k]=Math.max(+lc[k]||0,+rc[k]||0); });
  out.settings=_mergeObj(base.settings, local.settings, remote.settings, preferLocal);
  return out;
}

let _pushT=null;
function cloudPush(){                  // debounced, concurrency-safe save of the whole DB
  if(!cloudInit()) return;
  clearTimeout(_pushT);
  _pushT=setTimeout(()=>{ cloudSaveNow().catch(e=>console.warn('Cloud save failed:',e&&e.message||e)); },600);
}
async function cloudSaveNow(){
  if(!cloudInit()) return false;
  for(let attempt=0; attempt<5; attempt++){
    const payload={ data:DB, updated_at:new Date().toISOString() };
    try{
      let q=sb.from('app_state').update(payload).eq('id',CLOUD_ROW_ID);
      if(cloudUpdatedAt) q=q.eq('updated_at',cloudUpdatedAt);   // only write if nobody changed it since
      const { data:rows, error }=await q.select('updated_at');
      if(error) throw error;
      if(rows && rows.length){ cloudUpdatedAt=rows[0].updated_at; _setBaseline(); return true; }
      // 0 rows updated → the row is new, or someone else wrote first. Fetch the truth.
      const { data:cur, error:e2 }=await sb.from('app_state').select('data,updated_at').eq('id',CLOUD_ROW_ID).maybeSingle();
      if(e2) throw e2;
      if(!cur){                                                 // row doesn't exist yet → create it
        const ins=await sb.from('app_state').insert({ id:CLOUD_ROW_ID, ...payload }).select('updated_at');
        if(!ins.error && ins.data && ins.data.length){ cloudUpdatedAt=ins.data[0].updated_at; _setBaseline(); return true; }
        cloudUpdatedAt=null; continue;                          // lost the insert race → retry as update
      }
      // conflict → merge cloud into local (our in-flight edits win same-record ties), then retry
      DB=mergeDB(baseline, DB, cur.data, true);
      cloudUpdatedAt=cur.updated_at;
      try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
      reSync();
    }catch(e){ console.warn('Cloud save error:',e&&e.message||e); toast('Cloud save failed — saved on this device only','bad'); return false; }
  }
  return false;
}
async function cloudForcePush(){       // authoritative overwrite of the cloud row with THIS device's data
  if(!cloudInit()){ _setBaseline(); return true; }   // cloud off → local baseline is enough
  try{
    const payload={ id:CLOUD_ROW_ID, data:DB, updated_at:new Date().toISOString() };
    const { data, error }=await sb.from('app_state').upsert(payload).select('updated_at');
    if(error) throw error;
    if(data && data.length) cloudUpdatedAt=data[0].updated_at;
    _setBaseline();
    return true;
  }catch(e){ console.warn('Cloud force-push failed:',e&&e.message||e); return false; }
}
async function cloudPull(){            // fetch cloud copy on boot — the CLOUD is the source of truth
  if(!cloudInit()) return false;
  try{
    const { data, error }=await sb.from('app_state').select('data,updated_at').eq('id',CLOUD_ROW_ID).maybeSingle();
    if(error) throw error;
    const cloud=data && data.data;
    const cloudHasData=cloud && Array.isArray(cloud.users) && cloud.users.length>0;
    if(cloudHasData){
      DB=_clone(cloud);                 // ADOPT the cloud copy wholesale — never merge stale local data up
      if(!DB.settings) DB.settings=seed().settings;
      migrate();
      cloudUpdatedAt=data.updated_at;
      _setBaseline();
      localStorage.setItem(KEY, JSON.stringify(DB));

function darken(hex,f){ const h=(hex||'#888888').replace('#',''); let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);

/* =========================================================
   INVENTORY & COST ENGINE (moving weighted average)
   ========================================================= */
function computeEngine(){
  const tx=[];
  DB.purchases.forEach(p=>{const f=purchaseCostFactor(p);purchaseItems(p).forEach(it=>tx.push({t:'buy',date:p.date,seq:p.id,productId:it.productId,qty:+it.qty,rate:(+it.rate||0)*f}));});
  DB.sales.forEach(s=>s.items.forEach(it=>tx.push({t:'sell',date:s.date,seq:s.id,productId:it.productId,qty:+it.qty,rate:+it.rate,saleId:s.id})));
  tx.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.t==='buy'&&b.t==='sell'?-1 : a.t==='sell'&&b.t==='buy'?1 : (a.seq<b.seq?-1:1)));
  const stock={}, saleCost={};
  for(const e of tx){
    const st=stock[e.productId]||(stock[e.productId]={qty:0,totalCost:0});
    if(e.t==='buy'){ st.qty+=e.qty; st.totalCost+=e.qty*e.rate; }
    else{
      const avg= st.qty>0? st.totalCost/st.qty : (lastKnownRate(e.productId)||0);
      const cost=avg*e.qty; saleCost[e.saleId]=(saleCost[e.saleId]||0)+cost;
      st.qty-=e.qty; st.totalCost-=cost;
      if(st.qty<=0){st.qty=Math.max(0,st.qty);st.totalCost=Math.max(0,st.totalCost);}
    }
  }
  return {stock,saleCost};
}
function lastKnownRate(pid){ const rows=[]; DB.purchases.forEach(p=>purchaseItems(p).forEach(it=>{ if(it.productId===pid)rows.push({date:p.date,rate:+it.rate||0}); })); rows.sort((a,b)=>a.date<b.date?-1:1); return rows.length?rows[rows.length-1].rate:0; }
function productById(id){ return DB.products.find(p=>p.id===id); }
function stockOf(pid,eng){ eng=eng||computeEngine(); const s=eng.stock[pid]; return s?s.qty:0; }
function avgCostOf(pid,eng){ eng=eng||computeEngine(); const s=eng.stock[pid]; return s&&s.qty>0? s.totalCost/s.qty : lastKnownRate(pid); }
/* average BUYING price for reference display — respects the Settings averaging window (falls back to moving-average) */
function avgBuyPrice(pid,eng){
  const st=S(), unit=st.avgWindowUnit||'all', n=+st.avgWindowN||0;
  if(unit==='all'||n<=0) return avgCostOf(pid,eng);
  const days = unit==='months'? n*30 : n;
  const cutoff=new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-days);
  const cutISO=isoDate(cutoff);
  let q=0,c=0;
  DB.purchases.forEach(p=>{ if((p.date||'')>=cutISO){ const f=purchaseCostFactor(p); purchaseItems(p).forEach(it=>{ if(it.productId===pid){ q+=+it.qty||0; c+=(+it.qty||0)*(+it.rate||0)*f; } }); } });
  return q>0? c/q : avgCostOf(pid,eng);
}
function avgWindowLabel(){ const st=S(); if((st.avgWindowUnit||'all')==='all'||!(+st.avgWindowN>0))return 'all-time'; return 'last '+(+st.avgWindowN)+' '+st.avgWindowUnit; }
function netOf(s){ return (s.net!==undefined) ? s.net : ((s.subtotal||0) - (s.discount||0)); } // sale revenue excl VAT

/* ---- purchase helpers (support legacy single-item + new multi-item) ---- */
function purchaseItems(p){ return (p.items&&p.items.length)? p.items : (p.productId!==undefined?[{productId:p.productId,qty:+p.qty||0,rate:+p.rate||0}]:[]); }
function purchaseGross(p){ return purchaseItems(p).reduce((a,it)=>a+(+it.qty||0)*(+it.rate||0),0); }
function purchaseDiscount(p){ const g=purchaseGross(p); return Math.min(g,Math.max(0,+p.discount||0)); }
function purchaseTotal(p){ return Math.max(0, purchaseGross(p)-purchaseDiscount(p)); }
/* discount lowers the real cost of goods — spread it proportionally across items */
function purchaseCostFactor(p){ const g=purchaseGross(p); return g>0? (g-purchaseDiscount(p))/g : 1; }
function purchaseQty(p){ return purchaseItems(p).reduce((a,it)=>a+(+it.qty||0),0); }

/* count-up animation for headline figures (parses the formatted value, keeps prefix/suffix) */
function animateCounts(root){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  (root||document).querySelectorAll('.stat .val').forEach(el=>{
    if(el.dataset.cu)return; const txt=el.textContent.trim();
    const m=txt.match(/^(.*?)(-?\d[\d,]*(?:\.\d+)?)(.*)$/s); if(!m)return;
    const pre=m[1], numStr=m[2], suf=m[3], target=parseFloat(numStr.replace(/,/g,'')); if(!isFinite(target))return;
    const dec=(numStr.split('.')[1]||'').length; el.dataset.cu='1';
    const fmt=v=>pre+v.toLocaleString('en-AE',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
    const dur=750, t0=performance.now();
    (function step(now){ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(target*e); if(p<1)requestAnimationFrame(step); else el.textContent=fmt(target); })(t0);
  });
}

/* Merge a duplicate product into another: move all purchases/sales/online orders
   & competitor prices onto the kept product, then remove this one. Stock and the

function mergeProduct(id){
  if(!requireOnline())return;
  if(!isOwner())return toast('Only the owner can merge products',1);
  const src=productById(id); if(!src)return;
  const eng=computeEngine();
  const others=DB.products.filter(p=>p.id!==id).sort((a,b)=>a.name.localeCompare(b.name));
  if(!others.length)return toast('Add another product to merge into first',1);
  const bought=totalBought(id), sold=totalSold(id), comps=(src.compPrices||[]).length;
  openModal('Merge product',`
    <p style="margin:0 0 12px;color:var(--muted);font-size:13.5px">Move everything recorded under <b style="color:var(--text)">${esc(src.name)}</b> into the product you keep, then remove this one. Use it when the same item was entered twice — e.g. the wrong product was picked during a purchase.</p>
    <div class="field"><label>Keep this product (merge “${esc(src.name)}” into it) *</label>
      <select id="mg_target" class="srch"><option value="">— choose the product to keep —</option>${others.map(p=>`<option value="${p.id}">${esc(p.name)} — stock ${num(stockOf(p.id,eng))} · avg ${money(avgCostOf(p.id,eng))}</option>`).join('')}</select></div>
    <div class="li-hint" style="margin-top:2px">Moving <b>${num(bought)}</b> bought · <b>${num(sold)}</b> sold${comps?` · ${comps} competitor price${comps===1?'':'s'}`:''}. Stock &amp; average buying cost recalculate across the combined history. This cannot be undone.</div>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn-sm" onclick="mergeProductConfirm('${id}')">Merge</button>`);
}
function mergeProductConfirm(id){
  const tid=$('#mg_target')?.value||''; if(!tid)return toast('Choose the product to keep',1);
  const src=productById(id), tgt=productById(tid); if(!src||!tgt||src===tgt)return;
  confirmBox('Merge products?',`Move all history from <b>${esc(src.name)}</b> into <b>${esc(tgt.name)}</b>, then delete <b>${esc(src.name)}</b>? This cannot be undone.`,()=>{
    const repoint=it=>{ if(it&&it.productId===id)it.productId=tid; };
    DB.purchases.forEach(p=>{ if(p.productId===id)p.productId=tid; purchaseItems(p).forEach(repoint); });
    DB.sales.forEach(s=>(s.items||[]).forEach(repoint));
    (DB.online||[]).forEach(o=>(o.items||[]).forEach(repoint));
    if(src.compPrices&&src.compPrices.length) tgt.compPrices=(tgt.compPrices||[]).concat(src.compPrices);
