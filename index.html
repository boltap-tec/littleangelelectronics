/* =========================================================
   INVENTORY & COST ENGINE (moving weighted average)
   ========================================================= */
function computeEngine(){
  const tx=[];
  DB.purchases.forEach(p=>{const f=purchaseCostFactor(p);purchaseItems(p).forEach(it=>tx.push({t:'buy',date:p.date,seq:p.id,productId:it.productId,qty:+it.qty,rate:(+it.rate||0)*f}));});
  DB.sales.forEach(s=>s.items.forEach(it=>tx.push({t:'sell',date:s.date,seq:s.id,productId:it.productId,qty:+it.qty,rate:+it.rate,saleId:s.id})));
  tx.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.t==='buy'&&b.t==='sell'?-1 : a.t==='sell'&&b.t==='buy'?1 : (a.seq<b.seq?-1:1)));
  const stock={}, saleCost={};
  for(const e of tx){
    const st=stock[e.productId]||(stock[e.productId]={qty:0,totalCost:0});
    if(e.t==='buy'){ st.qty+=e.qty; st.totalCost+=e.qty*e.rate; }
    else{
      const avg= st.qty>0? st.totalCost/st.qty : (lastKnownRate(e.productId)||0);
      const cost=avg*e.qty; saleCost[e.saleId]=(saleCost[e.saleId]||0)+cost;
      st.qty-=e.qty; st.totalCost-=cost;
      if(st.qty<=0){st.qty=Math.max(0,st.qty);st.totalCost=Math.max(0,st.totalCost);}
    }
  }
  return {stock,saleCost};
}
function lastKnownRate(pid){ const rows=[]; DB.purchases.forEach(p=>purchaseItems(p).forEach(it=>{ if(it.productId===pid)rows.push({date:p.date,rate:+it.rate||0}); })); rows.sort((a,b)=>a.date<b.date?-1:1); return rows.length?rows[rows.length-1].rate:0; }
function productById(id){ return DB.products.find(p=>p.id===id); }
function stockOf(pid,eng){ eng=eng||computeEngine(); const s=eng.stock[pid]; return s?s.qty:0; }
function avgCostOf(pid,eng){ eng=eng||computeEngine(); const s=eng.stock[pid]; return s&&s.qty>0? s.totalCost/s.qty : lastKnownRate(pid); }
/* average BUYING price for reference display — respects the Settings averaging window (falls back to moving-average) */
function avgBuyPrice(pid,eng){
  const st=S(), unit=st.avgWindowUnit||'all', n=+st.avgWindowN||0;
  if(unit==='all'||n<=0) return avgCostOf(pid,eng);
  const days = unit==='months'? n*30 : n;
  const cutoff=new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-days);
  const cutISO=isoDate(cutoff);
  let q=0,c=0;
  DB.purchases.forEach(p=>{ if((p.date||'')>=cutISO){ const f=purchaseCostFactor(p); purchaseItems(p).forEach(it=>{ if(it.productId===pid){ q+=+it.qty||0; c+=(+it.qty||0)*(+it.rate||0)*f; } }); } });
  return q>0? c/q : avgCostOf(pid,eng);
}

function netOf(s){ return (s.net!==undefined) ? s.net : ((s.subtotal||0) - (s.discount||0)); } // sale revenue excl VAT

/* ---- purchase helpers (support legacy single-item + new multi-item) ---- */
function purchaseItems(p){ return (p.items&&p.items.length)? p.items : (p.productId!==undefined?[{productId:p.productId,qty:+p.qty||0,rate:+p.rate||0}]:[]); }
function purchaseGross(p){ return purchaseItems(p).reduce((a,it)=>a+(+it.qty||0)*(+it.rate||0),0); }
function purchaseDiscount(p){ const g=purchaseGross(p); return Math.min(g,Math.max(0,+p.discount||0)); }
function purchaseTotal(p){ return Math.max(0, purchaseGross(p)-purchaseDiscount(p)); }
/* discount lowers the real cost of goods — spread it proportionally across items */
function purchaseCostFactor(p){ const g=purchaseGross(p); return g>0? (g-purchaseDiscount(p))/g : 1; }
function purchaseQty(p){ return purchaseItems(p).reduce((a,it)=>a+(+it.qty||0),0); }

  const user=DB.users.find(x=>{

function go(v){
  // Use the View Transitions API for a smooth cross-fade between screens where supported,
  // falling back to the CSS enter-animation otherwise. Reduced-motion users skip both.
  if(document.startViewTransition && !reducedMotion()){
    const t=document.startViewTransition(()=>_go(v,true));
    // a rapid re-navigation skips the previous transition; swallow its expected rejection
    t.ready&&t.ready.catch(()=>{}); t.finished&&t.finished.catch(()=>{});
  }
  else _go(v,false);
}

/* count-up animation for headline figures (parses the formatted value, keeps prefix/suffix) */
function animateCounts(root){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  (root||document).querySelectorAll('.stat .val').forEach(el=>{
    if(el.dataset.cu)return; const txt=el.textContent.trim();
    const m=txt.match(/^(.*?)(-?\d[\d,]*(?:\.\d+)?)(.*)$/s); if(!m)return;
    const pre=m[1], numStr=m[2], suf=m[3], target=parseFloat(numStr.replace(/,/g,'')); if(!isFinite(target))return;
    const dec=(numStr.split('.')[1]||'').length; el.dataset.cu='1';
    const fmt=v=>pre+v.toLocaleString('en-AE',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
    const dur=750, t0=performance.now();
    (function step(now){ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(target*e); if(p<1)requestAnimationFrame(step); else el.textContent=fmt(target); })(t0);
  });
}

function dashInvProfit(eng){
  const rows=DB.products.map(p=>{ const qty=stockOf(p.id,eng), avg=avgCostOf(p.id,eng), val=(qty>0?qty:0)*avg;

    return {p,qty,avg,val,sold,rev,prof}; })

  const map={}; days.forEach(x=>map[x.key]=x);

  const week=days.reduce((a,d)=>a+d.total,0);

  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=512; let{width:w,height:h}=img; if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    _imgBuf=c.toDataURL('image/jpeg',0.72); if($('#p_img'))$('#p_img').value=''; prodPreview(); toast('Photo added (shrunk to save space)');
  }; img.onerror=()=>toast('Could not read image',1); img.src=r.result; };
  r.readAsDataURL(f); input.value='';
}

function uploadStampImg(input,kind){

  const r=new FileReader();

    const max=360; let{width:w,height:h}=img; if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);

function buyCalcTotal(){
  const gross=buyItemsTotal(), disc=buyDiscount(), tot=Math.max(0,gross-disc);

    <div class="totrow"><span>Paid now</span><span>${money(paid)}</span></div>

function savePurchase(id){
  const items=buyItems.filter(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)).map(it=>({productId:it.productId,qty:+it.qty,rate:+it.rate}));
  if(!items.length)return toast('Add at least one product with qty & cost',1);
  const gross=items.reduce((a,it)=>a+it.qty*it.rate,0);
  const discount=Math.min(gross,Math.max(0,+($('#b_disc')?.value||0)));
  const tot=Math.max(0,gross-discount);
  const rawSplits=buySplits.filter(s=>+s.amount>0);
  if(rawSplits.some(s=>s.method==='card' && (DB.cards&&DB.cards.length) && !s.cardId))return toast('Pick a card for each card payment',1);
  // methods that require a reference must have one (saved-card pick, or free-text ref)
  const missingRef=rawSplits.find(s=>{ const info=payMethodInfo(s.method); if(info.ref!=='mandatory')return false; return info.savedCard ? !s.cardId : !(s.ref||'').trim(); });
  if(missingRef){ const info=payMethodInfo(missingRef.method); return toast(`${info.label}: ${info.refLabel.replace(/ \((required|optional)\)/,'')} is required`,1); }
  const date=$('#b_date').value, supplier=$('#b_sup').value.trim();
  const splits=rawSplits.map(s=>{ const info=payMethodInfo(s.method); const linksCard=s.method==='card'||info.savedCard;
    return {method:s.method,cardId:linksCard?(s.cardId||''):'',ref:linksCard?'':(s.ref||'').trim(),amount:+s.amount}; });
  // A card may be swiped past its limit ONLY if it's flagged "allow negative".
  // Cards not allowed are blocked; allowed cards go through but raise an immediate alert.
  const cardReq={}; splits.forEach(s=>{ if(s.method==='card'&&s.cardId)cardReq[s.cardId]=(cardReq[s.cardId]||0)+s.amount; });
  const negWarn=[], negBlock=[];
  for(const cid in cardReq){ const c=cardById(cid); if(c){ const av=cardAvailForSplit(c); const over=cardReq[cid]-av;
    if(over>1e-6){ if(cardAllowsNeg(c)) negWarn.push({id:cid,name:c.name,over}); else negBlock.push({name:c.name,over,av}); } } }
  if(negBlock.length){ const b=negBlock[0];
    return toast(`${b.name}: only ${money(Math.max(0,b.av))} available — this card can't go over its limit. Reduce the amount, or enable over-limit for it in Credit Cards.`,1); }
  let paid=splits.reduce((a,s)=>a+s.amount,0); if(paid>tot+0.01)paid=tot;
  const methodTag = splits.length===0?'cash':(splits.length===1?splits[0].method:'split');
  const payments = splits.map(s=>({id:uid(),date,amount:s.amount,method:s.method,cardId:s.cardId||'',payRef:s.ref||'',ref:'Initial'}));
  const data={date,supplier,items,discount,payment:methodTag,paid,payments};
  const negMsg=negWarn.length?(' · 🔴 '+negWarn.map(n=>`${n.name} negative ${money(n.over)}`).join(', ')+' — pay immediately'):'';
  if(id){ // EDIT existing — confirm; workers route to admin approval
    const rec=DB.purchases.find(x=>x.id===id); const ref=rec?rec.ref:'';
    if(!isOwner()) return confirmBox('Send for approval?',`Editing purchase <b>${esc(ref)}</b> needs admin approval. Send this change to the admin?`,()=>queueApproval('purchase','edit',id,ref,data),'Send');
    return confirmBox('Save changes?',`Update purchase <b>${esc(ref)}</b>? Linked cash & card entries will be recalculated.`,()=>{
      commitPurchase(id,data); save();closeModal();renderPurchases();renderBell();toast('Purchase updated'+negMsg, negWarn.length?1:0);
      if(negWarn.length) setTimeout(()=>alertNegativeCards(),200); },'Save');
  }
  // NEW purchase (allowed for owner & worker)
  DB.counters.purchase++; const purchaseId=uid(), ref='PUR-'+String(DB.counters.purchase).padStart(4,'0');
  DB.purchases.push({id:purchaseId,ref,byId:session.id,...data});
  const charged=[];
  splits.forEach(s=>{ if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId); if(c){ chargeCard(c,s.amount,date,'Purchase '+ref+(supplier?' · '+supplier:''),purchaseId); charged.push(c.name); } } });
  save();closeModal();renderPurchases();renderBell();
  toast((charged.length?('Purchase saved · charged '+charged.join(', ')):'Purchase saved')+negMsg, negWarn.length?1:0);
  if(negWarn.length) setTimeout(()=>alertNegativeCards(),200);   // 🚨 immediate over-limit alert
  else if(tot>0 && paid>=tot-0.01) confetti();                  // 🎉 paid in full
}
function delPurchase(id){
  const rec=DB.purchases.find(p=>p.id===id); const ref=rec?rec.ref:'';
  if(!isOwner()) return confirmBox('Send for approval?',`Deleting purchase <b>${esc(ref)}</b> needs admin approval. Send this delete request to the admin?`,()=>queueApproval('purchase','delete',id,ref,null),'Send');

views.shop=function(){

views._after_shop=renderShop;
function renderShop(){

function shopCard(x){
  const p=x.p, inCart=_shopCart[p.id]||0, out=x.qty<=0;
  const img=p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.remove()">`:`<div class="shop-icon">${iconSVGtile(p)}</div>`;
  const badge=out?`<span class="shop-stock oos">Out of stock</span>`:`<span class="shop-stock">${num(x.qty)} in stock</span>`;
  const ctrl=out?`<button class="mini-btn" disabled style="opacity:.55;width:100%">Out of stock</button>`
    :(inCart>0?`<div class="shop-step"><button onclick="shopAdd('${p.id}',-1)">−</button><input type="number" inputmode="numeric" min="0" max="${x.qty}" value="${inCart}" onchange="shopSet('${p.id}',this.value)" onfocus="this.select()" title="Type quantity"><button onclick="shopAdd('${p.id}',1)">＋</button></div>`
      :`<button class="btn-sm" style="width:100%;justify-content:center" onclick="shopAdd('${p.id}',1)">🛒 Add to cart</button>`);
  return `<div class="shop-card ${out?'oos':''}">
    <div class="shop-img" onclick="openImageFinder('${p.id}')" title="Click to set / change image">${img}${badge}<span class="shop-cam">📷</span></div>

function shopAdd(pid,delta){
  const max=stockOf(pid,computeEngine()); let q=(_shopCart[pid]||0)+delta;
  if(q<=0)delete _shopCart[pid]; else { if(q>max){ q=max; toast('Only '+num(max)+' in stock',1); } _shopCart[pid]=q; }
  renderShop();
}
/* set an exact cart quantity typed into the card (capped at available stock) */
function shopSet(pid,val){
  const max=stockOf(pid,computeEngine()); let q=Math.floor(+val||0);
  if(q<=0)delete _shopCart[pid]; else { if(q>max){ q=max; toast('Only '+num(max)+' in stock',1); } _shopCart[pid]=q; }
  renderShop();
}
function shopCartUnits(){ return Object.values(_shopCart).reduce((a,q)=>a+q,0); }
function shopClearCart(){ _shopCart={}; renderShop(); }
function renderShopCart(){
  const bar=$('#shopCartBar'); if(!bar)return; const ids=Object.keys(_shopCart);
  if(!ids.length){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  bar.classList.remove('hidden');
  bar.innerHTML=`<div class="scb-left">🛒 <b>${ids.length}</b> product(s) · <b>${num(shopCartUnits())}</b> unit(s)</div>

    <button class="btn-sm btn-gold" onclick="shopCheckout()">Sell / Checkout →</button></div>`;
}
function shopCheckout(){
  const items=Object.keys(_shopCart).map(pid=>({productId:pid,qty:_shopCart[pid],rate:''}));
  if(!items.length)return toast('Cart is empty',1);
  _shopCart={}; renderShopCart();      // items now live in the sales bill

}

function saleProdOpts(sel,eng){ eng=eng||computeEngine(); if(!DB.products.length)return '<option value="">— add a product first —</option>';
  return `<option value="" ${!sel?'selected':''}>— select product —</option>`+productsByRecent().map(x=>{const av=saleAvail(x.id,eng),bp=avgBuyPrice(x.id,eng);return `<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)} — avail ${num(av)} · buy ${money(bp)}</option>`;}).join(''); }
/* stock available for THIS line = product stock − qty already used by OTHER lines of the same product */
function saleLineAvail(i,eng){ const it=saleDraft[i]; if(!it||!it.productId)return 0; eng=eng||computeEngine();
  const used=saleDraft.reduce((a,x,j)=> a + (j!==i && x.productId===it.productId ? (+x.qty||0):0), 0);
  return saleAvail(it.productId,eng) - used; }
function saleHintHtml(i,eng){ const it=saleDraft[i]; if(!it||!it.productId)return 'Search &amp; pick a product (most recent shown first)';
  const bp=avgBuyPrice(it.productId,eng), avail=saleLineAvail(i,eng), over=(+it.qty||0)>avail+1e-9;
  return `Avg buy price <b style="color:var(--gold2)">${money(bp)}</b> <span style="opacity:.6">(${avgWindowLabel()})</span> · available <b style="color:${over?'var(--red)':'var(--green)'}">${num(Math.max(0,avail))}</b>${over?` · <span class="blink" style="color:#fff;background:var(--red);padding:1px 7px;border-radius:6px;font-weight:800">⚠ only ${num(Math.max(0,avail))} in stock</span>`:''}${(+it.rate>0&&+it.rate<bp)?` · <span style="color:var(--red)">below cost</span>`:''}`; }
function renderSaleRows(){
  const host=$('#s_rows'); if(!host)return; const eng=computeEngine();
  host.innerHTML=saleDraft.map((it,i)=>{ const over=it.productId&&(+it.qty||0)>saleLineAvail(i,eng)+1e-9;
    return `<div class="li-row">
    <select class="rq" onchange="saleDraft[${i}].productId=this.value;renderSaleRows()">${saleProdOpts(it.productId,eng)}</select>
    <input type="number" min="0" step="any" value="${it.qty}" oninput="saleDraft[${i}].qty=+this.value;saleCalc()" placeholder="Qty" class="rq ${over?'qty-over':''}">
    <input class="rq" type="number" min="0" step="any" value="${it.rate}" oninput="saleDraft[${i}].rate=+this.value;saleCalc()" placeholder="Sell rate">
    <input disabled value="${num((+it.qty||0)*(+it.rate||0))}">
    <button class="li-x" onclick="saleDraft.splice(${i},1);renderSaleRows()">✕</button>
  </div><div class="li-hint">${saleHintHtml(i,eng)}</div>`; }).join('');
  saleCalc();
}
function addSaleRow(){saleDraft.push({productId:'',qty:1,rate:''});renderSaleRows();flashNewRow('#s_rows .li-row');}
let _salePaidTouched=false;
function saleCalc(){
  const eng=computeEngine();
  const sub=saleDraft.reduce((a,i)=>a+(+i.qty||0)*(+i.rate||0),0);
  const disc=+($('#s_disc')?.value||0);
  const base=Math.max(0,sub-disc);
  const mode=$('#s_vatmode')?.value||'none', r=+S().vatPercent||0;
  let vat=0,total=base,net=base;
  if(mode==='inclusive'){ vat=Math.round(base*r/(100+r)*100)/100; net=Math.round((base-vat)*100)/100; total=base; }
  else if(mode==='exclusive'){ vat=Math.round(base*r/100*100)/100; total=Math.round((base+vat)*100)/100; net=base; }
  const box=$('#s_tot'); if(!box)return;
  const paidEl=$('#s_paid');
  if(paidEl && !_salePaidTouched) paidEl.value = +total.toFixed(2);   // auto-fill full until user edits
  let received=+((paidEl&&paidEl.value)||0); if(received>total)received=total;
  const bal=total-received;
  box.innerHTML=`<div class="totrow"><span>Subtotal</span><span>${money(sub)}</span></div>
    ${disc>0?`<div class="totrow"><span>Discount</span><span>− ${money(disc)}</span></div>`:''}
    ${mode!=='none'?`<div class="totrow"><span>VAT ${r}%${mode==='inclusive'?' (incl.)':''}</span><span>${money(vat)}</span></div>`:''}
    <div class="totrow grand"><span>Total</span><span>${money(total)}</span></div>
    <div class="totrow"><span>Received now</span><span>${money(received)}</span></div>
    <div class="totrow" style="font-weight:800;color:${bal>0.01?'var(--red)':'var(--green)'}"><span>${bal>0.01?'Credit — to collect later':'Fully paid'}</span><span>${money(bal>0?bal:0)}</span></div>`;
  box._t={sub,disc,vat,total,net,mode};
  /* live per-row amount + stock warning */
  $$('#s_rows .li-row').forEach((row,i)=>{ if(!saleDraft[i])return;
    const amt=row.querySelector('input[disabled]'); if(amt)amt.value=num((+saleDraft[i].qty||0)*(+saleDraft[i].rate||0));
    const qtyIn=row.querySelector('input:not([disabled])'); const over=saleDraft[i].productId&&(+saleDraft[i].qty||0)>saleLineAvail(i,eng)+1e-9;
    if(qtyIn)qtyIn.classList.toggle('qty-over',!!over);
    const hint=row.nextElementSibling; if(hint&&hint.classList.contains('li-hint'))hint.innerHTML=saleHintHtml(i,eng);
  });
  setFlow('s_flow',[
    saleDraft.some(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)),
    !!(paidEl&&paidEl.value!==''&&received>0),
    total>0 && received>0 && bal<=0.01
  ]);
}
function saveSale(id,print){
  const items=saleDraft.filter(i=>i.productId&&(+i.qty>0)&&i.rate!==''&&(+i.rate>=0));
  if(!items.length)return toast('Add at least one item with qty & rate',1);
  // block selling more than available stock (accounting for this sale's own existing qty when editing)
  const eng=computeEngine(), req={}; items.forEach(i=>req[i.productId]=(req[i.productId]||0)+(+i.qty||0));
  for(const pid in req){ const avail=saleAvail(pid,eng); if(req[pid]>avail+1e-9){ const pr=productById(pid); return toast(`Not enough stock for ${pr?pr.name:'item'} — available ${num(avail)}, needed ${num(req[pid])}`,1); } }
  const t=$('#s_tot')._t, method=$('#s_pay').value;
  const paidRaw=$('#s_paid').value;
  if(paidRaw==='')return toast('Enter the amount received (0 for a full-credit sale)',1);
  let paid=Math.max(0,+paidRaw); if(paid>t.total)paid=t.total;
  const base={date:$('#s_date').value,customer:$('#s_cust').value.trim(),custPhone:$('#s_phone').value.trim(),
    custAddress:$('#s_addr').value.trim(),custVat:$('#s_vat').value.trim(),collectedBy:($('#s_collby')?.value||session.id),
    items:items.map(i=>({productId:i.productId,qty:+i.qty,rate:+i.rate})),
    payment:method,discount:+($('#s_disc').value||0),vatMode:t.mode,
    subtotal:t.sub,vat:t.vat,net:t.net,vatPercent:t.mode!=='none'?(+S().vatPercent||0):0,total:t.total};
  if(id){ // EDIT — confirm; workers route to admin approval
    const rec=DB.sales.find(x=>x.id===id); const inv=rec?rec.invoiceNo:'';
    const data={...base,paid,payments:paid>0?[{id:uid(),date:base.date,amount:paid,method,ref:'Updated'}]:[]};
    if(!isOwner()) return confirmBox('Send for approval?',`Editing invoice <b>${esc(inv)}</b> needs admin approval. Send this change to the admin?`,()=>queueApproval('sale','edit',id,inv,data),'Send');
    return confirmBox('Save changes?',`Update invoice <b>${esc(inv)}</b>? Stock, profit & payments will recalculate.`,()=>{
      commitSale(id,data); save();closeModal();renderSales();toast('Sale updated'+(print?' · opening bill':'')); if(print)setTimeout(()=>printSale(id),120); },'Save');
  }
  // NEW sale
  DB.counters.sale++; const inv=S().invoicePrefix+String(DB.counters.sale).padStart(4,'0'); const nid=uid();
  DB.sales.push({id:nid,invoiceNo:inv,byId:session.id,...base,paid,payments:paid>0?[{id:uid(),date:base.date,amount:paid,method,ref:'Initial'}]:[]});
  save();closeModal();renderSales();toast('Sale saved '+(print?'· opening bill':''));
  if(paid>=t.total-0.01 && t.total>0) confetti();   // 🎉 paid in full
  if(print)setTimeout(()=>printSale(nid),120);
}
function delSale(id){
  const rec=DB.sales.find(s=>s.id===id); const inv=rec?rec.invoiceNo:'';
  if(!isOwner()) return confirmBox('Send for approval?',`Deleting invoice <b>${esc(inv)}</b> needs admin approval. Send this delete request to the admin?`,()=>queueApproval('sale','delete',id,inv,null),'Send');

}

/* ---------- build a real A4 PDF blob of the bill ---------- */
async function buildSalePdf(id){
  const s=DB.sales.find(x=>x.id===id); if(!s)return null;
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return null; }
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;z-index:-1';
  holder.innerHTML=invoiceHtml(s);
  document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#invoiceArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); }
    else { let left=imgH, pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }
    const filename=String(s.invoiceNo||'invoice').replace(/[^\w.-]+/g,'_')+'.pdf';
    return {blob:pdf.output('blob'), filename, sale:s};
  }catch(e){
    toast('Could not build the PDF'+(String(e).includes('Tainted')||String(e).includes('SecurityError')?' — a logo/seal image blocks it; use a local upload':''),1);
    return null;
  }finally{ document.body.removeChild(holder); }
}
/* ---------- SHARE BILL: save the bill as a PDF file ---------- */
async function pdfSale(id){
  toast('Preparing PDF…',0);
  const r=await buildSalePdf(id); if(!r)return;
  const url=URL.createObjectURL(r.blob);
  const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('PDF ready — '+r.filename);
}
/* ---------- SHARE icon: send the PDF to WhatsApp (native share sheet) ---------- */
async function shareSale(id){
  toast('Preparing PDF…',0);
  const r=await buildSalePdf(id); if(!r)return;
  const s=r.sale, cap=saleSummaryText(s);
  const file=new File([r.blob], r.filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Invoice '+s.invoiceNo, text:cap}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }   // user cancelled the share sheet
  }
  // fallback (desktop / no file-share): save the PDF then open the WhatsApp chat so it can be attached
  const url=URL.createObjectURL(r.blob);
  const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  let phone=(s.custPhone||'').replace(/[^\d]/g,''); if(phone.startsWith('0'))phone='971'+phone.slice(1);
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(cap+'\n\n(Bill saved as PDF — please attach it here.)'),'_blank');

/* Auto-add a horizontal-scroll affordance (nudging arrow + edge fade) to EVERY wide
   table so the right-hand columns (Edit/Delete, balances, actions) are never silently
   cut off. Any .table-wrap not already inside a .scrollx gets wrapped once. */
function enhanceScrollx(){
  $$('.table-wrap').forEach(w=>{ const p=w.parentElement;
    if(p && !p.classList.contains('scrollx')){ const sx=document.createElement('div'); sx.className='scrollx';
      p.insertBefore(sx, w); sx.appendChild(w); } });
  $$('.scrollx').forEach(sx=>{ const w=sx.querySelector('.table-wrap'); if(!w)return;
    if(!sx._arrows){ sx._arrows=1; ['left','right'].forEach(dir=>{
      const b=document.createElement('button'); b.type='button'; b.className='sx-arrow '+dir;
      b.textContent=dir==='right'?'›':'‹'; b.setAttribute('aria-label',dir==='right'?'Scroll table right':'Scroll table left');
      // don't let the button take focus — that makes the browser jump the whole page to it
      b.addEventListener('mousedown',e=>e.preventDefault());
      b.addEventListener('click',e=>{ e.preventDefault();
        w.scrollBy({left:(dir==='right'?1:-1)*Math.max(180,w.clientWidth*0.7),behavior:'smooth'}); });
      sx.appendChild(b); }); }
    const upd=()=>{ sx.classList.toggle('scrollable', w.scrollWidth>w.clientWidth+2);
      sx.classList.toggle('at-end', w.scrollLeft+w.clientWidth>=w.scrollWidth-2);
      sx.classList.toggle('at-start', w.scrollLeft<=2); };
    upd(); if(!w._sxBound){ w._sxBound=1; w.addEventListener('scroll',upd,{passive:true}); } });
}
if(!window._sxResize){ window._sxResize=1; window.addEventListener('resize',()=>{ try{enhanceScrollx();}catch(e){} }); }
/* re-run whenever #main content changes (view switch, search filter, etc.) */
function initScrollxObserver(){ const main=document.getElementById('main'); if(!main||window._sxObs)return; window._sxObs=1;
  let raf=0; new MutationObserver(()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ try{enhanceScrollx();}catch(e){} }); })
    .observe(main,{childList:true,subtree:true}); }

function recordPay(kind,id){
  const rec = kind==='sale'? DB.sales.find(s=>s.id===id) : DB.purchases.find(p=>p.id===id);
  if(!rec)return;
  const total = kind==='sale'? rec.total : purchaseTotal(rec);

    </div>
    <div class="field"><label>Reference (optional)</label><input id="pm_ref" placeholder="e.g. receipt no. / card ••1234"></div>`,

     <button class="btn-sm btn-green" onclick="savePay('${kind}','${id}')">Save Payment</button>`);
}
function savePay(kind,id){
  const rec = kind==='sale'? DB.sales.find(s=>s.id===id) : DB.purchases.find(p=>p.id===id);
  const total = kind==='sale'? rec.total : purchaseTotal(rec);
  let amt=+$('#pm_amt').value; if(!(amt>0))return toast('Enter a valid amount',1);
  const bal=total-(rec.paid||0); if(amt>bal+0.01)amt=bal;
  rec.paid=(rec.paid||0)+amt; if(!rec.payments)rec.payments=[];
  rec.payments.push({id:uid(),date:$('#pm_date').value,amount:amt,method:$('#pm_method').value,ref:$('#pm_ref').value.trim()||(kind==='sale'?'Collection':'Payment')});
  save();closeModal();
  toast(kind==='sale'?'Payment collected':'Payment recorded');
  const active=$('.nav-item.active')?.dataset.view;
  if(active==='payments')renderPayments(); else if(active==='sales')renderSales(); else if(active==='purchases')renderPurchases(); else go(active||'dashboard');
}

const CARD_THEMES=[
  {k:'indigo', g:'linear-gradient(135deg,#4f46e5,#7c3aed)'},
  {k:'sky',    g:'linear-gradient(135deg,#0ea5e9,#2563eb)'},
  {k:'emerald',g:'linear-gradient(135deg,#059669,#10b981)'},
  {k:'gold',   g:'linear-gradient(135deg,#a9791b,#f5b301)'},
  {k:'rose',   g:'linear-gradient(135deg,#e11d48,#fb7185)'},
  {k:'slate',  g:'linear-gradient(135deg,#3b4a63,#0f172a)'}
];
function cardGrad(c){ return (CARD_THEMES.find(t=>t.k===(c&&c.theme))||CARD_THEMES[0]).g; }
function cardOwnerLabel(c){ return (c&&c.owner&&c.owner.trim())?c.owner.trim():'My own'; }
function allCardOwners(){ return uniqSorted((DB.cards||[]).map(c=>c.owner)); }
function allCardNames(){ return uniqSorted((DB.cards||[]).map(c=>c.name)); }
function allCardBanks(){ return uniqSorted((DB.cards||[]).map(c=>c.bank)); }
function cardById(id){ return (DB.cards||[]).find(c=>c.id===id); }
function maskCard(n){ n=(n||'').replace(/\s+/g,''); if(!n)return '•••• •••• •••• ••••'; return '•••• •••• •••• '+n.slice(-4).padStart(4,'•'); }
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ym(d){ return (d||'').slice(0,7); }
/* outstanding = opening + purchases − (payments+recharges+discounts) */
function cardOutstanding(c){ let o=+c.openingOutstanding||0;
  (c.txns||[]).forEach(t=> o += (t.type==='purchase' ? (+t.amount||0) : -(+t.amount||0)) ); return o; }
function cardAvailable(c){ return (+c.creditLimit||0) - cardOutstanding(c); }
function cardDiscountInMonth(c,m){ return (c.txns||[]).filter(t=>t.type==='discount' && ym(t.date)===m).reduce((s,t)=>s+(+t.amount||0),0); }
function nextDue(day){ day=Math.min(31,Math.max(1,+day||1)); const t=new Date(); t.setHours(0,0,0,0);
  const mk=(y,m)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
  let y=t.getFullYear(),m=t.getMonth(),d=mk(y,m); if(d<t){ if(++m>11){m=0;y++;} d=mk(y,m); } return d; }
function daysUntil(d){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
/* due reminders: only UNPAID cards (outstanding>0), soonest due first; paid cards never show */
function cardReminders(){ return (DB.cards||[]).map(c=>{ const due=nextDue(c.paymentDay); return {c,due,dleft:daysUntil(due),out:cardOutstanding(c)}; })
  .filter(r=>r.out>0.005 && r.dleft<=10).sort((a,b)=>a.dleft-b.dleft); }
function lowBalanceCards(){ return (DB.cards||[]).filter(c=>{ const al=+c.balanceLimitAlert||0; return al>0 && cardAvailable(c)<=al; }); }
/* cards charged past their limit — the negative amount must be cleared before midnight */
function negativeCards(){ return (DB.cards||[]).map(c=>({c,av:cardAvailable(c)})).filter(x=>x.av<-0.005).sort((a,b)=>a.av-b.av); }
/* whether a card is permitted to be swiped past its limit (into a negative available balance) */
function cardAllowsNeg(c){ return !!(c&&c.allowNegative); }
/* URGENT pop-up shown the moment a card is over its limit (negative balance) */
let _negAlertShown=false;
function alertNegativeCards(neg){
  neg = neg || negativeCards();
  if(!neg.length) return;
  const rows=neg.map(x=>`<div style="display:flex;align-items:center;gap:12px;background:var(--redsoft);border:1px solid #7f1d2b;border-radius:12px;padding:12px 14px;margin-bottom:10px">
      <div style="font-size:22px;line-height:1" class="blink">🔴</div>
      <div style="flex:1;min-width:0"><b>${esc(cardLabel(x.c))}</b><div style="color:var(--muted);font-size:12.5px">Over limit by <b style="color:var(--red)">${money(Math.abs(x.av))}</b> — pay immediately</div></div>
      <button class="btn-sm btn-gold" style="flex:0 0 auto" onclick="closeModal();go('cards');setTimeout(()=>cardDetail('${x.c.id}'),80)">Pay now</button>
    </div>`).join('');
  openModal('🚨 Card over limit — pay now',
    `<p style="margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6">${neg.length===1?'This card has':neg.length+' cards have'} a <b style="color:var(--red)">negative balance</b> (swiped past the limit). Clear the negative amount <b>immediately</b> to avoid penalties.</p>${rows}`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Dismiss</button>
     <button class="btn-sm btn-red" onclick="closeModal();go('cards')">Open Credit Cards</button>`);
}
/* show the negative-card alert once shortly after entering the app, if any card is negative */
function checkNegativeOnBoot(){ if(_negAlertShown)return; const neg=negativeCards(); if(neg.length){ _negAlertShown=true; setTimeout(()=>alertNegativeCards(neg),500); } }
function recentActivity(n){ const a=[];
  DB.sales.forEach(s=>a.push({t:'sale',date:s.date,ref:s.invoiceNo,name:s.customer||'Walk-in',amt:s.total}));
  DB.purchases.forEach(p=>a.push({t:'purchase',date:p.date,ref:p.ref,name:p.supplier||'—',amt:purchaseTotal(p)}));
  a.sort((x,y)=>x.date<y.date?1:(x.date>y.date?-1:0)); return a.slice(0,n||5); }
/* add a purchase charge to a card + auto redeem points (respecting monthly cap) */
function chargeCard(c,amount,date,note,srcPurchaseId){
  if(!c.txns)c.txns=[];
  c.txns.push({id:uid(),date,type:'purchase',amount:+amount||0,note:note||'Purchase',srcPurchaseId});
  const pct=+c.discountPercent||0;
  if(pct>0 && amount>0){ const cap=+c.maxDiscountMonthly||0, used=cardDiscountInMonth(c,ym(date));
    let disc=amount*pct/100; if(cap>0) disc=Math.min(disc,Math.max(0,cap-used)); disc=Math.round(disc*100)/100;
    if(disc>0) c.txns.push({id:uid(),date,type:'discount',amount:disc,note:'Redeem '+pct+'%',srcPurchaseId}); }
}
function unlinkPurchaseFromCards(pid){ (DB.cards||[]).forEach(c=>{ if(c.txns) c.txns=c.txns.filter(t=>t.srcPurchaseId!==pid); }); }

/* ========== EDIT/DELETE APPROVAL WORKFLOW ==========
   Workers' edits & deletes go to the admin/owner for approval.
   Applying an edit/delete also revokes/re-syncs the linked cash & card entries. */
function pendingApprovals(){ return (DB.approvals||[]).filter(r=>r.status==='pending'); }
function queueApproval(kind,action,targetId,ref,payload){
  if(!DB.approvals)DB.approvals=[];
  DB.approvals.push({id:uid(),ts:todayStr(),byId:session.id,byName:session.name,kind,action,targetId,ref,payload:payload||null,status:'pending'});
  save(); closeModal(); toast('Sent to admin for approval'); renderApprovalsBadge();
}
/* apply an edited purchase's data to the record + re-sync card ledger */
function commitPurchase(id,data){
  const rec=DB.purchases.find(x=>x.id===id); if(!rec)return;
  ['productId','qty','rate','cardId','cardRef'].forEach(k=>delete rec[k]);
  Object.assign(rec,data);
  unlinkPurchaseFromCards(id);
  (data.payments||[]).forEach(s=>{ if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId); if(c)chargeCard(c,s.amount,data.date,'Purchase '+rec.ref+(data.supplier?' · '+data.supplier:''),id); } });
}
function commitSale(id,data){ const rec=DB.sales.find(x=>x.id===id); if(rec)Object.assign(rec,data); }
function commitPurchaseDelete(id){ unlinkPurchaseFromCards(id); DB.purchases=DB.purchases.filter(p=>p.id!==id); }
function commitSaleDelete(id){ DB.sales=DB.sales.filter(s=>s.id!==id); }
function approveReq(id){
  const r=(DB.approvals||[]).find(x=>x.id===id); if(!r||r.status!=='pending')return;
  const apply=()=>{
    if(r.action==='delete'){ r.kind==='purchase'?commitPurchaseDelete(r.targetId):commitSaleDelete(r.targetId); }
    else { r.kind==='purchase'?commitPurchase(r.targetId,r.payload):commitSale(r.targetId,r.payload); }
    r.status='approved'; r.decidedTs=todayStr(); r.decidedBy=session.name;
    save(); renderApprovals(); renderApprovalsBadge(); renderBell(); toast('Approved & applied');
  };
  confirmBox('Approve request?', `${r.action==='delete'?'Delete':'Apply the edit to'} ${r.kind} <b>${esc(r.ref)}</b> requested by ${esc(r.byName)}? Linked cash & card entries will be recalculated.`, apply, 'Approve');
}
function rejectReq(id){ const r=(DB.approvals||[]).find(x=>x.id===id); if(!r||r.status!=='pending')return;
  confirmBox('Reject request?', `Reject ${r.byName}'s request to ${r.action} ${r.kind} ${esc(r.ref)}? Nothing will change.`,()=>{ r.status='rejected'; r.decidedTs=todayStr(); r.decidedBy=session.name; save(); renderApprovals(); renderApprovalsBadge(); toast('Request rejected'); },'Reject'); }
function renderApprovalsBadge(){ const b=$('#apprBadge'); if(!b)return; const n=isOwner()?pendingApprovals().length:0;
  if(n>0){ b.textContent=n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }

/* ---- bell reminders ---- */
function renderBell(){ const b=$('#bellBadge'); if(!b)return; const n=cardReminders().length+lowBalanceCards().length+negativeCards().length;
  if(n>0){ b.textContent=n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function toggleBell(e){ if(e)e.stopPropagation(); const pop=$('#bellPop'); if(!pop)return;
  if(pop.classList.contains('hidden')){ renderBellPop(); pop.classList.remove('hidden'); } else pop.classList.add('hidden'); }
function closeBell(){ $('#bellPop')?.classList.add('hidden'); }
function renderBellPop(){ const pop=$('#bellPop'); if(!pop)return;
  const due=cardReminders(), low=lowBalanceCards(), neg=negativeCards(), act=recentActivity(5);
  const sec=(t)=>`<div class="bh" style="background:var(--panel2)"><span>${t}</span></div>`;

  html+= due.length? due.map(r=>{ const warn=r.dleft<=1; return `<div class="bi2" onclick="closeBell();go('cards');setTimeout(()=>cardDetail('${r.c.id}'),40)">
      <span class="d" style="background:${warn?'var(--red)':'var(--amber)'}"></span>
      <div style="flex:1"><b>${esc(cardLabel(r.c))}</b><div style="color:var(--muted);font-size:12px">Due ${fmtDate(isoDate(r.due))} · ${r.dleft<=0?'today':'in '+r.dleft+' day'+(r.dleft===1?'':'s')}</div></div>
      <div style="text-align:right;font-weight:800;color:var(--amber)">${money(r.out)}</div></div>`}).join('')
    : `<div class="bell-empty" style="padding:12px 14px">No card payments due 🎉</div>`;
  /* 2) Low balance warnings */
  if(low.length){ html+=sec('⚠️ Low balance');
    html+=low.map(c=>`<div class="bi2" onclick="closeBell();go('cards');setTimeout(()=>cardDetail('${c.id}'),40)">
      <span class="d" style="background:var(--red)"></span>
      <div style="flex:1"><b>${esc(cardLabel(c))}</b><div style="color:var(--muted);font-size:12px">Available below alert (${money(c.balanceLimitAlert)})</div></div>
      <div style="text-align:right;font-weight:800;color:var(--red)">${money(cardAvailable(c))}</div></div>`).join(''); }
  /* 3) Recent purchases & sales */
  if(act.length){ html+=sec('🕑 Recent purchases & sales');
    html+=act.map(a=>`<div class="bi2" onclick="closeBell();go('${a.t==='sale'?'sales':'purchases'}')">

      <div style="text-align:right;font-weight:700">${money(a.amt)}</div></div>`).join(''); }
  pop.innerHTML=html;
}

function cardActive(c){ return c && c.status!=='inactive'; }
function activeCards(){ return (DB.cards||[]).filter(cardActive); }
/* label: owner · ••last4 · card name */
function cardLabel(c){ if(!c)return ''; const l4=(c.number||'').replace(/\D/g,'').slice(-4); const p=[]; if(c.owner&&c.owner.trim())p.push(c.owner.trim()); if(l4)p.push('••'+l4); p.push(c.name); return p.join(' · '); }
/* short label (no owner): ••last4 · card name — for lists already grouped by owner */
function cardShort(c){ if(!c)return ''; const l4=(c.number||'').replace(/\D/g,'').slice(-4); return (l4?'••'+l4+' · ':'')+(c.name||''); }
/* ---- reusable searchable card picker ----
   A text box + datalist so the user can type the OWNER name, the card's LAST 4
   digits, or the card name to find a card. `idBase` names a hidden <input> that
   holds the resolved card id; onpick(id) fires whenever the selection changes.
   `extraFn(c)` appends info (e.g. "due 1,200") to each option. `extraOpts` are
   non-card sentinel options (e.g. "＋ Add new card…") the caller handles itself. */
window._cardPick = window._cardPick || {};
function cardPickerHtml(idBase, cards, selectedId, extraFn, placeholder, onpick, extraOpts){
  const opts=(cards||[]).map(c=>({ id:c.id, v:cardLabel(c)+(extraFn?(' · '+extraFn(c)):'') }));
  window._cardPick[idBase]={ opts, extras:(extraOpts||[]), onpick:onpick||null };
  const sel=selectedId?opts.find(o=>o.id===selectedId):null;
  const dl=opts.map(o=>`<option value="${esc(o.v)}"></option>`).join('')+(extraOpts||[]).map(x=>`<option value="${esc(x)}"></option>`).join('');
  return `<input class="cardpick" id="${idBase}_q" list="${idBase}_dl" autocomplete="off" spellcheck="false"
      placeholder="${esc(placeholder||'Type owner name or last 4 digits…')}"
      value="${sel?esc(sel.v):''}" oninput="cardPickResolve('${idBase}')" onchange="cardPickResolve('${idBase}')">
    <datalist id="${idBase}_dl">${dl}</datalist>
    <input type="hidden" id="${idBase}" value="${selectedId||''}">`;
}
function cardPickResolve(idBase){
  const st=window._cardPick[idBase]; if(!st)return;
  const raw=($('#'+idBase+'_q')?.value||'').trim(), q=raw.toLowerCase();
  if(raw && st.extras.some(x=>x.toLowerCase()===q)){ const hidden=$('#'+idBase); if(hidden)hidden.value=''; if(st.onpick)st.onpick('',raw); return; }
  let hit=st.opts.find(o=>o.v.toLowerCase()===q);                                   // exact (picked from list)
  if(!hit && q){ const m=st.opts.filter(o=>o.v.toLowerCase().includes(q)); if(m.length===1)hit=m[0]; } // unique partial
  const id=hit?hit.id:''; const hidden=$('#'+idBase); if(hidden)hidden.value=id;
  if(st.onpick)st.onpick(id,raw);
}
/* ---- card visual ---- */
function cardVisual(c){
  const limit=+c.creditLimit||0, out=cardOutstanding(c), avail=limit-out;
  const usedPct=limit>0?Math.min(100,Math.max(0,out/limit*100)):0;
  const due=nextDue(c.paymentDay), dleft=daysUntil(due), warn=dleft<=3;
  const low=(+c.balanceLimitAlert>0)&&avail<=+c.balanceLimitAlert;
  const l4=(c.number||'').replace(/\D/g,'').slice(-4);
  const holder=(c.owner&&c.owner.trim())?c.owner.trim():'';
  return `<div class="ccard" style="background:${cardGrad(c)};${cardActive(c)?'':'opacity:.6'}" onclick="cardDetail('${c.id}')">
    ${c.discountPercent?`<div class="cc-pct">${c.discountPercent}% redeem</div>`:''}
    ${!cardActive(c)?`<div class="cc-pct" style="left:16px;right:auto;background:rgba(0,0,0,.35)">INACTIVE</div>`:''}
    <div class="cc-top"><div><div class="cc-name">${esc(c.name)}</div><div class="cc-bank">${esc(c.bank||'Credit Card')}</div>
      ${(holder||l4)?`<div class="cc-holder">${holder?`👤 ${esc(holder)}`:''}${holder&&l4?' · ':''}${l4?`••${l4}`:''}</div>`:''}</div><div class="cc-chip"></div></div>
    <div>
      <div class="cc-num">${maskCard(c.number)}</div>
      <div class="ccbar"><i style="width:${usedPct}%"></i></div>
      <div class="cc-foot">
        <div><div style="opacity:.85">Available${low?' ⚠️':''}</div><div class="cc-avail">${money(avail)}</div></div>
        <div style="text-align:right"><div style="opacity:.85;margin-bottom:2px">Limit ${money(limit)}</div><span class="cc-due ${warn?'warn':''}">Due ${fmtDate(isoDate(due))} · ${dleft===0?'today':dleft+'d'}</span></div>
      </div>
    </div></div>`;
}

function renderCards(){
  const host=$('#cardsWrap'); if(!host)return;
  const all=DB.cards||[], m=ym(todayStr());
  const q=($('#cardSearch')?.value||'').toLowerCase().trim();
  const cards=q? all.filter(c=>[c.name,c.owner,c.bank,c.number].some(v=>(v||'').toLowerCase().includes(q))) : all;
  let tL=0,tA=0,tO=0,tD=0;
  cards.forEach(c=>{ const l=+c.creditLimit||0,o=cardOutstanding(c); tL+=l; tO+=o; tA+=l-o; tD+=cardDiscountInMonth(c,m); });
  const cs=$('#cardStats'); if(cs)cs.innerHTML=cards.length?`
    <div class="stat blue"><span class="ic">💳</span><div class="label">Total Limit</div><div class="val">${money(tL)}</div><div class="foot">${cards.length} card${cards.length===1?'':'s'}</div></div>

    <div class="stat red"><span class="ic">📉</span><div class="label">Outstanding</div><div class="val">${money(tO)}</div></div>

  if(!cards.length){ host.innerHTML=`<div class="panel">${q?emptyBox('🔎','No matches','No cards match your search.'):emptyBox('💳','No cards yet','Add your credit cards to track limits, commission discounts & payment dates.')}</div>`; renderBell(); return; }
  if(_cardView==='credit'){
    // compact due-date & usage list — soonest due first (paid cards after)
    const rows=[...cards].map(c=>{ const lim=+c.creditLimit||0,out=cardOutstanding(c),av=lim-out,use=lim>0?Math.min(100,Math.max(0,out/lim*100)):0,due=nextDue(c.paymentDay),dl=daysUntil(due);
      return {c,lim,out,av,use,due,dl}; })
      .sort((a,b)=> (b.out>0.005)-(a.out>0.005) || a.dl-b.dl );  // unpaid first, then soonest due
    host.innerHTML=`<div class="cat-head">💳 Cards by due date & usage <span class="cc">soonest due first</span> <span class="cc" style="color:var(--green)">available ${money(tA)}</span></div>
      <div class="table-wrap"><table style="min-width:640px">
      <thead><tr><th>Card</th><th class="num">Available</th><th class="num">Used / Limit</th><th class="num">Outstanding</th><th>Due date</th><th></th></tr></thead>
      <tbody>${rows.map(r=>{ const warn=r.out>0.005&&r.dl<=3; return `<tr>
        <td><b>${esc(r.c.name)}</b><div style="color:var(--muted2);font-size:11.5px">${esc(maskCard(r.c.number))}${r.c.owner?` · <b style="color:var(--text)">👤 ${esc(r.c.owner)}</b>`:''}</div></td>
        <td class="num" style="color:${r.av<0?'var(--red)':'var(--green)'};font-weight:700">${money(r.av)}</td>
        <td class="num"><div>${money(r.out)} / ${money(r.lim)}</div><div class="bar" style="margin-top:4px"><i style="width:${r.use}%"></i></div></td>
        <td class="num">${money(r.out)}</td>
        <td>${r.out>0.005?`<span class="tag ${warn?'due':'partial'}">${fmtDate(isoDate(r.due))} · ${r.dl<=0?'today':r.dl+'d'}</span>`:'<span class="tag ok">paid</span>'}</td>
        <td class="num" style="white-space:nowrap"><button class="mini-btn" onclick="cardTxnModal('${r.c.id}','recharge')">↑ Recharge</button> <button class="mini-btn gold" onclick="cardTxnModal('${r.c.id}','payment')">＋ Pay</button> ${isOwner()?`<button class="mini-btn" onclick="adjustBalanceModal('${r.c.id}')">✎ Balance</button> `:''}<button class="mini-btn" onclick="cardDetail('${r.c.id}')">Details</button></td></tr>`; }).join('')}
      </tbody></table></div>`;
    renderBell(); return;
  }
  if(_cardView==='status'){
    const act=cards.filter(cardActive).sort((a,b)=>cardAvailable(b)-cardAvailable(a));
    const inact=cards.filter(c=>!cardActive(c)).sort((a,b)=>cardAvailable(b)-cardAvailable(a));
    const sec=(title,arr,color)=>arr.length?`<div class="cat-head">${title} <span class="cc" style="color:${color}">${arr.length} card${arr.length===1?'':'s'}</span></div><div class="ccgrid">${arr.map(c=>cardCell(c)).join('')}</div>`:'';
    host.innerHTML=(sec('🟢 Active',act,'var(--green)')+sec('⚪ Inactive',inact,'var(--muted)'))||`<div class="panel">${emptyBox('💳','No cards','—')}</div>`;
    renderBell(); return;
  }
  // group cards by owner
  const groups={}; cards.forEach(c=>{ const o=cardOwnerLabel(c); (groups[o]||(groups[o]=[])).push(c); });
  const owners=Object.keys(groups).sort((a,b)=>a==='My own'?-1:b==='My own'?1:a.localeCompare(b));
  host.innerHTML=owners.map(o=>{ const g=[...groups[o]].sort((a,b)=>cardAvailable(b)-cardAvailable(a)); const gOut=g.reduce((a,c)=>a+cardOutstanding(c),0);
    const safe=o.replace(/'/g,"\\'");
    return `<div class="cat-head">👤 <span class="own-name">${esc(o)}</span> <span class="cc">${g.length} card${g.length===1?'':'s'}</span> <span class="cc" style="color:${gOut>0?'var(--amber)':'var(--text)'}">owe ${money(gOut)}</span>
      <button class="mini-btn gold" style="margin-left:auto" onclick="ownerStatement('${safe}')">📄 Statement</button></div>
    <div class="ccgrid">${g.map(c=>cardCell(c)).join('')}</div>`; }).join('');
  renderBell();
}
/* per-owner combined statement / ledger */
function ownerStatement(owner){
  const m=ym(todayStr());
  const cards=(DB.cards||[]).filter(c=>cardOwnerLabel(c)===owner);
  if(!cards.length)return;
  let tL=0,tO=0,tD=0; cards.forEach(c=>{ tL+=+c.creditLimit||0; tO+=cardOutstanding(c); tD+=cardDiscountInMonth(c,m); });
  const led=[]; cards.forEach(c=>(c.txns||[]).forEach(t=>led.push({card:c.name,date:t.date,type:t.type,amount:+t.amount||0,note:t.note})));
  led.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
  const rows=led.length? led.slice(0,120).map(t=>`<tr>
      <td>${fmtDate(t.date)}</td><td>${esc(t.card)}</td>
      <td><span class="tag ${t.type}">${txnLabel(t.type)}</span></td>
      <td>${esc(t.note||'')}</td>
      ${txnAmtCell(t)}</tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted2);padding:18px">No transactions yet</td></tr>`;
  openModal('Statement · 👤 '+esc(owner),`
    <div class="grid3" style="margin-bottom:14px">
      <div class="stat red"><div class="label">You Owe (${cards.length} card${cards.length===1?'':'s'})</div><div class="val">${money(tO)}</div></div>
      <div class="stat blue"><div class="label">Total Limit</div><div class="val">${money(tL)}</div></div>
      <div class="stat gold"><div class="label">Redeem · this month</div><div class="val">${money(tD)}</div></div>
    </div>
    <div class="row-actions" style="margin-bottom:14px">${cards.map(c=>`<button class="mini-btn" onclick="cardDetail('${c.id}')">${esc(cardShort(c))} · owe ${money(cardOutstanding(c))}</button>`).join('')}</div>
    <div style="font-weight:700;font-size:13px;margin-bottom:8px">Combined ledger</div>
    <div class="table-wrap"><table style="min-width:560px"><thead><tr><th>Date</th><th>Card</th><th>Type</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button class="btn-sm" onclick="closeModal()">Close</button>`);
}

  const discUsed=cardDiscountInMonth(c,m), cap=+c.maxDiscountMonthly||0;
  const txns=[...(c.txns||[])].sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
  const rows=txns.length? txns.map(t=>`<tr>
      <td>${fmtDate(t.date)}</td>
      <td><span class="tag ${t.type}">${txnLabel(t.type)}</span></td>
      <td>${esc(t.note||'')}</td>
      ${txnAmtCell(t)}
      <td class="num" style="white-space:nowrap">${!t.srcPurchaseId?`<button class="mini-btn" title="Edit entry" onclick="cardTxnModal('${c.id}','${t.type}','${t.id}')">✎</button> `:''}<button class="mini-btn red" title="Delete entry" onclick="delCardTxn('${c.id}','${t.id}')">✕</button></td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted2);padding:20px">No transactions yet</td></tr>`;
  openModal(esc(c.name),`
    <div style="max-width:360px;margin:0 auto 18px">${cardVisual(c)}</div>
    <div class="grid3" style="margin-bottom:16px">
      <div class="stat green"><div class="label">Available</div><div class="val">${money(avail)}</div><div class="foot">of ${money(limit)} limit</div></div>
      <div class="stat red"><div class="label">Outstanding</div><div class="val">${money(out)}</div><div class="foot">pay by day ${c.paymentDay}</div></div>
      <div class="stat gold"><div class="label">Redeem · this month</div><div class="val">${money(discUsed)}</div><div class="foot">${c.discountPercent||0}% · ${cap>0?'cap '+money(cap):'no cap'}</div></div>
    </div>
    <div class="row-actions" style="margin-bottom:16px">
      <button class="btn-sm btn-green" onclick="cardTxnModal('${c.id}','payment')">＋ Payment</button>
      <button class="btn-sm btn-green" onclick="cardTxnModal('${c.id}','recharge')">↑ Recharge</button>
      <button class="btn-sm btn-gold" onclick="cardTxnModal('${c.id}','discount')">％ Redeem</button>
      <button class="btn-sm btn-ghost" onclick="cardTxnModal('${c.id}','purchase')">− Manual charge</button>
      ${isOwner()?`<button class="btn-sm btn-ghost" onclick="adjustBalanceModal('${c.id}')">✎ Edit balance</button>`:''}
    </div>
    <div class="table-wrap"><table style="min-width:460px"><thead><tr><th>Date</th><th>Type</th><th>Note</th><th class="num">Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button class="btn-sm btn-red" onclick="delCard('${c.id}')">Delete Card</button>
     <button class="btn-sm btn-ghost" onclick="editCard('${c.id}')">Edit</button>
     <button class="btn-sm" onclick="closeModal()">Close</button>`);
}
/* live "available after" preview inside the card-entry modal */
let _ctBase=0,_ctSign=1,_ctNeg=false;
function ctCalcAfter(){
  const el=$('#ct_after'); if(!el)return;
  const amt=+($('#ct_amt')?.value)||0;
  const after=_ctBase + _ctSign*amt;
  el.textContent=money(after);
  el.style.color = after<-0.005 ? 'var(--red)' : 'var(--green)';
  const w=$('#ct_warn'); if(w) w.style.display=(after<-0.005 && !_ctNeg) ? 'block' : 'none';
}
function cardTxnModal(id,type,txnId){
  const c=cardById(id); if(!c)return;
  const edit = txnId ? (c.txns||[]).find(t=>t.id===txnId) : null;
  const out=cardOutstanding(c), avail=cardAvailable(c);
  const sign = (type==='purchase') ? -1 : 1;                 // how the amount moves AVAILABLE
  const base = edit ? (avail - sign*(+edit.amount||0)) : avail;   // available without this entry
  const preAmt = edit ? (+edit.amount||0) : 0;
  _ctBase=base; _ctSign=sign; _ctNeg=!!c.allowNegative;
  const word={recharge:'recharge',payment:'payment',discount:'redeem',purchase:'charge'}[type]||'entry';
  const titles={payment:'Record Card Payment',recharge:'Card Recharge',discount:'Record Redeem Points',purchase:'Manual Charge'};
  const hints={payment:'Amount you paid the bank — frees up your available limit.',recharge:'Top up / load funds onto the card.',discount:'Redeem points / cashback earned (counts toward the monthly cap).',purchase:'A spend not linked to a purchase entry.'};
  const dueDate=nextDue(c.paymentDay);
  openModal((edit?'Edit ':'')+(titles[type]||'Card entry'),`
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">${hints[type]||''}</p>
    ${type==='payment'?`<div class="totbox" style="margin-bottom:12px"><div class="totrow" style="font-weight:800"><span>Amount due (outstanding)</span><span style="color:${out>0.005?'var(--amber)':'var(--green)'}">${money(Math.max(0,out))}</span></div><div class="totrow"><span>Due date</span><span>${fmtDate(isoDate(dueDate))}</span></div></div>`:''}
    <div class="totbox" style="margin-bottom:14px">
      <div class="totrow"><span>Available ${edit?'before this entry':'now'}</span><span>${money(base)}</span></div>
      <div class="totrow" style="font-weight:800"><span>After this ${word}</span><span id="ct_after" style="color:var(--green)">${money(base+sign*preAmt)}</span></div>
      <div id="ct_warn" style="display:none;color:var(--red);font-size:12px;margin-top:6px">⚠ This pushes the card over its limit (negative available).</div>
    </div>
    <div class="grid2">
      <div class="field"><label>Amount (${S().currency}) *</label><input id="ct_amt" type="number" min="0" step="any" placeholder="0.00" value="${edit?preAmt:(type==='payment'&&out>0.005?(+out.toFixed(2)):'')}" oninput="ctCalcAfter()"></div>
      <div class="field"><label>Date</label><input id="ct_date" type="date" value="${edit?esc(edit.date||todayStr()):todayStr()}"></div>
    </div>
    <div class="field"><label>Note (optional)</label><input id="ct_note" placeholder="e.g. bank transfer / receipt no." value="${edit?esc(edit.note||''):''}"></div>
    ${(type==='recharge'||type==='payment')?`<label style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);padding:11px 13px;border-radius:11px;cursor:pointer">
      <input type="checkbox" id="ct_cash" ${edit&&edit.fromCash?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)"><span style="font-size:14px;font-weight:600">Paid from cash box (deduct from Cash Book)</span></label>`:''}`,
    `<button class="btn-sm btn-ghost" onclick="cardDetail('${id}')">Back</button>
     <button class="btn-sm" onclick="saveCardTxn('${id}','${type}'${edit?`,'${txnId}'`:''})">${edit?'Update':'Save'}</button>`);
  setTimeout(()=>{$('#ct_amt')?.focus();ctCalcAfter();},30);
}
function saveCardTxn(id,type,txnId){
  const c=cardById(id); if(!c)return; const amt=+$('#ct_amt').value; if(!(amt>0))return toast('Enter a valid amount',1);
  if(!c.txns)c.txns=[];
  const fromCash=!!$('#ct_cash')?.checked;
  const date=$('#ct_date').value||todayStr(), note=$('#ct_note').value.trim();
  if(txnId){                                   // EDIT — update in place; statement recalculates
    const t=(c.txns||[]).find(x=>x.id===txnId); if(!t)return toast('Entry not found',1);
    if(t.srcPurchaseId)return toast('This entry comes from a purchase — edit it there',1);
    t.amount=amt; t.date=date; t.note=note;
    if(type==='recharge'||type==='payment') t.fromCash=fromCash;
    t.editedBy=session.id; t.editedAt=todayStr();
    save(); toast('Entry updated');
  }else{                                       // NEW
    c.txns.push({id:uid(),date,type,amount:amt,note,fromCash,byId:session.id});
    save(); toast(fromCash?'Saved · cash deducted':'Saved');
  }
  cardDetail(id); if($('.nav-item.active')?.dataset.view==='cards')renderCards(); renderBell();
}
function delCardTxn(cid,tid){ const c=cardById(cid); if(!c)return;
  confirmBox('Delete entry?','This removes the ledger entry and recalculates the balance.',()=>{
    c.txns=(c.txns||[]).filter(t=>t.id!==tid); save(); cardDetail(cid); if($('.nav-item.active')?.dataset.view==='cards')renderCards(); renderBell();
  },'Delete'); }

      <div class="field"><label>Bank / Issuer</label><input id="c_bank" list="dl_cardbank" value="${esc(c.bank||'')}" placeholder="e.g. ADCB">${dataList('dl_cardbank',allCardBanks())}</div>

    <div class="field"><label>Over-limit (negative) swiping</label>
      <select id="c_allowneg">
        <option value="0" ${c.allowNegative?'':'selected'}>🚫 Block — never let this card exceed its limit</option>
        <option value="1" ${c.allowNegative?'selected':''}>⚠️ Allow — permit a negative balance (pay it immediately)</option>
      </select>
      <div style="color:var(--muted2);font-size:11.5px;margin-top:5px">Only cards set to <b>Allow</b> can be swiped past the limit. Any card that goes negative triggers an immediate “pay now” alert.</div></div>
    ${id?'':`<div class="field"><label>Available Balance right now (${S().currency})</label>
      <input id="c_avail" type="number" step="any" value="" placeholder="how much you can still spend — blank = full limit">
      <div style="color:var(--muted2);font-size:11.5px;margin-top:5px">Your current spendable balance (Limit − whatever you already owe). It updates automatically as you buy &amp; pay — leave blank if nothing is owed yet.</div></div>`}`,
    `<button class="btn-sm btn-ghost" onclick="${id?`cardDetail('${id}')`:'closeModal()'}">Cancel</button>
     <button class="btn-sm" onclick="saveCard('${id||''}')">Save Card</button>`);

}
function saveCard(id){
  const name=$('#c_name').value.trim(); if(!name)return toast('Card name is required',1);
  const day=Math.min(31,Math.max(1,+$('#c_day').value||1));
  const data={ name, owner:$('#c_owner').value.trim(), bank:$('#c_bank').value.trim(), number:$('#c_number').value.trim(), theme:_cardTheme,
    creditLimit:+$('#c_limit').value||0, balanceLimitAlert:+$('#c_alert').value||0, status:$('#c_status').value,
    allowNegative:$('#c_allowneg').value==='1',
    discountPercent:redeemVal('c_disc','c_discOther'), maxDiscountMonthly:+$('#c_maxdisc').value||0, paymentDay:day };
  if(id){ Object.assign(cardById(id),data); }
  else{ const availRaw=$('#c_avail').value;   // opening outstanding is derived: Limit − Available (blank ⇒ nothing owed yet)
    data.openingOutstanding=(availRaw!=='' && availRaw!=null) ? ((+$('#c_limit').value||0)-(+availRaw||0)) : 0; data.txns=[]; DB.cards.push({id:uid(),...data}); }
  save(); closeModal(); if($('.nav-item.active')?.dataset.view==='cards')renderCards(); renderBell(); toast('Card saved');
}
function delCard(id){
  const linked=DB.purchases.some(p=>p.cardId===id||(p.payments||[]).some(pm=>pm.cardId===id));
  confirmBox('Delete card?', linked?'Some purchases are linked to this card. Those purchase records stay, but card tracking is removed. Continue?':'This removes the card and its whole ledger. Cannot be undone.',()=>{
    DB.cards=DB.cards.filter(c=>c.id!==id); save(); closeModal(); if($('.nav-item.active')?.dataset.view==='cards')renderCards(); renderBell(); toast('Card deleted');
  },'Delete');
}

/* ========= AUTO PRODUCT IMAGE (click a thumbnail → find & set) =========
   Free by default via Wikipedia (no API key). If a Google Programmable
   Search key + engine id are set in Settings, those results are added too. */
/* hover-to-zoom: pop a large floating preview when the mouse is over any product photo
   (only real photos have an <img>; icon tiles are SVG, so they never trigger it) */
function initImgZoom(){
  if(window._imgZoomInit)return; window._imgZoomInit=1;
  if(!window.matchMedia||!window.matchMedia('(hover:hover)').matches)return; // skip on touch devices
  const z=document.createElement('div'); z.id='imgZoom'; z.innerHTML='<img alt="">'; document.body.appendChild(z);
  const zi=z.querySelector('img');
  const show=img=>{ const src=img.currentSrc||img.src; if(!src)return; zi.src=src;
    const r=img.getBoundingClientRect(), W=250,H=250,gap=14;
    let left=r.right+gap; if(left+W>innerWidth-8)left=r.left-gap-W; left=Math.max(8,Math.min(left,innerWidth-W-8));
    let top=r.top+r.height/2-H/2; top=Math.max(8,Math.min(top,innerHeight-H-8));
    z.style.left=left+'px'; z.style.top=top+'px'; z.classList.add('on'); };
  const hide=()=>z.classList.remove('on');
  document.addEventListener('mouseover',e=>{ const img=e.target.closest&&e.target.closest('.thumb img'); if(img)show(img); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest&&e.target.closest('.thumb img'))hide(); });
  addEventListener('scroll',hide,true);
}
let _imgCands=[];
async function fetchImageCandidates(name){
  const out=[], q=(name||'').trim(); if(!q)return out; const st=S();
  // 1) Google Custom Search image results (optional — better coverage)
  if(st.imgApiKey && st.imgCseId){
    try{ const r=await fetch(`https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(st.imgApiKey)}&cx=${encodeURIComponent(st.imgCseId)}&searchType=image&num=8&safe=active&q=${encodeURIComponent(q)}`);
      if(r.ok){ const d=await r.json(); (d.items||[]).forEach(it=>{ const full=it.link, thumb=(it.image&&it.image.thumbnailLink)||it.link; if(full)out.push({thumb,full}); }); } }catch(e){}
  }
  // 2) Wikipedia (keyless, CORS-friendly) — try full name, then a trimmed name
  const tries=[q]; const short=q.split(/[–—\-,(]/)[0].trim(); if(short && short!==q)tries.push(short);
  for(const t of tries){
    try{ const r=await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(t)}&limit=6`);
      if(r.ok){ const d=await r.json(); (d.pages||[]).forEach(p=>{ if(p.thumbnail&&p.thumbnail.url){ const big=('https:'+p.thumbnail.url).replace(/\/\d+px-/,'/320px-'); out.push({thumb:big,full:big}); } }); }
    }catch(e){}
    if(out.length)break;
  }
  const seen=new Set(); return out.filter(c=>{ if(seen.has(c.full))return false; seen.add(c.full); return true; });
}

/* fetch a remote image and shrink it to a small self-contained thumbnail (JPEG data URI)
   so the stored image doesn't depend on the source staying online / allowing hotlinks */
async function urlToThumb(url,max){ max=max||400;
  const blob=await (await fetch(url,{mode:'cors'})).blob();
  if(!/^image\//.test(blob.type))throw new Error('not an image');
  const o=URL.createObjectURL(blob);
  try{ const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=o; });
    const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc)||1; c.height=Math.round(im.naturalHeight*sc)||1;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.82);
  } finally { URL.revokeObjectURL(o); }
}

  if(_invSort==='category'){
    const groups={}; inStock.forEach(x=>{ const cat=(x.p.category||'').trim()||'Uncategorised'; (groups[cat]||(groups[cat]=[])).push(x); });
    const cats=Object.keys(groups).sort((a,b)=>a==='Uncategorised'?1:b==='Uncategorised'?-1:a.localeCompare(b));
    host.innerHTML=cats.map(cat=>{ const g=groups[cat]; const gVal=g.reduce((a,x)=>a+(x.val>0?x.val:0),0), gU=g.reduce((a,x)=>a+(x.qty>0?x.qty:0),0);
      return `<div class="cat-head">📂 ${esc(cat)} <span class="cc">${g.length} item${g.length===1?'':'s'}</span> <span class="cc">${num(gU)} units</span> <span class="cc">${money(gVal)}</span></div>
      <div class="table-wrap"><table>${INV_HEAD}<tbody>${g.map(invRow).join('')}</tbody></table></div>`; }).join('')+zeroSection();
    return;
  }
  const sorters={ recent:(a,b)=>(b.last||'').localeCompare(a.last||''), stockHigh:(a,b)=>b.qty-a.qty, stockLow:(a,b)=>a.qty-b.qty, sold:(a,b)=>b.sold-a.sold, name:(a,b)=>a.p.name.localeCompare(b.p.name) };
  const sorted=[...inStock].sort(sorters[_invSort]||sorters.recent);
  host.innerHTML=(sorted.length?`<div class="table-wrap"><table>${INV_HEAD}<tbody>${sorted.map(invRow).join('')}</tbody></table></div>`:'')+zeroSection();
}

/* =========================================================
   CASH BOOK (daily cash balance ledger)
   Auto: sales cash in, purchase cash out, card recharge/payment paid from cash out.
   Manual: opening balance, expenses (with who + purpose), other cash in/out.
   ========================================================= */
function userName(id){ const u=(DB.users||[]).find(x=>x.id===id); return u?u.name:'Unassigned'; }
/* full ledger of wallet movements, each attributed to a person (who = userId) */
function cashEntries(){
  const e=[];
  (DB.cash||[]).forEach(m=>e.push({id:m.id,date:m.date||'',dir:m.dir,amount:+m.amount||0,cat:m.cat||'manual',desc:m.desc||'',who:m.who||'',recBy:m.byId||'',linkId:m.linkId||'',manual:true}));
  (DB.sales||[]).forEach(s=>(s.payments||[]).forEach(pm=>{ if(pm.method==='cash'&&(+pm.amount)>0) e.push({date:pm.date||s.date,dir:'in',amount:+pm.amount,cat:'sale',desc:'Sale '+(s.invoiceNo||'')+(s.customer?' · '+s.customer:''),who:s.collectedBy||s.byId||''}); }));
  (DB.purchases||[]).forEach(p=>(p.payments||[]).forEach(pm=>{ if(pm.method==='cash'&&(+pm.amount)>0) e.push({date:pm.date||p.date,dir:'out',amount:+pm.amount,cat:'purchase',desc:'Purchase '+(p.ref||'')+(p.supplier?' · '+p.supplier:''),who:p.byId||''}); }));
  (DB.cards||[]).forEach(c=>(c.txns||[]).forEach(t=>{ if(t.fromCash&&(t.type==='recharge'||t.type==='payment')&&(+t.amount)>0) e.push({date:t.date,dir:'out',amount:+t.amount,cat:'card',desc:(t.type==='recharge'?'Card recharge · ':'Card payment · ')+c.name,who:t.byId||''}); }));
  e.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  return e;
}
function walletBalance(pid){ return cashEntries().filter(x=>x.who===pid).reduce((a,x)=>a+(x.dir==='in'?x.amount:-x.amount),0); }
function cashBalance(){ return cashEntries().reduce((a,x)=>a+(x.dir==='in'?x.amount:-x.amount),0); }

function renderProfit(){
  const eng=computeEngine();
  const from=$('#rpFrom')?.value, to=$('#rpTo')?.value;
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const sales=DB.sales.filter(s=>inRange(s.date));
  const purch=DB.purchases.filter(p=>inRange(p.date));
  let rev=0,netRev=0,cogs=0,vat=0,disc=0,cashS=0,cardS=0;
  sales.forEach(s=>{rev+=s.total;netRev+=netOf(s);cogs+=eng.saleCost[s.id]||0;vat+=s.vat||0;disc+=s.discount||0;s.payment==='card'?cardS+=s.total:cashS+=s.total;});
  const buyTot=purch.reduce((a,p)=>a+purchaseTotal(p),0);
  let cashB=0,cardB=0;purch.forEach(p=>(p.payments||[]).forEach(pm=>pm.method==='card'?cardB+=pm.amount:cashB+=pm.amount));
  const profit=netRev-cogs; const margin=netRev>0?(profit/netRev*100):0;
  const byProd={};
  sales.forEach(s=>s.items.forEach(it=>{const p=productById(it.productId); if(!p)return; const avg=avgCostOf(it.productId,eng);
    const pr=byProd[it.productId]||(byProd[it.productId]={name:p.name,qty:0,rev:0,profit:0});
    pr.qty+=it.qty; pr.rev+=it.qty*it.rate; pr.profit+=it.qty*(it.rate-avg);}));
  const top=Object.values(byProd).sort((a,b)=>b.profit-a.profit).slice(0,8);
  /* daily report — date-wise sales/purchases split by cash & card */
  const daily={}; const D=d=>daily[d]||(daily[d]={sales:0,purch:0,cashS:0,cardS:0,cashP:0,cardP:0});
  sales.forEach(s=>{ D(s.date).sales+=s.total; });
  purch.forEach(p=>{ D(p.date).purch+=purchaseTotal(p); });
  DB.sales.forEach(s=>(s.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardS+=pm.amount; else if(pm.method==='cash')r.cashS+=pm.amount; }));
  DB.purchases.forEach(p=>(p.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardP+=pm.amount; else if(pm.method==='cash')r.cashP+=pm.amount; }));
  const days=Object.keys(daily).sort((a,b)=>a<b?1:-1);
  const dailyHtml=days.length?`<div class="table-wrap"><table style="min-width:760px">
    <thead><tr><th>Date</th><th class="num">Sales</th><th class="num">Cash Sales</th><th class="num">Card Sales</th><th class="num">Purchases</th><th class="num">Cash Purch.</th><th class="num">Card Purch.</th></tr></thead>
    <tbody>${days.map(d=>{const r=daily[d];return `<tr><td><b>${fmtDate(d)}</b></td>
      <td class="num">${money(r.sales)}</td><td class="num" style="color:var(--green)">${money(r.cashS)}</td><td class="num" style="color:var(--brand2)">${money(r.cardS)}</td>
      <td class="num">${money(r.purch)}</td><td class="num" style="color:var(--green)">${money(r.cashP)}</td><td class="num" style="color:var(--brand2)">${money(r.cardP)}</td></tr>`;}).join('')}</tbody></table></div>`
    :emptyBox('📅','No activity','No sales or purchases in this period.');
  $('#profitBody').innerHTML=`
  <div class="cards">
    <div class="stat gold"><span class="ic">🧾</span><div class="label">Net Sales (excl VAT)</div><div class="val">${money(netRev)}</div><div class="foot">${sales.length} sale(s) · gross ${money(rev)}</div></div>
    <div class="stat blue"><span class="ic">📦</span><div class="label">Cost of Goods Sold</div><div class="val">${money(cogs)}</div></div>
    <div class="stat green"><span class="ic">💰</span><div class="label">Gross Profit</div><div class="val">${money(profit)}</div><div class="foot">${margin.toFixed(1)}% margin</div></div>
    <div class="stat"><span class="ic">🧮</span><div class="label">VAT Collected</div><div class="val">${money(vat)}</div><div class="foot">Discounts given ${money(disc)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Cash vs Card</h3><p class="psub">In the selected period</p>
      <div class="table-wrap"><table><thead><tr><th>Channel</th><th class="num">Sales</th><th class="num">Purchases</th></tr></thead>
      <tbody>
        <tr><td><span class="tag cash">CASH</span></td><td class="num">${money(cashS)}</td><td class="num">${money(cashB)}</td></tr>
        <tr><td><span class="tag card">CARD</span></td><td class="num">${money(cardS)}</td><td class="num">${money(cardB)}</td></tr>
        <tr><td><b>Total</b></td><td class="num"><b>${money(rev)}</b></td><td class="num"><b>${money(buyTot)}</b></td></tr>
      </tbody></table></div>
    </div>

      ${top.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Revenue</th><th class="num">Profit</th></tr></thead>
      <tbody>${top.map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${num(t.qty)}</td><td class="num">${money(t.rev)}</td><td class="num" style="color:${t.profit>=0?'var(--green)':'var(--red)'}">${money(t.profit)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('📈','No data','No sales in this period.')}
    </div>

function fmtDayLong(d){ const p=(d||'').split('-'); if(p.length!==3)return d;
  const dt=new Date(+p[0],+p[1]-1,+p[2]); return dt.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short',year:'numeric'}); }
function dayCalChip(d){ const p=(d||'').split('-'); if(p.length!==3)return '';
  const dt=new Date(+p[0],+p[1]-1,+p[2]); const mon=dt.toLocaleDateString('en-GB',{month:'short'});
  return `<div class="rd-cal"><div class="m">${mon}</div><div class="d">${p[2]}</div></div>`; }
/* gather every day's invoices, purchases, cash & card activity + per-day and range totals */
function daybookData(inR){
  const eng=computeEngine();
  const day={}, get=d=>day[d]||(day[d]={date:d,sales:[],purch:[],cash:[],cards:[],recvC:0,recvK:0,paidC:0,paidK:0});
  DB.sales.forEach(s=>{ if(inR(s.date))get(s.date).sales.push(s);
    (s.payments||[]).forEach(pm=>{ if(inR(pm.date)){ const g=get(pm.date); if(pm.method==='card')g.recvK+=+pm.amount||0; else g.recvC+=+pm.amount||0; } }); });
  DB.purchases.forEach(p=>{ if(inR(p.date))get(p.date).purch.push(p);
    (p.payments||[]).forEach(pm=>{ if(inR(pm.date)){ const g=get(pm.date); if(pm.method==='card')g.paidK+=+pm.amount||0; else g.paidC+=+pm.amount||0; } }); });
  cashEntries().forEach(e=>{ if(e.date&&inR(e.date))get(e.date).cash.push(e); });
  (DB.cards||[]).forEach(c=>(c.txns||[]).forEach(t=>{ if(inR(t.date))get(t.date).cards.push({...t,card:c.name}); }));
  const dates=Object.keys(day).sort((a,b)=>a<b?1:-1);
  const totals={salesTotal:0,received:0,purchTotal:0,paid:0,netCash:0,profit:0,salesCount:0,purchCount:0};
  dates.forEach(d=>{ const g=day[d];
    g.salesTotal=g.sales.reduce((a,s)=>a+(+s.total||0),0);
    g.profit=g.sales.reduce((a,s)=>a+(netOf(s)-(eng.saleCost[s.id]||0)),0);
    g.purchTotal=g.purch.reduce((a,p)=>a+purchaseTotal(p),0);
    g.received=g.recvC+g.recvK; g.paid=g.paidC+g.paidK;
    g.cashIn=g.cash.filter(x=>x.dir==='in').reduce((a,x)=>a+x.amount,0);
    g.cashOut=g.cash.filter(x=>x.dir==='out').reduce((a,x)=>a+x.amount,0);
    g.netCash=g.cashIn-g.cashOut;
    g.expenses=g.cash.filter(x=>x.cat==='expense').reduce((a,x)=>a+x.amount,0);
    totals.salesTotal+=g.salesTotal; totals.received+=g.received; totals.purchTotal+=g.purchTotal; totals.paid+=g.paid;
    totals.netCash+=g.netCash; totals.profit+=g.profit; totals.salesCount+=g.sales.length; totals.purchCount+=g.purch.length; });
  return {dates,day,totals,eng};
}

  if(g.cash.length) sec+=`<div class="rep-sec"><div class="rsh">🧰 Cash movements <span class="cc">${g.cash.length}</span><span class="amt" style="color:${g.netCash>=0?'var(--green)':'var(--red)'}">${g.netCash>=0?'+':'−'}${money(Math.abs(g.netCash))}</span></div>
    <div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Type</th><th>Description</th><th>By</th><th class="num">In</th><th class="num">Out</th></tr></thead>

function exportDaybookExcel(){
  const from=$('#dbFrom')?.value, to=$('#dbTo')?.value, inR=d=>(!from||d>=from)&&(!to||d<=to);
  const {dates,day,totals,eng}=daybookData(inR); const owner=isOwner();
  if(!dates.length){ toast('Nothing to export in this period',1); return; }
  const head=['Date','Invoices','Sales','Collected Cash','Collected Card','Purchases','Paid Cash','Paid Card','Cash In','Cash Out','Net Cash']; if(owner)head.push('Profit');
  const rows=[head];
  dates.forEach(d=>{const g=day[d]; const r=[d,g.sales.length,num2(g.salesTotal),num2(g.recvC),num2(g.recvK),num2(g.purchTotal),num2(g.paidC),num2(g.paidK),num2(g.cashIn),num2(g.cashOut),num2(g.netCash)]; if(owner)r.push(num2(g.profit)); rows.push(r);});
  const tot=['TOTAL',totals.salesCount,num2(totals.salesTotal),'','',num2(totals.purchTotal),'','','','',num2(totals.netCash)]; if(owner)tot.push(num2(totals.profit)); rows.push([]); rows.push(tot);

async function buildDayPdf(dstr){
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return null; }
  const html=daySummaryHtml(dstr); if(!html){ toast('No activity on this day',1); return null; }
  const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;z-index:-1';
  holder.innerHTML=html; document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#invoiceArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); } else { let left=imgH,pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }
    return {blob:pdf.output('blob'), filename:'daily_account_'+dstr+'.pdf'};
  }catch(e){ toast('Could not build the PDF',1); return null; }
  finally{ document.body.removeChild(holder); }
}
async function pdfDay(dstr){ toast('Preparing PDF…',0); const r=await buildDayPdf(dstr); if(!r)return;
  const url=URL.createObjectURL(r.blob); const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); toast('PDF ready — '+r.filename); }
/* ---- Card Statement report ---- */
function cardStatementPanel(c,inR){
  const limit=+c.creditLimit||0, out=cardOutstanding(c), avail=limit-out, usedPct=limit>0?Math.min(100,Math.max(0,out/limit*100)):0;
  const due=nextDue(c.paymentDay), dl=daysUntil(due);
  const asc=[...(c.txns||[])].sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  let bal=+c.openingOutstanding||0; const rr=[];
  asc.forEach(t=>{ bal += t.type==='purchase'?(+t.amount||0):-(+t.amount||0); if(inR(t.date)) rr.push({...t,bal}); });
  let spend=0,pay=0,redeem=0,pcount=0,maxp=0; rr.forEach(t=>{ if(t.type==='purchase'){spend+=+t.amount||0;pcount++;maxp=Math.max(maxp,+t.amount||0);} else if(t.type==='payment'||t.type==='recharge')pay+=+t.amount||0; else if(t.type==='discount')redeem+=+t.amount||0; });
  const avg=pcount?spend/pcount:0;
  const disp=[...rr].reverse();
  const ledger= disp.length? disp.map(t=>`<tr><td>${fmtDate(t.date)}</td><td><span class="tag ${t.type}">${txnLabel(t.type)}</span></td><td>${esc(t.note||'')}</td>${txnAmtCell(t)}<td class="num" style="font-weight:700">${money(t.bal)}</td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted2);padding:18px">No transactions in this period</td></tr>`;
  const k=(kk,vv,cls)=>`<div class="kk"><div class="k">${kk}</div><div class="v"${cls?` style="color:${cls}"`:''}>${vv}</div></div>`;
  return `<div class="panel">
    <div class="rep-cardhead">
      <div class="cv">${cardVisual(c)}</div>
      <div class="cvk">
        ${k('Credit Limit',money(limit))}
        ${k('Outstanding',money(out),out>0.005?'var(--amber)':'var(--green)')}
        ${k('Available',money(avail),avail<0?'var(--red)':'var(--green)')}
        ${k('Usage',Math.round(usedPct)+'%')}
        ${k('Spend · period',money(spend))}
        ${k('Payments · period',money(pay))}
        ${k('Redeem · period',money(redeem),'var(--gold2)')}
        ${k('Next due',fmtDate(isoDate(due))+' · '+(dl<=0?'today':dl+'d'), (dl<=3&&out>0.005)?'var(--red)':'')}
      </div>
    </div>
    <div class="bar" style="margin:2px 2px 12px"><i style="width:${usedPct}%"></i></div>
    <div style="display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 2px 8px">📄 Statement <span class="cc" style="background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--text)">${rr.length} txn${rr.length===1?'':'s'}</span><span style="margin-left:auto;color:var(--muted2);font-weight:700;text-transform:none;letter-spacing:0">${pcount} buy · avg ${money(avg)} · max ${money(maxp)}</span></div>
    <div class="table-wrap"><table style="min-width:560px"><thead><tr><th>Date</th><th>Type</th><th>Note</th><th class="num">Amount</th><th class="num">Outstanding</th></tr></thead><tbody>${ledger}</tbody></table></div>
  </div>`;
}
