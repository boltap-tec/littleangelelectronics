/* =========================================================
   GIFT CARDS  (stored-value cards bought at Carrefour / other stores)
   A gift card is bought like a product (loads a balance), then used as a
   payment method on purchases & sales — each use spends down its balance and
   is kept in the card's payment history. Balance is derived from the ledger:
     load / adjust(+)  → balance up      spend / adjust(−) → balance down
   ========================================================= */
const GIFT_STORES=['Carrefour','Lulu Hypermarket','Amazon','Noon','Sharaf DG','Emax','Apple','Other'];
function giftById(id){ return (DB.giftcards||[]).find(g=>g.id===id); }
function giftBalance(g){ if(!g)return 0; let b=+g.openingBalance||0;
  (g.txns||[]).forEach(t=>{ const a=+t.amount||0; if(t.type==='load')b+=a; else if(t.type==='spend')b-=a; else if(t.type==='adjust')b+=a; }); return b; }
function giftActive(g){ return g && g.status!=='inactive'; }
function giftIsProduct(g){ return !!(g && g.kind==='product'); }
function giftProducts(){ return (DB.giftcards||[]).filter(giftIsProduct); }
function activeGiftProducts(){ return giftProducts().filter(giftActive); }
/* payment pickers everywhere use gift-card PRODUCTS only (legacy numbered cards are archived) */
function activeGiftCards(){ return activeGiftProducts(); }
function giftLabel(g){ if(!g)return ''; if(giftIsProduct(g))return g.name||'Gift card';
  const l4=(g.number||'').replace(/\D/g,'').slice(-4); const p=[g.name]; if(g.store)p.push(g.store); if(l4)p.push('••'+l4); return p.join(' · '); }
function allGiftStores(){ return uniqSorted([...GIFT_STORES,...(DB.giftcards||[]).map(g=>g.store)]); }
/* balance usable on THIS purchase (adds back this purchase's own spends when editing) */
function giftAvailForSplit(g){ let adj=0; if(_buyEditId)(g.txns||[]).forEach(t=>{ if(t.srcPurchaseId===_buyEditId && t.type==='spend') adj+=(+t.amount||0); }); return giftBalance(g)+adj; }
/* spend from a gift card (used as payment) + keep it in the card's history */
function spendGift(g,amount,date,note,srcPurchaseId,srcSaleId){ if(!g)return; if(!g.txns)g.txns=[];
  g.txns.push({id:uid(),date,type:'spend',amount:+amount||0,note:note||'Payment',srcPurchaseId:srcPurchaseId||undefined,srcSaleId:srcSaleId||undefined}); }
function unlinkPurchaseFromGifts(pid){ (DB.giftcards||[]).forEach(g=>{ if(g.txns) g.txns=g.txns.filter(t=>t.srcPurchaseId!==pid); }); }
function unlinkSaleFromGifts(sid){ (DB.giftcards||[]).forEach(g=>{ if(g.txns) g.txns=g.txns.filter(t=>t.srcSaleId!==sid); }); }

function giftVisual(g){
  const bal=giftBalance(g), prod=giftIsProduct(g), l4=(g.number||'').replace(/\D/g,'').slice(-4);
  const grad = giftActive(g) ? 'linear-gradient(135deg,#be185d,#7c3aed 55%,#f59e0b)' : 'linear-gradient(135deg,#4b5563,#374151)';
  return `<div class="ccard" style="background:${grad};${giftActive(g)?'':'opacity:.6'}" onclick="giftDetail('${g.id}')">
    <div class="cc-pct">🎁 GIFT</div>
    ${!giftActive(g)?`<div class="cc-pct" style="left:16px;right:auto;background:rgba(0,0,0,.35)">${prod?'INACTIVE':'ARCHIVED'}</div>`:''}
    <div class="cc-top"><div><div class="cc-name">${esc(g.name)}</div><div class="cc-bank">${esc(prod?'Gift Card':(g.store||'Gift Card'))}</div>
      ${(!prod&&l4)?`<div class="cc-holder">ending ${l4}</div>`:''}</div><div class="cc-chip"></div></div>
    <div>
      ${prod?'':`<div class="cc-num" style="letter-spacing:1.5px">${g.number?esc(g.number):'—'}</div>`}
      <div class="cc-foot">
        <div><div style="opacity:.85">Balance</div><div class="cc-avail">${money(bal)}</div></div>
        <div style="text-align:right"><div style="opacity:.85;margin-bottom:2px">${esc(prod?'':(g.store||''))}</div><span class="cc-due">${g.date?fmtDate(g.date):''}</span></div>
      </div>
    </div></div>`;
}
function giftCell(g){ const prod=giftIsProduct(g); return `<div>${giftVisual(g)}
  <div class="row-actions" style="margin-top:9px;justify-content:center">
    ${prod?`<button class="mini-btn gold" onclick="event.stopPropagation();purchaseGiftModal('${g.id}')">＋ Recharge</button>`:''}
    <button class="mini-btn" onclick="event.stopPropagation();giftTxnModal('${g.id}','spend')">− Use</button>
    ${isOwner()?`<button class="mini-btn" onclick="event.stopPropagation();giftAdjustModal('${g.id}')">✎ Balance</button>`:''}
    <button class="mini-btn" onclick="event.stopPropagation();giftDetail('${g.id}')">Details</button>
  </div></div>`; }

views.giftcards=function(){
  return `
  <div class="page-head"><div><h2>🎁 Gift Cards</h2><p>Gift-card types you deal in (Lulu, Carrefour, Apple…), each with a running balance. Buy / recharge a balance — cash may carry a discount so you pay less than the balance — then use it to pay for stock.</p></div>
    <div class="row-actions"><button class="btn-sm btn-ghost" onclick="toggleGiftHist()">📜 History</button><button class="btn-sm btn-ghost" onclick="newGiftProductModal()">＋ New Gift Card</button><button class="btn-sm" onclick="purchaseGiftModal()">🎁 Buy / Recharge</button></div></div>
  <div class="toolbar">
    <div class="search"><span class="si">🔎</span><input id="giftSearch" placeholder="Search gift card name..." oninput="renderGiftCards()"></div>
  </div>
  <div id="giftStats" class="cards"></div>
  <div id="giftHist"></div>
  <div id="giftWrap"></div>`;
};
views._after_giftcards=renderGiftCards;
let _giftShowHist=false;
function toggleGiftHist(){ _giftShowHist=!_giftShowHist; renderGiftCards(); }
/* every gift-card transaction across all cards, newest first */
function giftAllTxns(){ const out=[]; (DB.giftcards||[]).forEach(g=>{ (g.txns||[]).forEach(t=>out.push({...t,giftId:g.id,giftName:g.name})); });
  out.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)); return out; }
function giftHistoryHtml(q){
  const all=giftAllTxns().filter(t=>!q||[(t.giftName||''),(t.note||'')].some(v=>v.toLowerCase().includes(q)));
  if(!all.length)return `<div class="panel" style="margin-bottom:14px;padding:12px 14px"><div class="cat-head" style="margin:0 0 6px">📜 Overall gift-card history</div><div class="li-hint">No transactions yet.</div></div>`;
  let load=0,spend=0,adj=0;
  const rows=all.map(t=>{ const amt=+t.amount||0; if(t.type==='load')load+=amt; else if(t.type==='spend')spend+=amt; else if(t.type==='adjust')adj+=amt;
    const signed=t.type==='spend'?`<span style="color:var(--red)">− ${money(amt)}</span>`:(t.type==='adjust'?`${amt<0?'− ':'+ '}${money(Math.abs(amt))}`:`<span style="color:var(--green)">+ ${money(amt)}</span>`);
    return `<tr><td>${fmtDate(t.date)}</td><td><b class="rowlink" onclick="giftDetail('${t.giftId}')">${esc(t.giftName||'—')}</b></td><td><span class="tag ${t.type}">${txnLabel(t.type)}</span></td><td style="white-space:normal">${esc(t.note||'')}</td><td class="num">${signed}</td><td>${esc(userName(t.byId||''))}</td></tr>`; }).join('');
  return `<div class="panel" style="margin-bottom:14px;padding:12px 14px">
    <div class="cat-head" style="margin:0 0 8px">📜 Overall gift-card history <span class="cc">${all.length} entr${all.length===1?'y':'ies'}</span></div>
    <div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Date</th><th>Gift Card</th><th>Type</th><th>Note</th><th class="num">Amount</th><th>By</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td colspan="4">TOTAL — loaded ${money(load)} · spent ${money(spend)}${adj?` · adjust ${money(adj)}`:''}</td><td class="num">${money(load-spend+adj)}</td><td></td></tr></tfoot>
    </table></div></div>`;
}
function renderGiftCards(){
  const host=$('#giftWrap'); if(!host)return;
  const all=DB.giftcards||[];
  const q=($('#giftSearch')?.value||'').toLowerCase().trim();
  const gh=$('#giftHist'); if(gh)gh.innerHTML=_giftShowHist?giftHistoryHtml(q):'';
  const match=g=>!q||[g.name,g.store,g.number].some(v=>(v||'').toLowerCase().includes(q));
  const prods=all.filter(g=>giftIsProduct(g)&&match(g));
  const legacy=all.filter(g=>!giftIsProduct(g)&&match(g));
  let tBal=0,tLoad=0; prods.forEach(g=>{ tBal+=giftBalance(g); (g.txns||[]).forEach(t=>{ if(t.type==='load')tLoad+=+t.amount||0; }); });
  const cs=$('#giftStats'); if(cs)cs.innerHTML=prods.length?`
    <div class="stat green"><span class="ic">🎁</span><div class="label">Total Balance</div><div class="val">${money(tBal)}</div><div class="foot">${prods.length} gift card${prods.length===1?'':'s'}</div></div>
    <div class="stat blue"><span class="ic">💰</span><div class="label">Total Loaded</div><div class="val">${money(tLoad)}</div></div>
    <div class="stat gold"><span class="ic">🛍️</span><div class="label">Spent</div><div class="val">${money(Math.max(0,tLoad-tBal))}</div></div>`:'';
  if(!prods.length && !legacy.length){ host.innerHTML=`<div class="panel">${q?emptyBox('🔎','No matches','No gift cards match your search.'):emptyBox('🎁','No gift cards yet','Add a gift-card type (e.g. Lulu, Carrefour, Apple) with ＋ New Gift Card — then Buy / Recharge its balance and use it to pay for stock.')}</div>`; return; }
  const act=prods.filter(giftActive), inact=prods.filter(g=>!giftActive(g));
  const sec=(title,arr,color)=>arr.length?`<div class="cat-head">${title} <span class="cc" style="color:${color}">${arr.length}</span></div><div class="ccgrid">${arr.map(giftCell).join('')}</div>`:'';
  host.innerHTML=sec('🟢 Active',act,'var(--green)')+sec('⚪ Inactive',inact,'var(--muted)')
    +(legacy.length?`<div class="cat-head" style="margin-top:18px">📦 Archived — old numbered cards <span class="cc" style="color:var(--muted)">${legacy.length}</span></div><div class="li-hint" style="margin:-4px 2px 10px">Your previous individual gift cards, kept for history. You can still spend down any balance; new buys use the gift-card products above.</div><div class="ccgrid">${legacy.map(giftCell).join('')}</div>`:'');
}
/* add a gift-card product (a type: Lulu / Carrefour / Apple …) */
function newGiftProductModal(){
  if(!requireOnline())return;
  openModal('New Gift Card',`
    <p style="margin:0 0 12px;color:var(--muted);font-size:13px">Add a gift-card type you deal in — e.g. Lulu, Carrefour, Apple. You'll buy / recharge its balance and use it to pay for stock. No card number needed.</p>
    <div class="field"><label>Gift Card Name *</label><input id="gp_name" placeholder="e.g. Lulu Gift Card" list="dl_giftname">${dataList('dl_giftname',GIFT_STORES)}</div>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn-sm" onclick="saveGiftProduct()">Add</button>`);
  setTimeout(()=>$('#gp_name')?.focus(),30);
}
function saveGiftProduct(reopenBuy){
  if(!requireOnline())return;
  const name=$('#gp_name').value.trim(); if(!name)return toast('Enter a gift card name',1);
  if(giftProducts().some(g=>(g.name||'').toLowerCase()===name.toLowerCase())){ toast('That gift card already exists',1); return; }
  const g={id:uid(),name,kind:'product',status:'active',openingBalance:0,byId:session.id,date:todayStr(),txns:[]};
  DB.giftcards.push(g); logAct('create','gift card',name,'gift-card product'); save();
  toast('Gift card "'+name+'" added');
  if(reopenBuy){ purchaseGiftModal(g.id); } else { closeModal(); if($('.nav-item.active')?.dataset.view==='giftcards')renderGiftCards(); }
}

/* ---- purchase (buy) a gift card — like buying a product; loads its balance ----
   Paid for with the same split payment as a product purchase: cash and/or one
   or more credit cards (charge a card to still earn its cashback). */
let giftBuySplits=[];
function newGiftFromBuy(){
  openModal('New Gift Card',`
    <p style="margin:0 0 12px;color:var(--muted);font-size:13px">Add a gift-card type (Lulu, Carrefour, Apple…), then continue the recharge.</p>
    <div class="field"><label>Gift Card Name *</label><input id="gp_name" placeholder="e.g. Lulu Gift Card" list="dl_giftname">${dataList('dl_giftname',GIFT_STORES)}</div>`,
    `<button class="btn-sm btn-ghost" onclick="purchaseGiftModal()">Back</button>
     <button class="btn-sm" onclick="saveGiftProduct(true)">Add &amp; continue</button>`);
  setTimeout(()=>$('#gp_name')?.focus(),30);
}
function purchaseGiftModal(preId){
  if(!requireOnline())return;
  const prods=activeGiftProducts();
  if(!prods.length){ toast('Add a gift card first',1); return newGiftProductModal(); }
  giftBuySplits=[{method:'cash',cardId:'',giftId:'',ref:'',deductPct:'',lenderId:'',lenderCardId:'',commission:'',amount:''}];
  openModal('Buy / Recharge Gift Card',`
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Load balance onto a gift card. The <b>amount</b> is the balance you receive; pay for it below — a cash discount means you pay less than the balance (that's your margin).</p>
    <div class="grid2">
      <div class="field"><label>Gift Card *</label><select id="g_product" class="srch">${prods.map(g=>`<option value="${g.id}" ${g.id===preId?'selected':''}>${esc(g.name)} · bal ${money(giftBalance(g))}</option>`).join('')}</select>
        <button type="button" class="mini-btn" style="margin-top:6px" onclick="newGiftFromBuy()">＋ New gift card</button></div>
      <div class="field"><label>Date</label><input id="g_date" type="date" value="${todayStr()}"></div>
    </div>
    <div class="field"><label>Amount / balance received (${S().currency}) *</label><input id="g_amt" type="number" min="0" step="any" placeholder="face value loaded onto the card" oninput="giftBuyCalc()"></div>
    <div class="li-hint" id="g_availhint" style="margin-top:5px"></div>
    <label style="font-size:12.5px;color:var(--muted);font-weight:600">Payment — cash / card / combination (same as a purchase)</label>
    <div class="line-items" style="padding:8px"><div id="gb_splits"></div></div>
    <div class="row-actions" style="margin-bottom:4px"><button class="mini-btn" onclick="addGiftBuySplit()">＋ Add payment</button><button class="mini-btn gold" onclick="giftBuyFillRemaining()">Fill balance</button></div>
    <div class="totbox" id="gb_tot" style="margin-top:12px"></div>
    <div class="field" style="margin-top:12px"><label>Note (optional)</label><input id="g_note" placeholder="e.g. bought from / receipt no."></div>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn-sm" onclick="saveGiftPurchase()">Save</button>`);
  renderGiftBuySplits(); setTimeout(()=>$('#g_amt')?.focus(),30);
}
/* gift-card purchase uses the SAME payment methods as normal & online purchases */
function renderGiftBuySplits(){
  const host=$('#gb_splits'); if(!host)return; const cards=activeCards();
  host.innerHTML=giftBuySplits.map((s,i)=>{
    const info=payMethodInfo(s.method);
    const opts=PAY_METHODS.map(m=>`<option value="${m.k}" ${s.method===m.k?'selected':''}>${m.label}</option>`).join('');
    let mid, hint='';
    if(s.method==='card'||info.savedCard){
      mid = cards.length
        ? `<select class="srch" onchange="giftBuySplits[${i}].cardId=this.value;giftBuyCalc()"><option value="">— select card${s.method==='card'?' *':''} —</option>${cards.map(c=>`<option value="${c.id}" ${s.cardId===c.id?'selected':''}>${esc(c.name)}${c.owner?' · '+esc(cardOwnerLabel(c)):''} · avail ${money(cardAvailable(c))}</option>`).join('')}</select>`
        : `<div style="color:var(--amber);font-size:11.5px;align-self:center">No cards — add one in Credit Cards</div>`;
      if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId), av=c?cardAvailable(c):0, over=(+s.amount||0)-av;
        const _gp=c?cardCashbackCfg(c).pct:0;
        hint=`<div class="li-hint">Available <b style="color:var(--text)">${money(av)}</b>${_gp?` · earns ${_gp}% cashback`:''}${over>1e-6&&!(c&&cardAllowsNeg(c))?` · <span style="color:var(--red)">🚫 exceeds by ${money(over)}</span>`:''}</div>`; }
    } else if(info.savedGift){
      const gifts=activeGiftCards();
      mid = gifts.length
        ? `<select onchange="giftBuySplits[${i}].giftId=this.value;giftBuyCalc()"><option value="">— select gift card * —</option>${gifts.map(g=>`<option value="${g.id}" ${s.giftId===g.id?'selected':''}>${esc(giftLabel(g))} · bal ${money(giftBalance(g))}</option>`).join('')}</select>`
        : `<div style="color:var(--amber);font-size:11.5px;align-self:center">No gift cards available</div>`;
    } else if(s.method==='cardborrow'){
      const lenders=activeLenders(), l=s.lenderId?lenderById(s.lenderId):null, lc=l?(l.cards||[]):[];
      mid=`<div style="display:flex;flex-direction:column;gap:6px">
        <select onchange="giftBorrowLender(${i},this.value)"><option value="">— lender * —</option>${lenders.map(x=>`<option value="${x.id}" ${s.lenderId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        ${l?`<select class="srch" onchange="giftBorrowCard(${i},this.value)"><option value="">— card * —</option>${lc.map(c=>`<option value="${c.id}" ${s.lenderCardId===c.id?'selected':''}>${esc(lenderCardLabel(c))} (${c.commission||0}%)</option>`).join('')}<input type="number" min="0" max="100" step="any" value="${s.commission!=null&&s.commission!==''?s.commission:''}" placeholder="Commission %" oninput="giftBuySplits[${i}].commission=this.value" style="margin-top:6px">`:''}
      </div>`;
      if(!lenders.length)hint='<div class="li-hint" style="color:var(--amber)">No lenders — add one in Card Lenders</div>';
    } else if(info.ref){
      const req=info.ref==='mandatory';
      mid=`<input type="text" ${info.refKind==='tel'?'inputmode="tel"':''} value="${esc(s.ref||'')}" placeholder="${esc(info.refLabel)}${req?' *':''}" oninput="giftBuySplits[${i}].ref=this.value">`;
    } else if(s.method==='cash'){
      mid=`<input class="gb-disc" type="number" min="0" max="100" step="any" value="${s.deductPct!=null&&s.deductPct!==''?s.deductPct:''}" placeholder="Cash discount %" oninput="giftBuyDiscount(${i},this.value)">`;
      if(+s.deductPct>0)hint=`<div class="li-hint">Cash discount ${(+s.deductPct)}% → pay <b style="color:var(--green)">${money((+s.amount||0)*(1-(+s.deductPct||0)/100))}</b> cash</div>`;
    } else {
      mid=`<div style="color:var(--muted2);font-size:12px;align-self:center">Out of wallet</div>`;
    }
    return `<div class="split-row">
      <select onchange="giftBuySplits[${i}].method=this.value;giftBuySplits[${i}].cardId='';giftBuySplits[${i}].giftId='';giftBuySplits[${i}].ref='';giftBuySplits[${i}].deductPct='';giftBuySplits[${i}].lenderId='';giftBuySplits[${i}].lenderCardId='';giftBuySplits[${i}].commission='';renderGiftBuySplits()">${opts}</select>
      ${mid}
      <input type="number" min="0" step="any" value="${s.amount}" placeholder="Amount" oninput="giftBuySplits[${i}].amount=this.value;giftBuyCalc()">
      <button class="li-x" onclick="giftBuySplits.splice(${i},1);renderGiftBuySplits()">✕</button>
    </div>${hint}`;
  }).join('');
  giftBuyCalc();
}
function giftBorrowLender(i,val){ giftBuySplits[i].lenderId=val; giftBuySplits[i].lenderCardId=''; giftBuySplits[i].commission=''; renderGiftBuySplits(); }
function giftBorrowCard(i,val){ giftBuySplits[i].lenderCardId=val; const l=lenderById(giftBuySplits[i].lenderId), c=lenderCardById(l,val); giftBuySplits[i].commission=c?(c.commission||0):''; renderGiftBuySplits(); }
function addGiftBuySplit(){ giftBuySplits.push({method:'cash',cardId:'',giftId:'',ref:'',deductPct:'',lenderId:'',lenderCardId:'',commission:'',amount:''}); renderGiftBuySplits(); flashNewRow('#gb_splits .split-row'); }
/* remaining balance not yet covered by any payment row */
function giftBuyRemaining(){ const amt=+($('#g_amt')?.value||0); return Math.round((amt-giftBuySplits.reduce((a,s)=>a+(+s.amount||0),0))*100)/100; }
/* fill the last payment row with whatever balance is still uncovered */
function giftBuyFillRemaining(){ const rem=giftBuyRemaining(); if(rem<=0.001)return;
  if(giftBuySplits.length)giftBuySplits[giftBuySplits.length-1].amount=Math.round(((+giftBuySplits[giftBuySplits.length-1].amount||0)+rem)*100)/100;
  else giftBuySplits.push({method:'cash',cardId:'',giftId:'',ref:'',deductPct:'',lenderId:'',lenderCardId:'',commission:'',amount:rem});
  renderGiftBuySplits(); }
/* typing a cash discount on a row with no amount yet auto-fills the balance it covers (still editable) */
function giftBuyDiscount(i,val){ const s=giftBuySplits[i]; s.deductPct=val;
  if(s.amount===''||s.amount==null||+s.amount===0){
    const amt=+($('#g_amt')?.value||0), others=giftBuySplits.reduce((a,x,j)=>a+(j===i?0:(+x.amount||0)),0), rem=Math.round((amt-others)*100)/100;
    if(rem>0){ s.amount=rem; renderGiftBuySplits();
      const row=document.querySelectorAll('#gb_splits .split-row')[i], d=row&&row.querySelector('.gb-disc');
      if(d){ d.focus(); const v=d.value; d.value=''; d.value=v; }   // re-render moved caret — restore it
      return; }
  }
  giftBuyCalc(); }
function onGiftQty(){ const qty=Math.max(1,Math.floor(+($('#g_qty')?.value||1))); const single=$('#g_singlenum'), wrap=$('#g_numwrap');
  if(single)single.style.display=qty>1?'none':''; if(wrap)wrap.style.display=qty>1?'':'none'; giftBuyCalc(); }
function giftBuyCalc(){
  const amt=+($('#g_amt')?.value||0);
  // suggest how much funding is on hand (cash wallet + the best available card)
  const ah=$('#g_availhint');
  if(ah){ const wallet=walletBalance(session.id), cards=activeCards();
    const bestCard=cards.length?cards.reduce((a,b)=>cardAvailable(b)>cardAvailable(a)?b:a):null;
    const parts=[`💵 Cash in wallet <b style="color:var(--text)">${money(wallet)}</b>`];
    if(bestCard)parts.push(`💳 ${esc(bestCard.name)} avail <b style="color:var(--text)">${money(cardAvailable(bestCard))}</b>`);
    const short = amt>0 && amt>wallet && (!bestCard || amt>cardAvailable(bestCard));
    ah.innerHTML=`Available to pay — ${parts.join(' · ')}${short?` · <span style="color:var(--amber)">⚠ more than any single source — split it across cash &amp; cards below</span>`:''}`;
  }
  const paid=giftBuySplits.reduce((a,s)=>a+(+s.amount||0),0), rem=amt-paid;
  const box=$('#gb_tot'); if(box)box.innerHTML=`
    <div class="totrow"><span>Balance loaded</span><span><b>${money(amt)}</b></span></div>
    <div class="totrow"><span>Paid now</span><span>${money(paid)}</span></div>
    <div class="totrow grand"><span>${Math.abs(rem)<0.01?'Fully paid':(rem>0?'Untracked (already owned / gifted)':'Overpaid')}</span>
      <span style="color:${Math.abs(rem)<0.01?'var(--green)':(rem>0?'var(--amber)':'var(--red)')}">${money(Math.abs(rem))}</span></div>`;
}
function saveGiftPurchase(){
  if(!requireOnline())return;
  const gid=$('#g_product')?.value; const g=gid?giftById(gid):null; if(!g)return toast('Pick a gift card',1);
  const amt=+$('#g_amt').value; if(!(amt>0))return toast('Enter the amount / balance received',1);
  const date=$('#g_date').value||todayStr(), note=$('#g_note').value.trim();
  const splits=giftBuySplits.filter(s=>+s.amount>0);
  if(splits.some(s=>s.method==='card' && !s.cardId))return toast('Pick a card for each card payment',1);
  if(splits.some(s=>payMethodInfo(s.method).savedGift && !s.giftId))return toast('Pick a gift card for each gift-card payment',1);
  if(splits.some(s=>s.method==='cardborrow' && !s.lenderId))return toast('Pick a lender for each borrowed-card payment',1);
  if(splits.some(s=>s.method==='cardborrow' && !s.lenderCardId))return toast('Pick which card for each borrowed-card payment',1);
  const missRef=splits.find(s=>{ const info=payMethodInfo(s.method); if(s.method==='cardborrow')return false; if(info.ref!=='mandatory')return false; return info.savedGift?!s.giftId:(info.savedCard?!s.cardId:!(s.ref||'').trim()); });
  if(missRef){ const info=payMethodInfo(missRef.method); return toast(`${info.label}: ${info.refLabel.replace(/ \((required|optional)\)/,'')} is required`,1); }
  const paid=splits.reduce((a,s)=>a+(+s.amount||0),0);
  if(paid>amt+0.01)return toast(`Payment ${money(paid)} exceeds the balance loaded ${money(amt)} — overpayment isn't allowed.`,1);
  const cardReq={}; splits.forEach(s=>{ if(s.method==='card'&&s.cardId)cardReq[s.cardId]=(cardReq[s.cardId]||0)+(+s.amount||0); });
  for(const cid in cardReq){ const c=cardById(cid); if(c){ const over=cardReq[cid]-cardAvailable(c);
    if(over>1e-6 && !cardAllowsNeg(c))return toast(`${c.name}: only ${money(Math.max(0,cardAvailable(c)))} available — reduce the amount or enable over-limit for it.`,1); } }
  const giftReq={}; splits.forEach(s=>{ if(payMethodInfo(s.method).savedGift&&s.giftId)giftReq[s.giftId]=(giftReq[s.giftId]||0)+(+s.amount||0); });
  for(const g2 in giftReq){ const gg=giftById(g2); if(gg){ const av=giftBalance(gg); if(giftReq[g2]-av>1e-6)return toast(`${gg.name}: only ${money(Math.max(0,av))} left on this gift card — reduce the amount.`,1); } }
  // load the balance onto the chosen gift-card product
  if(!Array.isArray(g.txns))g.txns=[];
  g.txns.push({id:uid(),date,type:'load',amount:amt,note:'Recharge'+(note?' · '+note:''),byId:session.id});
  const payLink='gift:'+g.id, cashLink=g.id, lbl=g.name;
  const charged=[];
  splits.forEach(s=>{ const a=+s.amount||0; if(a<=0)return; const info=payMethodInfo(s.method);
    if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId); if(c){ chargeCard(c,a,date,'Gift card · '+lbl,payLink); charged.push(c.name); } }
    else if(info.savedGift&&s.giftId){ const gp=giftById(s.giftId); if(gp){ spendGift(gp,a,date,'Gift card · '+lbl,payLink); charged.push(gp.name); } }
    else if(s.method==='cardborrow'&&s.lenderId){ postLenderSwipe(s.lenderId,s.lenderCardId,a,s.commission,date,'Gift card · '+lbl,''); const l=lenderById(s.lenderId); charged.push('borrowed'+(l?' · '+l.name:'')); }
    else if(s.method==='cash'){ const ded=+s.deductPct||0, net=a*(1-ded/100); if(!Array.isArray(DB.cash))DB.cash=[];
      DB.cash.push({id:uid(),date,dir:'out',amount:net,cat:'giftbuy',desc:'Gift card · '+lbl+(ded>0?` · ${ded}% cash disc.`:''),who:session.id,byId:session.id,linkId:cashLink}); charged.push('cash'); }
    /* points / other methods settle the amount but don't move the wallet */ });
  logAct('edit','gift card',lbl,`recharged ${money(amt)}`);
  save(); closeModal(); if($('.nav-item.active')?.dataset.view==='giftcards')renderGiftCards(); renderBell();
  toast('Gift card recharged · '+money(amt)+' loaded');
}

let _gtBase=0,_gtSign=1;
function gtCalcAfter(){ const el=$('#gt_after'); if(!el)return; const amt=+($('#gt_amt')?.value)||0; const after=_gtBase+_gtSign*amt;
  el.textContent=money(after); el.style.color=after<-0.005?'var(--red)':'var(--green)';
  const w=$('#gt_warn'); if(w)w.style.display=(after<-0.005&&_gtSign<0)?'block':'none'; }
function giftTxnModal(id,type,txnId){

  const bal=giftBalance(g); const sign = type==='spend' ? -1 : 1;
  const base = edit ? (bal - sign*(+edit.amount||0)) : bal;
  _gtBase=base; _gtSign=sign;
  const titles={load:'Top-up Gift Card',spend:'Use / Spend Gift Card'};
  const hints={load:'Add funds to this gift card (a reload at the store).',spend:'Record a spend that used this gift card — deducts from the balance.'};

      <div class="totrow" style="font-weight:800"><span>After this ${type==='spend'?'spend':'top-up'}</span><span id="gt_after" style="color:var(--green)">${money(base+sign*(edit?(+edit.amount||0):0))}</span></div>
      <div id="gt_warn" style="display:none;color:var(--red);font-size:12px;margin-top:6px">⚠ This would take the balance below zero.</div>

      <div class="field"><label>Amount (${S().currency}) *</label><input id="gt_amt" type="number" min="0" step="any" placeholder="0.00" value="${edit?(+edit.amount||0):''}" oninput="gtCalcAfter()"></div>
      <div class="field"><label>Date</label><input id="gt_date" type="date" value="${edit?esc(edit.date||todayStr()):todayStr()}"></div>
    </div>
    <div class="field"><label>Note (optional)</label><input id="gt_note" placeholder="e.g. store / receipt no." value="${edit?esc(edit.note||''):''}"></div>`,
    `<button class="btn-sm btn-ghost" onclick="giftDetail('${id}')">Back</button>
     <button class="btn-sm" onclick="saveGiftTxn('${id}','${type}'${edit?`,'${txnId}'`:''})">${edit?'Update':'Save'}</button>`);
  setTimeout(()=>{$('#gt_amt')?.focus();gtCalcAfter();},30);
}
function saveGiftTxn(id,type,txnId){
  if(!requireOnline())return;
  const g=giftById(id); if(!g)return; const amt=+$('#gt_amt').value; if(!(amt>0))return toast('Enter a valid amount',1);

  const date=$('#gt_date').value||todayStr(), note=$('#gt_note').value.trim();
  if(type==='spend'){ const avail=giftBalance(g)+(txnId?((g.txns.find(t=>t.id===txnId)||{}).amount||0):0);
    if(amt>avail+1e-6)return toast(`Only ${money(Math.max(0,avail))} left on this gift card`,1); }
  if(txnId){ const t=(g.txns||[]).find(x=>x.id===txnId); if(!t)return toast('Entry not found',1);
    if(t.srcPurchaseId||t.srcSaleId)return toast('This entry comes from a purchase/sale — edit it there',1);
    t.amount=amt; t.date=date; t.note=note; logAct('edit','gift entry',g.name,`${txnLabel(type)} ${money(amt)}`); save(); toast('Entry updated'); }

function delGift(id){

  },'Delete');

function totalBought(pid){ let q=0; DB.purchases.forEach(p=>purchaseItems(p).forEach(it=>{if(it.productId===pid)q+=+it.qty||0;})); return q; }
function totalSold(pid){ let q=0; DB.sales.forEach(s=>s.items.forEach(it=>{if(it.productId===pid)q+=+it.qty||0;})); return q; }
function lastBuyDate(pid){ let d=''; DB.purchases.forEach(p=>{ if((p.date||'')>d && purchaseItems(p).some(it=>it.productId===pid))d=p.date; }); return d; }
/* ranking key for "most recently purchased first" — the newest purchase that
   includes this product, as "date|id". Fixed-width date compares first, then the
   record id (uid() is Date.now()-based, so it encodes entry time), so products
   bought on the same day rank by when the purchase was actually entered — the one
   you just bought floats to the top instead of tying alphabetically. Never-bought
   products return '' and sort last. */
function lastBuyKey(pid){ let k=''; DB.purchases.forEach(p=>{ if(purchaseItems(p).some(it=>it.productId===pid)){ const key=(p.date||'')+'|'+(p.id||''); if(key>k)k=key; } }); return k; }
let _invSort='recent', _invShowCat=false;
function setInvSort(v){ _invSort=v; renderInventory(); }
function toggleInvCat(){ _invShowCat=!_invShowCat; renderInventory(); }

/* =========================================================
   STOCK CHECK — a temporary count sheet.
   Tick each item as you physically verify it, optionally type the
   counted quantity; mismatches vs system stock are flagged live.
   State lives ONLY in the browser (localStorage) so a reload won't
   lose a half-done count. It NEVER changes real inventory data.
   ========================================================= */
const SC_KEY='la_stockcheck_v1';
let _invCheckMode=false, _scOnlyUnchecked=false, _scQty={};
let _scState=(function(){ try{return JSON.parse(localStorage.getItem(SC_KEY))||{};}catch(e){return {};} })();
function scSave(){ try{localStorage.setItem(SC_KEY,JSON.stringify(_scState));}catch(e){} }
function toggleInvCheck(){ _invCheckMode=!_invCheckMode; if(!_invCheckMode)_scOnlyUnchecked=false; renderInventory(); }
function scToggleUnchecked(){ _scOnlyUnchecked=!_scOnlyUnchecked; renderInventory(); }
function scClearAll(){ confirmBox('Clear stock check?','This clears every tick &amp; count on this check sheet. Your real inventory is <b>not</b> changed.',()=>{ _scState={}; scSave(); renderInventory(); toast('Stock check cleared'); },'Clear sheet'); }
function scDiffHtml(counted,sys){ if(counted==='') return '<span style="color:var(--muted2)">—</span>';
  const d=Number(counted)-sys; return d===0?'<span class="tag ok">match</span>':`<span class="tag low">${d>0?'+':'−'}${num(Math.abs(d))}</span>`; }
function scTick(pid,on){ const st=_scState[pid]||(_scState[pid]={}); st.checked=on; scSave();
  const tr=document.getElementById('scr_'+pid); if(tr)tr.classList.toggle('sc-done',on); scUpdateProgress(); }
function scCount(pid,val){ const st=_scState[pid]||(_scState[pid]={}); const empty=(val==null||val==='');
  if(empty) delete st.counted; else { st.counted=val; st.checked=true; } scSave();
  const cell=document.getElementById('scd_'+pid); if(cell) cell.innerHTML=scDiffHtml(empty?'':val,_scQty[pid]||0);
  const tr=document.getElementById('scr_'+pid); if(tr){ tr.classList.toggle('sc-done',!!st.checked); const c=tr.querySelector('.sc-chk'); if(c)c.checked=!!st.checked; }
  scUpdateProgress(); }
function scUpdateProgress(){ const ids=Object.keys(_scQty); let checked=0,counted=0,mismatch=0;
  ids.forEach(pid=>{ const st=_scState[pid]; if(!st)return; if(st.checked)checked++;
    const cv=st.counted; if(cv===0||cv){ counted++; if(Number(cv)!==(_scQty[pid]||0))mismatch++; } });
  const el=$('#scProg'); if(el) el.innerHTML=`<b>${checked}</b> / ${ids.length} ticked · <b>${counted}</b> counted · <span style="color:${mismatch?'var(--red)':'var(--green)'};font-weight:700">${mismatch} mismatch${mismatch===1?'':'es'}</span>`; }
function scRow(x){ const st=_scState[x.p.id]||{}; const checked=!!st.checked;
  const cv=(st.counted===0||st.counted)?String(st.counted):'';
  return `<tr id="scr_${x.p.id}" class="${checked?'sc-done':''}">
    <td><input type="checkbox" class="sc-chk" ${checked?'checked':''} onchange="scTick('${x.p.id}',this.checked)" title="Tick when checked"></td>
    <td><div class="prodcell">${productThumbEdit(x.p)}<b style="color:${prodNameColor(x.p)}">${esc(x.p.name)}</b></div></td>
    <td class="num"><b>${num(x.qty)}</b> ${esc(x.p.unit||'')}</td>
    <td class="num"><input type="number" inputmode="decimal" class="sc-count" value="${esc(cv)}" placeholder="count" oninput="scCount('${x.p.id}',this.value)"></td>
    <td class="num" id="scd_${x.p.id}">${scDiffHtml(cv,x.qty)}</td>
  </tr>`; }
function renderStockCheck(data,host){
  _scQty={}; data.forEach(x=>_scQty[x.p.id]=x.qty);
  let rows=[...data].sort((a,b)=>a.p.name.localeCompare(b.p.name));
  if(_scOnlyUnchecked) rows=rows.filter(x=>!(_scState[x.p.id]&&_scState[x.p.id].checked));
  const head=`<thead><tr><th>✓</th><th>Product</th><th class="num">System</th><th class="num">Counted</th><th class="num">Diff</th></tr></thead>`;
  host.innerHTML=`
    <div class="panel" style="padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <div><div class="cat-head" style="margin:0 0 4px">✅ Stock check <span class="cc">temporary · not saved to inventory</span></div><div id="scProg" class="li-hint"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="mini-btn ${_scOnlyUnchecked?'gold':''}" onclick="scToggleUnchecked()">${_scOnlyUnchecked?'● Only unchecked':'Only unchecked'}</button>
        <button class="mini-btn red" onclick="scClearAll()">Clear sheet</button>
      </div>
    </div>
    ${rows.length?`<div class="table-wrap"><table class="sc-grid">${head}<tbody>${rows.map(scRow).join('')}</tbody></table></div>`
      :`<div class="panel">${emptyBox('✅','All ticked','Every shown item is checked. Turn off "Only unchecked" to see them all.')}</div>`}`;
  scUpdateProgress();
}
/* category-wise totals (pieces + value) for in-stock items, with a grand total row */
function invCatTotalsHtml(catAgg,totUnits,totVal){
  const cats=Object.keys(catAgg).sort((a,b)=>a==='Uncategorised'?1:b==='Uncategorised'?-1:a.localeCompare(b));
  if(!cats.length)return `<div class="panel" style="margin-bottom:14px;padding:12px 14px"><div class="li-hint">No in-stock items to total.</div></div>`;
  const rows=cats.map(c=>{const a=catAgg[c];return `<tr><td>📂 ${esc(c)}</td><td class="num">${a.items}</td><td class="num"><b>${num(a.pcs)}</b></td><td class="num">${money(a.val)}</td></tr>`;}).join('');
  const totItems=cats.reduce((s,c)=>s+catAgg[c].items,0);

/* ========= AUTO PRODUCT IMAGE (click a thumbnail → find & set) =========
   Free by default via Wikipedia (no API key). If a Google Programmable
   Search key + engine id are set in Settings, those results are added too. */
/* hover-to-zoom: pop a large floating preview when the mouse is over any product photo
   (only real photos have an <img>; icon tiles are SVG, so they never trigger it) */
function initImgZoom(){
  if(window._imgZoomInit)return; window._imgZoomInit=1;
  if(!window.matchMedia||!window.matchMedia('(hover:hover)').matches)return; // skip on touch devices
  const z=document.createElement('div'); z.id='imgZoom'; z.innerHTML='<img alt="">'; document.body.appendChild(z);
  const zi=z.querySelector('img');
  const show=img=>{ const src=img.currentSrc||img.src; if(!src)return; zi.src=src;
    const r=img.getBoundingClientRect(), W=250,H=250,gap=14;
    let left=r.right+gap; if(left+W>innerWidth-8)left=r.left-gap-W; left=Math.max(8,Math.min(left,innerWidth-W-8));
    let top=r.top+r.height/2-H/2; top=Math.max(8,Math.min(top,innerHeight-H-8));
    z.style.left=left+'px'; z.style.top=top+'px'; z.classList.add('on'); };
  const hide=()=>z.classList.remove('on');
  document.addEventListener('mouseover',e=>{ const img=e.target.closest&&e.target.closest('.thumb img'); if(img)show(img); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest&&e.target.closest('.thumb img'))hide(); });
  addEventListener('scroll',hide,true);
}
let _imgCands=[];
async function fetchImageCandidates(name){
  const out=[], q=(name||'').trim(); if(!q)return out; const st=S();
  // 1) Google Custom Search image results (optional — better coverage)
  if(st.imgApiKey && st.imgCseId){
    try{ const r=await fetch(`https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(st.imgApiKey)}&cx=${encodeURIComponent(st.imgCseId)}&searchType=image&num=8&safe=active&q=${encodeURIComponent(q)}`);
      if(r.ok){ const d=await r.json(); (d.items||[]).forEach(it=>{ const full=it.link, thumb=(it.image&&it.image.thumbnailLink)||it.link; if(full)out.push({thumb,full}); }); } }catch(e){}
  }
  // 2) Wikipedia (keyless, CORS-friendly) — try full name, then a trimmed name
  const tries=[q]; const short=q.split(/[–—\-,(]/)[0].trim(); if(short && short!==q)tries.push(short);
  for(const t of tries){
    try{ const r=await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(t)}&limit=6`);
      if(r.ok){ const d=await r.json(); (d.pages||[]).forEach(p=>{ if(p.thumbnail&&p.thumbnail.url){ const big=('https:'+p.thumbnail.url).replace(/\/\d+px-/,'/320px-'); out.push({thumb:big,full:big}); } }); }
    }catch(e){}
    if(out.length)break;
  }
  const seen=new Set(); return out.filter(c=>{ if(seen.has(c.full))return false; seen.add(c.full); return true; });
}

/* fetch a remote image and shrink it to a small self-contained thumbnail (JPEG data URI)
   so the stored image doesn't depend on the source staying online / allowing hotlinks */
async function urlToThumb(url,max){ max=max||400;
  const blob=await (await fetch(url,{mode:'cors'})).blob();
  if(!/^image\//.test(blob.type))throw new Error('not an image');
  const o=URL.createObjectURL(blob);
  try{ const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=o; });
    const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc)||1; c.height=Math.round(im.naturalHeight*sc)||1;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.82);
  } finally { URL.revokeObjectURL(o); }
}

  const data=DB.products.map(p=>{const qty=stockOf(p.id,eng),avg=avgCostOf(p.id,eng);const val=(qty>0?qty:0)*avg;
    if(qty>0){totUnits+=qty;totVal+=val; const cat=(p.category||'').trim()||'Uncategorised'; const a=catAgg[cat]||(catAgg[cat]={items:0,pcs:0,val:0}); a.items++; a.pcs+=qty; a.val+=val;}
    if(qty<=0)out++; else if(qty<=S().lowStockLevel)low++;
    return {p,qty,avg,val,bought:totalBought(p.id),sold:totalSold(p.id),last:lastBuyDate(p.id)};})
    .filter(x=>x.p.name.toLowerCase().includes(q)||(x.p.category||'').toLowerCase().includes(q));
  const cc=$('#invCards'); if(cc)cc.innerHTML=`
    <div class="stat"><span class="ic">📦</span><div class="label">Inventory Value</div><div class="val">${money(totVal)}</div><div class="foot">${num(totUnits)} units</div></div>
    <div class="stat"><span class="ic">🔢</span><div class="label">Total Pieces</div><div class="val">${num(totUnits)}</div><div class="foot">all in-stock items</div></div>
    <div class="stat gold"><span class="ic">🏷️</span><div class="label">Products</div><div class="val">${DB.products.length}</div></div>
    <div class="stat red"><span class="ic">⚠️</span><div class="label">Low Stock</div><div class="val">${low}</div><div class="foot">≤ ${S().lowStockLevel} units</div></div>
    <div class="stat"><span class="ic">🚫</span><div class="label">Out of Stock</div><div class="val">${out}</div></div>`;
  const scBtn=$('#scToggleBtn'); if(scBtn){ scBtn.textContent=_invCheckMode?'✕ Exit Stock Check':'✓ Stock Check'; scBtn.classList.toggle('btn-gold',!_invCheckMode); scBtn.classList.toggle('btn-red',_invCheckMode); }
  const ct=$('#invCatTotals'); if(ct)ct.innerHTML=(_invShowCat&&!_invCheckMode)?invCatTotalsHtml(catAgg,totUnits,totVal):'';
  const host=$('#invList'); if(!host)return;
  if(!DB.products.length){host.innerHTML=`<div class="panel">${emptyBox('📦','No inventory','Add products & purchases to see stock.')}</div>`;return;}
  if(!data.length){host.innerHTML=`<div class="panel">${emptyBox('🔎','No matches','No products match your search.')}</div>`;return;}
  if(_invCheckMode){ renderStockCheck(data,host); return; }
  /* in-stock items shown normally; zero-inventory items grouped separately at the bottom (dimmed, like inactive cards) */
  const inStock=data.filter(x=>x.qty>0), zero=data.filter(x=>x.qty<=0);
  const zeroSection=()=>{ if(!zero.length)return ''; const z=[...zero].sort((a,b)=>a.p.name.localeCompare(b.p.name));
    return `<div class="cat-head" style="margin-top:22px">⚪ Out of stock <span class="cc" style="color:var(--muted)">${z.length} item${z.length===1?'':'s'}</span> <span class="cc">zero inventory</span></div>
      <div class="table-wrap inv-zero"><table>${INV_HEAD}<tbody>${z.map(invRow).join('')}</tbody></table></div>`; };
  if(_invSort==='category'){
    const groups={}; inStock.forEach(x=>{ const cat=(x.p.category||'').trim()||'Uncategorised'; (groups[cat]||(groups[cat]=[])).push(x); });
    const cats=Object.keys(groups).sort((a,b)=>a==='Uncategorised'?1:b==='Uncategorised'?-1:a.localeCompare(b));
    host.innerHTML=cats.map(cat=>{ const g=groups[cat]; const gVal=g.reduce((a,x)=>a+(x.val>0?x.val:0),0), gU=g.reduce((a,x)=>a+(x.qty>0?x.qty:0),0);
      return `<div class="cat-head">📂 ${esc(cat)} <span class="cc">${g.length} item${g.length===1?'':'s'}</span> <span class="cc">${num(gU)} units</span> <span class="cc">${money(gVal)}</span></div>
      <div class="table-wrap"><table>${INV_HEAD}<tbody>${g.map(invRow).join('')}</tbody></table></div>`; }).join('')+zeroSection();
    return;
  }
  const sorters={ recent:(a,b)=>(b.last||'').localeCompare(a.last||''), stockHigh:(a,b)=>b.qty-a.qty, stockLow:(a,b)=>a.qty-b.qty, sold:(a,b)=>b.sold-a.sold, name:(a,b)=>a.p.name.localeCompare(b.p.name) };
  const sorted=[...inStock].sort(sorters[_invSort]||sorters.recent);
  host.innerHTML=(sorted.length?`<div class="table-wrap"><table>${INV_HEAD}<tbody>${sorted.map(invRow).join('')}</tbody></table></div>`:'')+zeroSection();
}

/* =========================================================
   CASH BOOK (daily cash balance ledger)
   Auto: sales cash in, purchase cash out, card recharge/payment paid from cash out.
   Manual: opening balance, expenses (with who + purpose), other cash in/out.
   ========================================================= */
function userName(id){ const u=(DB.users||[]).find(x=>x.id===id); return u?u.name:'Unassigned'; }
/* full ledger of wallet movements, each attributed to a person (who = userId) */
function cashEntries(){
  const e=[];
  (DB.cash||[]).forEach(m=>e.push({id:m.id,date:m.date||'',dir:m.dir,amount:+m.amount||0,cat:m.cat||'manual',desc:m.desc||'',who:m.who||'',recBy:m.byId||'',linkId:m.linkId||'',manual:true}));
  (DB.sales||[]).forEach(s=>(s.payments||[]).forEach(pm=>{ const net=pmCashNet(pm); if(pm.method==='cash'&&net>0) e.push({date:pm.date||s.date,dir:'in',amount:net,cat:'sale',desc:'Sale '+(s.invoiceNo||'')+(s.customer?' · '+s.customer:'')+(+pm.deductPct>0?` · ${(+pm.deductPct)}% cash disc.`:''),who:s.collectedBy||s.byId||''}); }));
  (DB.purchases||[]).forEach(p=>(p.payments||[]).forEach(pm=>{ const net=pmCashNet(pm); if(pm.method==='cash'&&net>0) e.push({date:pm.date||p.date,dir:'out',amount:net,cat:'purchase',desc:'Purchase '+(p.ref||'')+(p.supplier?' · '+p.supplier:'')+(+pm.deductPct>0?` · ${(+pm.deductPct)}% cash disc.`:''),who:p.byId||''}); }));
  /* online-order cash prepayments: counted only while the order is live (ordered/shipped).
     Once delivered it becomes a real purchase (counted above); once cancelled the cash reverts by being dropped here. */
  (DB.online||[]).forEach(o=>{ if(o.status==='delivered'||o.status==='cancelled'||o.status==='returned')return; const pm=onlPayObj(o); const net=pmCashNet(pm); if(pm&&pm.method==='cash'&&net>0) e.push({date:pm.date||o.orderDate,dir:'out',amount:net,cat:'purchase',desc:'Online order '+(o.ref||'')+(o.platform?' · '+o.platform:'')+(+pm.deductPct>0?` · ${(+pm.deductPct)}% cash disc.`:''),who:o.byId||''}); });
  (DB.cards||[]).forEach(c=>(c.txns||[]).forEach(t=>{ if(t.fromCash&&(t.type==='recharge'||t.type==='payment'||t.type==='deposit')&&(+t.amount)>0) e.push({date:t.date,dir:'out',amount:+t.amount,cat:'card',desc:(t.type==='recharge'?'Card recharge · ':t.type==='deposit'?'Card deposit · ':'Card payment · ')+c.name,who:t.byId||''}); }));
  e.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  return e;
}
function walletBalance(pid){ return cashEntries().filter(x=>x.who===pid).reduce((a,x)=>a+(x.dir==='in'?x.amount:-x.amount),0); }
function cashBalance(){ return cashEntries().reduce((a,x)=>a+(x.dir==='in'?x.amount:-x.amount),0); }
const CASH_TAG={sale:'ok',purchase:'card',card:'partial',giftbuy:'gift',expense:'due',opening:'bank',adjust:'adjust',cashin:'ok',cashout:'due',transfer:'split',manual:'bank'};
let _walletSel='';

  const showWho = !person; // show wallet column in All view

    <tbody>${rows.map(x=>`<tr>
      <td>${fmtDate(x.date)}</td>
      <td><span class="tag ${CASH_TAG[x.cat]||'bank'}">${(x.cat||'').toUpperCase()}</span></td>
      ${showWho?`<td>${esc(userName(x.who))}</td>`:''}
      <td style="white-space:normal">${esc(x.desc||'')}</td>
      <td>${x.recBy?esc(userName(x.recBy)):'<span style="color:var(--muted2)">—</span>'}</td>
      <td class="num" style="color:var(--green)">${x.dir==='in'?money(x.amount):''}</td>
      <td class="num" style="color:var(--red)">${x.dir==='out'?money(x.amount):''}</td>
      <td class="num"><b>${money(x.run)}</b></td>
      <td class="num">${x.manual?(isOwner()?`<button class="mini-btn red" title="Delete entry" onclick="delCashEntry('${x.id}')">✕</button>`:'<span style="color:var(--muted2);font-size:11px">—</span>'):'<span style="color:var(--muted2);font-size:11px">auto</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function whoSelectField(sel,label){ label=label||'Whose wallet';
  if(isOwner()) return `<div class="field"><label>${label} *</label><select id="cb_who">${DB.users.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)}${u.id===session.id?' (you)':''}</option>`).join('')}</select></div>`;

function delCashEntry(id){ if(!requireOnline())return; if(!isOwner())return toast('Only admin can delete cash entries',1); const ent=(DB.cash||[]).find(e=>e.id===id); const link=ent&&ent.linkId;
  confirmBox('Delete cash entry?', link?'This is a transfer — both sides will be removed. Continue?':'This removes the entry and recalculates the wallet.',()=>{
    if(ent)logAct('delete','cash entry',ent.desc||ent.cat||'entry',`${ent.dir==='in'?'+':'−'}${money(ent.amount)}${ent.who?' · '+userName(ent.who):''}`);
    DB.cash=(DB.cash||[]).filter(e=> link? e.linkId!==link : e.id!==id); save(); renderCash(); toast('Entry deleted'); },'Delete'); }

function compPrices(p){ return p.compPrices||[]; }
function bestComp(p){ const cp=compPrices(p).filter(c=>+c.price>0); if(!cp.length)return null; return cp.reduce((a,b)=>(+b.price<+a.price?b:a)); }
function allStores(){ const a=[]; DB.products.forEach(p=>compPrices(p).forEach(c=>{ if(c.store)a.push(c.store); })); return uniqSorted(a); }
function compareOnline(pid){ const p=productById(pid); if(!p)return; const url='https://www.google.com/search?tbm=shop&q='+encodeURIComponent(p.name+' price UAE'); const w=window.open(url,'_blank'); if(!w)toast('Allow pop-ups to open the online search',1); }
views.compare=function(){
  return `
  <div class="page-head"><div><h2>Price Compare</h2><p>Track competitor prices & mall offers per product across Abu Dhabi, Dubai & Sharjah — and search online in one click.</p></div></div>
  <div class="note" style="margin-bottom:14px">🔎 <b>Online search</b> opens a live Google Shopping search in a new tab. Competitor prices below are the ones <b>you log</b> — they build your own reliable comparison history over time.</div>
  <div class="toolbar"><div class="search"><span class="si">🔎</span><input id="cmpSearch" placeholder="Search product..." oninput="renderCompare()"></div></div>
  <div id="cmpList"></div>`;
};
views._after_compare=renderCompare;
function renderCompare(){

    <tbody>${list.map(p=>{const avg=avgCostOf(p.id,eng),best=bestComp(p);return `<tr>
      <td><div class="prodcell">${productThumbEdit(p)}<span>${esc(p.name)}</span></div></td>
      <td class="num">${money(avg)}</td>
      <td class="num">${best?`<b style="color:${+best.price<avg?'var(--green)':'var(--text)'}">${money(best.price)}</b>`:'—'}</td>

        <button class="mini-btn" onclick="compareOnline('${p.id}')">🔎 Online</button></td></tr>`}).join('')}
    </tbody></table></div>`;

function compareDetail(pid){

        <div class="field"><label>Store / Mall</label><input id="cp_store" list="dl_store" placeholder="e.g. Carrefour, Sharaf DG">${dataList('dl_store',allStores())}</div>
        <div class="field"><label>Emirate</label><select id="cp_emirate">${['Abu Dhabi','Dubai','Sharjah','Ajman','Ras Al Khaimah','Other'].map(e=>`<option>${e}</option>`).join('')}</select></div>

        <div class="field"><label>Offer / Discount</label><input id="cp_offer" placeholder="e.g. 10% off, BOGO"></div>
        <div class="field"><label>Date</label><input id="cp_date" type="date" value="${todayStr()}"></div>

    `<button class="btn-sm" onclick="closeModal()">Close</button>`);

function saveCompPrice(pid){ if(!requireOnline())return;
  const p=productById(pid); if(!p)return; const price=+$('#cp_price').value; if(!(price>0))return toast('Enter a valid price',1);
  if(!p.compPrices)p.compPrices=[];
  p.compPrices.push({id:uid(),store:$('#cp_store').value.trim(),emirate:$('#cp_emirate').value,price,offer:$('#cp_offer').value.trim(),date:$('#cp_date').value||todayStr()});
  save(); toast('Competitor price logged'); compareDetail(pid); if($('.nav-item.active')?.dataset.view==='compare')renderCompare();
}
function delCompPrice(pid,cid){ const p=productById(pid); if(!p)return;
  p.compPrices=(p.compPrices||[]).filter(c=>c.id!==cid); save(); compareDetail(pid); if($('.nav-item.active')?.dataset.view==='compare')renderCompare(); }

views.profit=function(){
  if(!isOwner())return `<div class="owner-lock"><div class="big">🔒</div><h2>Owner access only</h2><p>Profit & financial reports are restricted to the owner account.</p></div>`;
  return `

    <div class="row-actions">
      <input id="rpFrom" type="date" class="mini-btn" style="padding:9px" oninput="renderProfit()">
      <input id="rpTo" type="date" class="mini-btn" style="padding:9px" oninput="renderProfit()">
      <button class="btn-sm btn-ghost" onclick="clearRange()">Clear</button>
      <button class="btn-sm btn-green" onclick="exportProfitExcel()">⬇ Excel</button>
      <button class="btn-sm btn-ghost" onclick="exportCardPrefExcel()" title="Export the card-preference ranking (holder & bank in separate columns)">⭐ Card Pref · Excel</button>

views._after_profit=()=>{ if(isOwner())renderProfit(); };
function clearRange(){$('#rpFrom').value='';$('#rpTo').value='';renderProfit();}
function renderProfit(){
  const eng=computeEngine();
  const from=$('#rpFrom')?.value, to=$('#rpTo')?.value;
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const sales=DB.sales.filter(s=>inRange(s.date));
  const purch=DB.purchases.filter(p=>inRange(p.date));
  let rev=0,netRev=0,cogs=0,vat=0,disc=0,cashS=0,cardS=0;
  sales.forEach(s=>{rev+=s.total;netRev+=netOf(s);cogs+=eng.saleCost[s.id]||0;vat+=s.vat||0;disc+=s.discount||0;s.payment==='card'?cardS+=s.total:cashS+=s.total;});
  const buyTot=purch.reduce((a,p)=>a+purchaseTotal(p),0);
  let cashB=0,cardB=0;purch.forEach(p=>(p.payments||[]).forEach(pm=>pm.method==='card'?cardB+=pm.amount:cashB+=pm.amount));
  const profit=netRev-cogs; const margin=netRev>0?(profit/netRev*100):0;
  const byProd={};
  sales.forEach(s=>s.items.forEach(it=>{const p=productById(it.productId); if(!p)return; const avg=avgCostOf(it.productId,eng);
    const pr=byProd[it.productId]||(byProd[it.productId]={name:p.name,qty:0,rev:0,profit:0});
    pr.qty+=it.qty; pr.rev+=it.qty*it.rate; pr.profit+=it.qty*(it.rate-avg);}));
  const top=Object.values(byProd).sort((a,b)=>b.profit-a.profit).slice(0,8);
  /* daily report — date-wise sales/purchases split by cash & card */
  const daily={}; const D=d=>daily[d]||(daily[d]={sales:0,purch:0,cashS:0,cardS:0,cashP:0,cardP:0});
  sales.forEach(s=>{ D(s.date).sales+=s.total; });
  purch.forEach(p=>{ D(p.date).purch+=purchaseTotal(p); });
  DB.sales.forEach(s=>(s.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardS+=pm.amount; else if(pm.method==='cash')r.cashS+=pm.amount; }));
  DB.purchases.forEach(p=>(p.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardP+=pm.amount; else if(pm.method==='cash')r.cashP+=pm.amount; }));
  const days=Object.keys(daily).sort((a,b)=>a<b?1:-1);
  const dailyHtml=days.length?`<div class="table-wrap"><table style="min-width:760px">
    <thead><tr><th>Date</th><th class="num">Sales</th><th class="num">Cash Sales</th><th class="num">Card Sales</th><th class="num">Purchases</th><th class="num">Cash Purch.</th><th class="num">Card Purch.</th></tr></thead>
    <tbody>${days.map(d=>{const r=daily[d];return `<tr><td><b>${fmtDate(d)}</b></td>
      <td class="num">${money(r.sales)}</td><td class="num" style="color:var(--green)">${money(r.cashS)}</td><td class="num" style="color:var(--brand2)">${money(r.cardS)}</td>
      <td class="num">${money(r.purch)}</td><td class="num" style="color:var(--green)">${money(r.cashP)}</td><td class="num" style="color:var(--brand2)">${money(r.cardP)}</td></tr>`;}).join('')}</tbody></table></div>`
    :emptyBox('📅','No activity','No sales or purchases in this period.');
  $('#profitBody').innerHTML=`
  <div class="cards">
    <div class="stat gold"><span class="ic">🧾</span><div class="label">Net Sales (excl VAT)</div><div class="val">${money(netRev)}</div><div class="foot">${sales.length} sale(s) · gross ${money(rev)}</div></div>
    <div class="stat blue"><span class="ic">📦</span><div class="label">Cost of Goods Sold</div><div class="val">${money(cogs)}</div></div>
    <div class="stat green"><span class="ic">💰</span><div class="label">Gross Profit</div><div class="val">${money(profit)}</div><div class="foot">${margin.toFixed(1)}% margin</div></div>
    <div class="stat"><span class="ic">🧮</span><div class="label">VAT Collected</div><div class="val">${money(vat)}</div><div class="foot">Discounts given ${money(disc)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Cash vs Card</h3><p class="psub">In the selected period</p>
      <div class="table-wrap"><table><thead><tr><th>Channel</th><th class="num">Sales</th><th class="num">Purchases</th></tr></thead>
      <tbody>
        <tr><td><span class="tag cash">CASH</span></td><td class="num">${money(cashS)}</td><td class="num">${money(cashB)}</td></tr>
        <tr><td><span class="tag card">CARD</span></td><td class="num">${money(cardS)}</td><td class="num">${money(cardB)}</td></tr>
        <tr><td><b>Total</b></td><td class="num"><b>${money(rev)}</b></td><td class="num"><b>${money(buyTot)}</b></td></tr>
      </tbody></table></div>
    </div>
    <div class="panel"><h3>Top Products by Profit</h3><p class="psub">Best performers</p>
      ${top.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Revenue</th><th class="num">Profit</th></tr></thead>
      <tbody>${top.map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${num(t.qty)}</td><td class="num">${money(t.rev)}</td><td class="num" style="color:${t.profit>=0?'var(--green)':'var(--red)'}">${money(t.profit)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('📈','No data','No sales in this period.')}
    </div>
  </div>
  <div class="panel"><h3>📅 Daily Report</h3><p class="psub">Date-wise sales & purchases, split by cash and card (newest first)</p>${dailyHtml}</div>`;
}

/* =========================================================
   REPORTS — Daily Summary (day-book) & Card Statement
   ========================================================= */
function fmtDayLong(d){ const p=(d||'').split('-'); if(p.length!==3)return d;
  const dt=new Date(+p[0],+p[1]-1,+p[2]); return dt.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short',year:'numeric'}); }
function dayCalChip(d){ const p=(d||'').split('-'); if(p.length!==3)return '';
  const dt=new Date(+p[0],+p[1]-1,+p[2]); const mon=dt.toLocaleDateString('en-GB',{month:'short'});
  return `<div class="rd-cal"><div class="m">${mon}</div><div class="d">${p[2]}</div></div>`; }
/* gather every day's invoices, purchases, cash & card activity + per-day and range totals */
function daybookData(inR){
  const eng=computeEngine();
  const day={}, get=d=>day[d]||(day[d]={date:d,sales:[],purch:[],cash:[],cards:[],recvC:0,recvK:0,paidC:0,paidK:0});
  DB.sales.forEach(s=>{ if(inR(s.date))get(s.date).sales.push(s);
    (s.payments||[]).forEach(pm=>{ if(inR(pm.date)){ const g=get(pm.date); if(pm.method==='card')g.recvK+=+pm.amount||0; else g.recvC+=+pm.amount||0; } }); });
  DB.purchases.forEach(p=>{ if(inR(p.date))get(p.date).purch.push(p);
    (p.payments||[]).forEach(pm=>{ if(inR(pm.date)){ const g=get(pm.date); if(pm.method==='card')g.paidK+=+pm.amount||0; else g.paidC+=+pm.amount||0; } }); });
  cashEntries().forEach(e=>{ if(e.date&&inR(e.date))get(e.date).cash.push(e); });
  (DB.cards||[]).forEach(c=>(c.txns||[]).forEach(t=>{ if(inR(t.date))get(t.date).cards.push({...t,card:c.name}); }));
  const dates=Object.keys(day).sort((a,b)=>a<b?1:-1);
  const totals={salesTotal:0,received:0,purchTotal:0,paid:0,netCash:0,profit:0,salesCount:0,purchCount:0};
  dates.forEach(d=>{ const g=day[d];
    g.salesTotal=g.sales.reduce((a,s)=>a+(+s.total||0),0);
    g.profit=g.sales.reduce((a,s)=>a+(netOf(s)-(eng.saleCost[s.id]||0)),0);
    g.purchTotal=g.purch.reduce((a,p)=>a+purchaseTotal(p),0);
    g.received=g.recvC+g.recvK; g.paid=g.paidC+g.paidK;
    g.cashIn=g.cash.filter(x=>x.dir==='in').reduce((a,x)=>a+x.amount,0);
    g.cashOut=g.cash.filter(x=>x.dir==='out').reduce((a,x)=>a+x.amount,0);
    g.netCash=g.cashIn-g.cashOut;
    g.expenses=g.cash.filter(x=>x.cat==='expense').reduce((a,x)=>a+x.amount,0);
    totals.salesTotal+=g.salesTotal; totals.received+=g.received; totals.purchTotal+=g.purchTotal; totals.paid+=g.paid;
    totals.netCash+=g.netCash; totals.profit+=g.profit; totals.salesCount+=g.sales.length; totals.purchCount+=g.purch.length; });
  return {dates,day,totals,eng};
}

    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); } else { let left=imgH,pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }

function bsLast4(c){ return c&&c.number?(c.number.replace(/\D/g,'').slice(-4)):''; }
/* one Mode cell: a tag per payment (credit-card paid shows the card name · ••last4) */
function bsModeCell(r,fallback){

  if(!pays.length){ const info=payMethodInfo(fallback||'cash'); return `<span class="tag ${info.tag}">${esc(info.label)}</span> <span class="tag split" title="Not yet paid / collected">UNPAID</span>`; }

function bsReportData(inR){
  const eng=computeEngine();
  const purch=(DB.purchases||[]).filter(p=>inR(p.date)).sort((a,b)=>a.date<b.date?1:-1);
  const sales=(DB.sales||[]).filter(s=>inR(s.date)).sort((a,b)=>a.date<b.date?1:-1);
  const pTotal=purch.reduce((a,p)=>a+purchaseTotal(p),0);
  const pPaid=purch.reduce((a,p)=>a+(+p.paid||0),0);
  const pCredit=purch.reduce((a,p)=>a+Math.max(0,purchaseTotal(p)-(+p.paid||0)),0);
  const sTotal=sales.reduce((a,s)=>a+(+s.total||0),0);
  const sRecv=sales.reduce((a,s)=>a+(+s.paid||0),0);
  const sCredit=sales.reduce((a,s)=>a+Math.max(0,(+s.total||0)-(+s.paid||0)),0);
  const profit=sales.reduce((a,s)=>a+(netOf(s)-(eng.saleCost[s.id]||0)),0);
  const qtyBought=purch.reduce((a,p)=>a+purchaseQty(p),0);
  const qtySold=sales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+(+it.qty||0),0),0);
  /* payment-mode split (unpaid balance folded in as a "__credit" pseudo-mode) */
  const agg=(records,totalFn)=>{ const modes={}; records.forEach(r=>{ (r.payments||[]).forEach(pm=>{ const k=pm.method||'cash'; modes[k]=(modes[k]||0)+(+pm.amount||0); });
    const bal=Math.max(0,totalFn(r)-(+r.paid||0)); if(bal>0.005)modes['__credit']=(modes['__credit']||0)+bal; }); return modes; };
  const pModes=agg(purch,purchaseTotal), sModes=agg(sales,s=>+s.total||0);
  /* credit-card spend via purchases, grouped by the shop's own card */
  const cs={}; purch.forEach(p=>(p.payments||[]).forEach(pm=>{ if(pm.cardId&&(+pm.amount||0)>0.005){ const c=cardById(pm.cardId);
    if(!cs[pm.cardId])cs[pm.cardId]={id:pm.cardId,card:c,name:c?c.name:'(removed card)',spend:0,count:0};

async function bsReportPdf(){
  if(!isOwner())return;
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return; }
  const from=$('#bsFrom')?.value, to=$('#bsTo')?.value;
  const html=bsReportHtml(from,to); if(!html){ toast('Nothing to export in this period',1); return; }
  toast('Preparing PDF…',0);
  const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;z-index:-1';
  holder.innerHTML=html; document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#invoiceArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); } else { let left=imgH,pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }
    const filename='buy_sell_report_'+(from||'all')+'.pdf';
    const url=URL.createObjectURL(pdf.output('blob')); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); toast('PDF ready — '+filename);
  }catch(e){ toast('Could not build the PDF',1); }
  finally{ document.body.removeChild(holder); }
}
/* ---- Card Statement report ---- */
function cardStatementPanel(c,inR,q){

  let spend=0,pay=0,redeem=0,pcount=0,maxp=0; rr.forEach(t=>{ if(t.type==='purchase'){spend+=+t.amount||0;pcount++;maxp=Math.max(maxp,+t.amount||0);} else if(t.type==='payment'||t.type==='recharge')pay+=+t.amount||0; else if(t.type==='discount')redeem+=+t.amount||0; });
  const avg=pcount?spend/pcount:0;
  /* text search over the running ledger — matches note, type label, amount or date */
  const match=t=>{ if(!q)return true; const hay=[t.note||'',txnLabel(t.type),String(+t.amount||0),money(t.amount),fmtDate(t.date),t.date||''].join(' ').toLowerCase(); return hay.includes(q); };
  const filtered=rr.filter(match);
  if(q&&!filtered.length)return '';   // hide cards with no matching rows while searching
  const disp=[...filtered].reverse();
  const ledger= disp.length? disp.map(t=>`<tr><td>${fmtDate(t.date)}</td><td><span class="tag ${t.type}">${txnLabel(t.type)}</span></td><td>${esc(t.note||'')}</td>${txnAmtCell(t)}<td class="num" style="font-weight:700">${money(t.bal)}</td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted2);padding:18px">No transactions in this period</td></tr>`;
  const k=(kk,vv,cls)=>`<div class="kk"><div class="k">${kk}</div><div class="v"${cls?` style="color:${cls}"`:''}>${vv}</div></div>`;
  return `<div class="panel">
    <div class="rep-cardhead">
      <div class="cv">${cardVisual(c)}</div>
      <div class="cvk">
        ${k('Credit Limit',money(limit))}
        ${k('Outstanding',money(out),out>0.005?'var(--amber)':'var(--green)')}
        ${k('Available',money(avail),avail<0?'var(--red)':'var(--green)')}
        ${k('Usage',Math.round(usedPct)+'%')}
        ${k('Spend · period',money(spend))}
        ${k('Payments · period',money(pay))}
        ${k('Cashback · period',money(redeem),'var(--gold2)')}
        ${k('Next due',fmtDate(isoDate(due))+' · '+(dl<=0?'today':dl+'d'), (dl<=3&&out>0.005)?'var(--red)':'')}
      </div>
    </div>

/* ---- single-card statement (payment history) → data, Excel & PDF ----
   Used by the card detail popup and by the Card Statement report's PDF button.
   Running balance mirrors cardOutstanding: purchase/oldbal add, oldpay is
   record-only (ignored), everything else is a credit that reduces what's owed. */
function cardStatementData(c,from,to){
  const all=[...(c.txns||[])].sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const signOf=t=> t.type==='oldpay'?0:((t.type==='purchase'||t.type==='oldbal')?1:-1)*(+t.amount||0);
  let opening=+c.openingOutstanding||0; const rows=[];
  all.forEach(t=>{ const d=signOf(t);
    if(from && (t.date||'')<from){ opening+=d; return; }
    if(to && (t.date||'')>to) return;
    rows.push({...t,signed:d}); });
  let run=opening; rows.forEach(r=>{ run=Math.round((run+r.signed)*100)/100; r.run=run; });
  let spend=0,pay=0,redeem=0; rows.forEach(r=>{ if(r.type==='purchase'||r.type==='oldbal')spend+=+r.amount||0; else if(r.type==='discount')redeem+=+r.amount||0; else if(r.type!=='oldpay')pay+=+r.amount||0; });
  return {opening:Math.round(opening*100)/100, rows, spend:Math.round(spend*100)/100, pay:Math.round(pay*100)/100, redeem:Math.round(redeem*100)/100, closing:Math.round(run*100)/100, limit:+c.creditLimit||0};
}

/* split a card's outstanding into three real-statement buckets, cut at the STATEMENT
   date (not the due date), so current-cycle spend is never billed early:
   • oldDue   = net charges billed on/before the previous statement (S1) — overdue;
   • curDue   = net charges in the current statement period (S1 < date ≤ S0) — the
                amount printed on the latest statement, payable by the due date;
   • unbilled = charges after the latest statement (date > S0) — not yet billed,
                they appear on the NEXT statement (they still reduce Available).
   The opening/old-statement balance is treated as a charge dated `openingDate`
   (blank ⇒ oldest, so it sits in Old Due). Payments clear oldest first.
   oldDue + curDue + unbilled = outstanding. */
function cardDueSplit(c){
  const {S0,S1}=cardStatementCuts(c);
  const s0=S0?isoDate(S0):null, s1=S1?isoDate(S1):null;
  let chgOld=0, chgCur=0, chgUnb=0, pay=0;
  const bucket=(d,amt)=>{
    if(!amt) return;
    if(s0===null){ chgUnb+=amt; }                     // no statement yet ⇒ all unbilled
    else if(d>s0){ chgUnb+=amt; }                      // after latest statement
    else if(s1!==null && d<=s1){ chgOld+=amt; }        // on/before previous statement
    else { chgCur+=amt; }                              // current statement period
  };
  bucket((c.openingDate||'0000-01-01').slice(0,10), +c.openingOutstanding||0);
  (c.txns||[]).forEach(t=>{
    if(t.type==='oldpay'||!t.date) return;
    if(t.type==='purchase'||t.type==='oldbal') bucket(t.date, +t.amount||0);
    else pay += (+t.amount||0);
  });
  let p=pay;
  const payOld=Math.min(p,chgOld); p-=payOld;
  const payCur=Math.min(p,chgCur); p-=payCur;
  const payUnb=Math.min(p,chgUnb);
  return {
    oldDue:  Math.max(0, chgOld-payOld),
    curDue:  Math.max(0, chgCur-payCur),
    unbilled:Math.max(0, chgUnb-payUnb)
  };
}

function creditSearchSort(rows,q,order){

/* build a PDF from a report area, choosing portrait if the content fits upright else landscape */
async function reportPdfFromHtml(html, areaId, filename){
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return null; }

  try{

    const {jsPDF}=window.jspdf;
    const orient = canvas.width > canvas.height ? 'l' : 'p';   // wider-than-tall ⇒ landscape, else portrait
    const pdf=new jsPDF(orient,'mm','a4');
    const img=canvas.toDataURL('image/jpeg',0.95);
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const imgH=canvas.height*pw/canvas.width;

  finally{ document.body.removeChild(holder); }
}

/* ============ Report 3 · Card Preference ============ */
function cprefRows(){
  let rows=creditReportRows().filter(r=>cardActive(r.c));
  const q=($('#cpSearch')?.value||'').trim().toLowerCase();
  if(q) rows=rows.filter(r=>[r.c.name,r.c.owner,r.c.bank,r.c.number].some(v=>(v||'').toLowerCase().includes(q)));
  // preference: cards that can still earn cashback first, then highest cashback %, then most available limit
  rows.sort((a,b)=>{
    const aEx=(a.cap>0&&a.capRem<=0.005)?1:0, bEx=(b.cap>0&&b.capRem<=0.005)?1:0;
    return (aEx-bEx) || (b.pct-a.pct) || (b.avail-a.avail);
  });
  return rows;
}
views.cprefrep=function(){
  if(!isOwner())return `<div class="owner-lock"><div class="big">🔒</div><h2>Owner access only</h2><p>Credit-card reports are restricted to the owner account.</p></div>`;

    <div class="row-actions">
      <button class="btn-sm btn-green" onclick="exportCprefExcel()">⬇ Excel</button>
      <button class="btn-sm btn-ghost" onclick="pdfCprefrep()">📄 PDF</button>
    </div></div>
  <div class="toolbar"><div class="search"><span class="si">🔎</span><input id="cpSearch" placeholder="Search card, holder or bank..." oninput="renderCprefrep()"></div></div>
  <div id="cpBody"></div>`;
};
views._after_cprefrep=()=>{ if(isOwner())renderCprefrep(); };
function renderCprefrep(){
  if(!isOwner())return;

  const tr=rows.map((r,i)=>{

      <td class="num"${r.avail<0?' style="color:var(--red)"':''}>${money(r.avail)}</td>

      <td class="num"${r.cur>0.005?'':' style="color:var(--muted2)"'}>${r.cur>0.005?money(r.cur):'—'}</td>
      <td>${fmtDate(isoDate(r.stmt))}</td>
      <td style="font-weight:700${(r.dleft<=3&&r.used>0.005)?';color:var(--red)':''}">${fmtDate(isoDate(r.due))}<div style="color:var(--muted2);font-size:11px;font-weight:400">${dueLeftTxt(r.dleft)}</div></td>
    </tr>`;

  body.innerHTML=`<div class="panel"><div class="table-wrap"><table style="min-width:1000px"><thead><tr><th>#</th><th>Card</th><th>Holder</th><th>Card No.</th><th class="num">Cashback %</th><th class="num">Available</th><th class="num">Used</th><th class="num">Old Dues</th><th class="num">New Dues</th><th>Statement</th><th>Due Date</th></tr></thead><tbody>${tr}</tbody></table></div>

}
function exportCprefExcel(){

  rows.forEach((r,i)=>out.push([i+1,r.c.name,r.c.bank||'',cardOwnerLabel(r.c),maskCard(r.c.number),r.pct||0,num2(r.avail),num2(r.used),num2(r.old),num2(r.cur),isoDate(r.stmt),isoDate(r.due),r.dleft,r.capRem===Infinity?'No cap':num2(r.capRem)]));

/* =========================================================
   EXCEL (.xlsx) EXPORTS  — SheetJS

function num2(n){ return Math.round((+n||0)*100)/100; }   // plain number cell for Excel
function exportExcel(filename, sheets){
  if(!window.XLSX){ toast('Excel engine not loaded — connect to the internet once to cache it',1); return; }
  const wb=XLSX.utils.book_new();
  (sheets||[]).forEach(sh=>{ if(!sh||!sh.rows||!sh.rows.length)return; const ws=XLSX.utils.aoa_to_sheet(sh.rows); XLSX.utils.book_append_sheet(wb, ws, (sh.name||'Sheet').replace(/[\\/?*\[\]:]/g,' ').slice(0,31)); });
  if(!wb.SheetNames.length){ toast('Nothing to export',1); return; }
  XLSX.writeFile(wb, filename);
  toast('Excel downloaded · '+filename);
}
function exportSalesExcel(){
  const eng=isOwner()?computeEngine():null;
  const head=['Invoice','Date','Customer','Phone','Items','Subtotal','Discount','VAT %','VAT','Total','Paid','Balance','Payment','Status'];
  if(isOwner())head.push('Profit');
  const rows=[head];
  [...DB.sales].sort((a,b)=>a.date<b.date?1:-1).forEach(s=>{ const bal=s.total-(s.paid||0);
    const r=[s.invoiceNo,s.date,s.customer||'Walk-in',s.custPhone||'',s.items.length,num2(s.subtotal),num2(s.discount),s.vatPercent||0,num2(s.vat),num2(s.total),num2(s.paid),num2(bal),(s.payment||'').toUpperCase(),payStatus(s.total,s.paid).toUpperCase()];
    if(isOwner())r.push(num2(netOf(s)-(eng.saleCost[s.id]||0)));
    rows.push(r); });

}
function exportPurchasesExcel(){

    const names=purchaseItems(p).map(it=>{const pr=productById(it.productId);return pr?pr.name:'Item';}).join(', ');
    rows.push([p.ref,p.date,p.supplier||'',names,num2(purchaseQty(p)),num2(gross),num2(disc),num2(tot),num2(p.paid),num2(bal),(p.payment||'cash').toUpperCase(),payStatus(tot,p.paid).toUpperCase()]); });

function exportInventoryExcel(){

  if(owner)head.push('Sold Revenue','Profit / Loss');

  [...DB.products].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{ const qty=stockOf(p.id,eng),avg=avgCostOf(p.id,eng),val=(qty>0?qty:0)*avg;
    const status=qty<=0?'OUT':qty<=S().lowStockLevel?'LOW':'OK';
    const r=[p.name,p.category||'',num2(qty),p.unit||'',num2(totalBought(p.id)),num2(totalSold(p.id)),num2(avg),num2(val>0?val:0),status];
    if(owner){ let sold=0,rev=0,prof=0; DB.sales.forEach(s=>s.items.forEach(it=>{ if(it.productId===p.id){ sold+=it.qty; rev+=it.qty*it.rate; prof+=it.qty*(it.rate-avg); } })); r.push(num2(rev),num2(prof)); }
    rows.push(r); });

function exportProfitExcel(){
  const eng=computeEngine();
  const from=$('#rpFrom')?.value, to=$('#rpTo')?.value, inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const sales=DB.sales.filter(s=>inRange(s.date)), purch=DB.purchases.filter(p=>inRange(p.date));
  let rev=0,netRev=0,cogs=0,vat=0,disc=0,cashS=0,cardS=0;
  sales.forEach(s=>{rev+=s.total;netRev+=netOf(s);cogs+=eng.saleCost[s.id]||0;vat+=s.vat||0;disc+=s.discount||0;s.payment==='card'?cardS+=s.total:cashS+=s.total;});
  const buyTot=purch.reduce((a,p)=>a+purchaseTotal(p),0); let cashB=0,cardB=0; purch.forEach(p=>(p.payments||[]).forEach(pm=>pm.method==='card'?cardB+=pm.amount:cashB+=pm.amount));
  const profit=netRev-cogs, margin=netRev>0?(profit/netRev*100):0;
  const period=(from||'start')+' to '+(to||'today');
  const summary=[['Little Angel Electronics — Profit & Report'],['Period',period],[],['Metric','Amount'],
    ['Gross Sales',num2(rev)],['Net Sales (excl VAT)',num2(netRev)],['Cost of Goods Sold',num2(cogs)],['Gross Profit',num2(profit)],['Margin %',num2(margin)],
    ['VAT Collected',num2(vat)],['Discounts Given',num2(disc)],['Total Purchases',num2(buyTot)],[],
    ['Channel','Sales','Purchases'],['Cash',num2(cashS),num2(cashB)],['Card',num2(cardS),num2(cardB)],['Total',num2(rev),num2(buyTot)]];
  const byProd={}; sales.forEach(s=>s.items.forEach(it=>{const p=productById(it.productId); if(!p)return; const avg=avgCostOf(it.productId,eng);
    const pr=byProd[it.productId]||(byProd[it.productId]={name:p.name,qty:0,rev:0,profit:0}); pr.qty+=it.qty; pr.rev+=it.qty*it.rate; pr.profit+=it.qty*(it.rate-avg);}));
  const prodRows=[['Product','Qty Sold','Revenue','Profit / Loss'],...Object.values(byProd).sort((a,b)=>b.profit-a.profit).map(t=>[t.name,num2(t.qty),num2(t.rev),num2(t.profit)])];
  const daily={}; const D=d=>daily[d]||(daily[d]={sales:0,purch:0,cashS:0,cardS:0,cashP:0,cardP:0});
  sales.forEach(s=>{ D(s.date).sales+=s.total; }); purch.forEach(p=>{ D(p.date).purch+=purchaseTotal(p); });
  DB.sales.forEach(s=>(s.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardS+=pm.amount; else if(pm.method==='cash')r.cashS+=pm.amount; }));
  DB.purchases.forEach(p=>(p.payments||[]).forEach(pm=>{ if(!inRange(pm.date))return; const r=D(pm.date); if(pm.method==='card')r.cardP+=pm.amount; else if(pm.method==='cash')r.cashP+=pm.amount; }));
  const dRows=[['Date','Sales','Cash Sales','Card Sales','Purchases','Cash Purch.','Card Purch.'],...Object.keys(daily).sort((a,b)=>a<b?1:-1).map(d=>{const r=daily[d];return [d,num2(r.sales),num2(r.cashS),num2(r.cardS),num2(r.purch),num2(r.cashP),num2(r.cardP)];})];
  exportExcel('profit_report_'+todayStr()+'.xlsx',[{name:'Summary',rows:summary},{name:'By Product',rows:prodRows},{name:'Daily',rows:dRows}]);
}
