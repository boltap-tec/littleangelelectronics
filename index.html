function buyCalcTotal(){
  const gross=buyItemsTotal(), disc=buyDiscount(), tot=Math.max(0,gross-disc);
  const paid=buySplits.reduce((a,s)=>a+(+s.amount||0),0), rem=tot-paid;
  const box=$('#b_tot'); if(box)box.innerHTML=`
    <div class="totrow"><span>Items total</span><span>${money(gross)}</span></div>
    ${disc>0?`<div class="totrow"><span>Discount</span><span>− ${money(disc)}</span></div><div class="totrow grand"><span>Net payable</span><span>${money(tot)}</span></div>`:''}
    <div class="totrow"><span>Paid now</span><span>${money(paid)}</span></div>
    <div class="totrow grand"><span>${Math.abs(rem)<0.01?'Fully paid':(rem>0?'Balance (supplier credit)':'Overpaid')}</span>
      <span style="color:${Math.abs(rem)<0.01?'var(--green)':(rem>0?'var(--amber)':'var(--red)')}">${money(Math.abs(rem))}</span></div>`;
  $$('#b_rows .li-row').forEach((row,i)=>{const amt=row.querySelector('input[disabled]');if(amt&&buyItems[i])amt.value=num((+buyItems[i].qty||0)*(+buyItems[i].rate||0));});
  updateSplitHints();
  setFlow('b_flow',[
    buyItems.some(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)),
    paid>0,
    tot>0 && Math.abs(rem)<0.01
  ]);
}
function savePurchase(id){
  if(!requireOnline())return;
  const items=buyItems.filter(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)).map(it=>({productId:it.productId,qty:+it.qty,rate:+it.rate}));
  if(!items.length)return toast('Add at least one product with qty & cost',1);
  const gross=items.reduce((a,it)=>a+it.qty*it.rate,0);
  const discount=Math.min(gross,Math.max(0,+($('#b_disc')?.value||0)));
  const tot=Math.max(0,gross-discount);
  const rawSplits=buySplits.filter(s=>+s.amount>0);
  if(rawSplits.some(s=>s.method==='card' && (DB.cards&&DB.cards.length) && !s.cardId))return toast('Pick a card for each card payment',1);
  if(rawSplits.some(s=>payMethodInfo(s.method).savedGift && !s.giftId))return toast('Pick a gift card for each gift-card payment',1);
  if(rawSplits.some(s=>s.method==='cardborrow' && !s.lenderId))return toast('Pick a lender for each borrowed-card payment',1);
  if(rawSplits.some(s=>s.method==='cardborrow' && !s.lenderCardId))return toast('Pick which card for each borrowed-card payment',1);
  // methods that require a reference must have one (saved-card pick, gift-card pick, or free-text ref)
  const missingRef=rawSplits.find(s=>{ const info=payMethodInfo(s.method); if(s.method==='cardborrow')return false; if(info.ref!=='mandatory')return false; return info.savedGift ? !s.giftId : (info.savedCard ? !s.cardId : !(s.ref||'').trim()); });
  if(missingRef){ const info=payMethodInfo(missingRef.method); return toast(`${info.label}: ${info.refLabel.replace(/ \((required|optional)\)/,'')} is required`,1); }
  // gift cards can't go below zero — block if any gift card is overspent
  const giftReq={}; rawSplits.forEach(s=>{ if(payMethodInfo(s.method).savedGift&&s.giftId)giftReq[s.giftId]=(giftReq[s.giftId]||0)+(+s.amount||0); });
  for(const gid in giftReq){ const g=giftById(gid); if(g){ const av=giftAvailForSplit(g); if(giftReq[gid]-av>1e-6) return toast(`${g.name}: only ${money(Math.max(0,av))} left on this gift card — reduce the amount.`,1); } }
  const date=$('#b_date').value, supplier=$('#b_sup').value.trim(), orderNo=($('#b_orderno')?.value||'').trim();
  const splits=rawSplits.map(s=>{ const info=payMethodInfo(s.method); const linksCard=s.method==='card'||info.savedCard; const isBorrow=s.method==='cardborrow';
    return {method:s.method,cardId:linksCard?(s.cardId||''):'',giftId:info.savedGift?(s.giftId||''):'',lenderId:isBorrow?(s.lenderId||''):'',lenderCardId:isBorrow?(s.lenderCardId||''):'',commission:isBorrow?(+s.commission||0):0,ref:(linksCard||info.savedGift||isBorrow)?'':(s.ref||'').trim(),deductPct:s.method==='cash'?(+s.deductPct||0):0,amount:+s.amount}; });
  // A card may be swiped past its limit ONLY if it's flagged "allow negative".
  // Cards not allowed are blocked; allowed cards go through but raise an immediate alert.
  const cardReq={}; splits.forEach(s=>{ if(s.method==='card'&&s.cardId)cardReq[s.cardId]=(cardReq[s.cardId]||0)+s.amount; });
  const negWarn=[], negBlock=[];
  for(const cid in cardReq){ const c=cardById(cid); if(c){ const av=cardAvailForSplit(c); const over=cardReq[cid]-av;
    if(over>1e-6){ if(cardAllowsNeg(c)) negWarn.push({id:cid,name:c.name,over}); else negBlock.push({name:c.name,over,av}); } } }
  if(negBlock.length){ const b=negBlock[0];
    return toast(`${b.name}: only ${money(Math.max(0,b.av))} available — this card can't go over its limit. Reduce the amount, or enable over-limit for it in Credit Cards.`,1); }
  let paid=splits.reduce((a,s)=>a+s.amount,0);
  if(paid>tot+0.01) return toast(`Payment ${money(paid)} exceeds the purchase total ${money(tot)} — overpayment isn't allowed. Reduce the amount(s).`,1);
  const methodTag = splits.length===0?'cash':(splits.length===1?splits[0].method:'split');
  const payments = splits.map(s=>({id:uid(),date,amount:s.amount,method:s.method,cardId:s.cardId||'',giftId:s.giftId||'',lenderId:s.lenderId||'',lenderCardId:s.lenderCardId||'',commission:s.commission||0,deductPct:s.deductPct||0,payRef:s.ref||'',ref:'Initial'}));
  const data={date,supplier,orderNo,items,discount,payment:methodTag,paid,payments};
  const negMsg=negWarn.length?(' · 🔴 '+negWarn.map(n=>`${n.name} negative ${money(n.over)}`).join(', ')+' — pay immediately'):'';
  if(id){ // EDIT existing — confirm; workers route to admin approval
    const rec=DB.purchases.find(x=>x.id===id); const ref=rec?rec.ref:'';
    data.orderNo = orderNo || (rec&&rec.orderNo) || ref || '';
    if(!isOwner()) return confirmBox('Send for approval?',`Editing purchase <b>${esc(ref)}</b> needs admin approval. Send this change to the admin?`,()=>queueApproval('purchase','edit',id,ref,data),'Send');
    return confirmBox('Save changes?',`Update purchase <b>${esc(ref)}</b>? Linked cash & card entries will be recalculated.`,()=>{
      commitPurchase(id,data); save();closeModal();renderPurchases();renderBell();toast('Purchase updated'+negMsg, negWarn.length?1:0);
      if(negWarn.length) setTimeout(()=>alertNegativeCards(),200); },'Save');
  }
  // NEW purchase (allowed for owner & worker)
  DB.counters.purchase++; const purchaseId=uid(), ref='PUR-'+String(DB.counters.purchase).padStart(4,'0');
  data.orderNo = orderNo || ref;
  DB.purchases.push({id:purchaseId,ref,byId:session.id,...data});
  const charged=[];
  splits.forEach(s=>{ if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId); if(c){ chargeCard(c,s.amount,date,'Purchase '+ref+(supplier?' · '+supplier:''),purchaseId); charged.push(c.name); } }
    else if(s.giftId){ const g=giftById(s.giftId); if(g){ spendGift(g,s.amount,date,'Purchase '+ref+(supplier?' · '+supplier:''),purchaseId); charged.push(g.name); } }
    else if(s.method==='cardborrow'&&s.lenderId){ postLenderSwipe(s.lenderId,s.lenderCardId,s.amount,s.commission,date,'Purchase '+ref+(supplier?' · '+supplier:''),purchaseId); const l=lenderById(s.lenderId); charged.push('borrowed'+(l?' · '+l.name:'')); } });
  save();closeModal();renderPurchases();renderBell();
  toast((charged.length?('Purchase saved · charged '+charged.join(', ')):'Purchase saved')+negMsg, negWarn.length?1:0);
  if(negWarn.length) setTimeout(()=>alertNegativeCards(),200);   // 🚨 immediate over-limit alert
}
function delPurchase(id){
  if(!requireOnline())return;
  const rec=DB.purchases.find(p=>p.id===id); const ref=rec?rec.ref:'';
  if(!isOwner()) return confirmBox('Send for approval?',`Deleting purchase <b>${esc(ref)}</b> needs admin approval. Send this delete request to the admin?`,()=>queueApproval('purchase','delete',id,ref,null),'Send');
  confirmBox('Delete purchase?',`Delete <b>${esc(ref)}</b>? Inventory, cost, card balance & payments will recalculate. This cannot be undone.`,()=>{commitPurchaseDelete(id);save();renderPurchases();renderBell();toast('Purchase deleted');},'Delete');
}

/* =========================================================
   CARD LENDERS  — borrowed-card financing ledger
   ---------------------------------------------------------
   People who lend you their credit cards. You use a card to pay a purchase
   ("swipe"); you keep a commission % and owe the lender the NET (gross − commission).
   Cash advances they give you add to what you owe; repayments reduce it.
   Each lender keeps a running balance — exactly like the manual sheet.
   A lender has many cards, each with its own default commission %.
   ========================================================= */
const LENDER_TX=[
  {k:'opening', lab:'Opening',             ic:'📌', tag:'bank',   sign:+1},
  {k:'swipe',   lab:'Card Swipe',          ic:'💳', tag:'card',   sign:+1},
  {k:'advance', lab:'Cash Given by Vendor',ic:'💵', tag:'due',    sign:+1},
  {k:'repay',   lab:'Repayment',           ic:'✅', tag:'ok',     sign:-1},
  {k:'recharge',lab:'Card Recharge',       ic:'🔁', tag:'ok',     sign:-1},
  {k:'adjust',  lab:'Adjustment',          ic:'⚖', tag:'adjust', sign:+1}
];
function lenderById(id){ return (DB.lenders||[]).find(l=>l.id===id); }
function activeLenders(){ return (DB.lenders||[]).filter(l=>l.status!=='inactive'); }
function lenderCardById(l,cid){ return ((l&&l.cards)||[]).find(c=>c.id===cid); }
function allLenderNames(){ return uniqSorted((DB.lenders||[]).map(l=>l.name)); }
function lenderTxnDelta(t){ const m=LENDER_TX.find(x=>x.k===t.type); return (m?m.sign:1)*(+t.amount||0); }
function lenderBalance(l){ return (l&&l.txns||[]).reduce((a,t)=>a+lenderTxnDelta(t),0); }
function lenderCommission(l){ return (l&&l.txns||[]).reduce((a,t)=>a+(t.type==='swipe'?((+t.gross||0)-(+t.amount||0)):0),0); }
function lenderNet_(gross,pct){ return Math.round((+gross||0)*(1-(+pct||0)/100)*100)/100; }
/* a lender card's display label (name + last-4) */
function lenderCardLabel(c){ if(!c)return ''; const nm=(c.name||c.label||'Card'); return c.last4?`${nm} ••${c.last4}`:nm; }
/* the lender's default card fee % — deducted when we swipe our card to repay / recharge them */
function lenderFeeOf(l){ return (l&&l.feePct!=null&&l.feePct!=='')?(+l.feePct||0):(+S().lenderCardFeePct||0); }
/* create a swipe ledger line (used by manual entry AND by borrowed-card purchases) */
function postLenderSwipe(lenderId,cardId,gross,commissionPct,date,note,srcPurchaseId){
  const l=lenderById(lenderId); if(!l)return; if(!l.txns)l.txns=[];
  const card=lenderCardById(l,cardId), c=+commissionPct||0;
  l.txns.push({id:uid(),date:date||todayStr(),type:'swipe',cardId:cardId||'',cardLabel:card?card.label:'',gross:+gross||0,commission:c,amount:lenderNet_(gross,c),note:note||'',srcPurchaseId:srcPurchaseId||undefined});
}
function unlinkPurchaseFromLenders(pid){ (DB.lenders||[]).forEach(l=>{ if(l.txns)l.txns=l.txns.filter(t=>t.srcPurchaseId!==pid); }); }
function renderLenderBadge(){ const b=$('#lenderBadge'); if(!b)return; const n=(DB.lenders||[]).filter(l=>lenderBalance(l)>0.005).length;
  if(n>0){ b.textContent=n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
/* dashboard alert — money owed to each lender */
function lenderAlertBanner(){

function saveLenderTxn(lenderId,type,txnId){

  const editing=txnId?((l.txns||[]).find(x=>x.id===txnId)):null;

  // NEW multi-card repay / recharge → one ledger line per card
  if(!editing && (type==='recharge' || repayByCard)){
    const mode=type==='recharge'?'recharge':'repay';
    const rows=lenderSplitsArr(mode).filter(s=>s.cardId && (+s.amount>0));
    if(!rows.length)return toast('Add at least one card with an amount',1);

    rec={type:'swipe',cardId,cardLabel:card?card.name:'',gross,commission:comm,amount:lenderNet_(gross,comm),note:note||'Manual swipe'};
  } else if(type==='advance'){
    const amt=+$('#lt_amt').value; if(!(amt>0))return toast('Enter the amount',1); rec={type:'advance',amount:amt,note};
  } else if(type==='repay'||type==='recharge'){        // editing a single card line, or a cash repayment
    if(repayByCard || type==='recharge'){
      const mode=type==='recharge'?'recharge':'repay';
      const s=(lenderSplitsArr(mode).filter(x=>x.cardId&&(+x.amount>0)))[0];
      if(!s)return toast('Add a card with an amount',1);
      const fee=(mode==='repay'?lenderRepayCommPct():0), gross=+s.amount||0, net=lenderNet_(gross,fee);
      const label=mode==='repay'?(cardById(s.cardId)?cardById(s.cardId).name:''):(lenderCardById(l,s.cardId)?lenderCardLabel(lenderCardById(l,s.cardId)):'');
      rec={type,method:'card',amount:net,gross,deductPct:fee,cardId:s.cardId,cardLabel:label,note};
    } else { const amt=+$('#lt_amt').value; if(!(amt>0))return toast('Enter the amount',1); rec={type:'repay',method:'cash',amount:amt,note}; }
  } else {
    const amt=+$('#lt_amt').value; if(!amt)return toast('Enter an amount (+ or −)',1); rec={type:'adjust',amount:amt,note};
  }
  let tid;
  if(editing){ tid=editing.id; ['gross','deductPct','cardId','cardName','cardLabel','commission','method'].forEach(k=>{ if(!(k in rec))delete editing[k]; }); Object.keys(rec).forEach(k=>editing[k]=rec[k]); editing.date=date; logAct('edit','card lender',l.name,lab+' updated');
  } else { tid=uid(); l.txns.push({id:tid,date,...rec}); logAct('edit','card lender',l.name,lab+' '+money(rec.gross||rec.amount||0)); }
  if(type==='repay') unlinkPurchaseFromCards('lref:'+tid);   // repay-by-card only records against the vendor ledger; it does not charge the card
  save();closeModal();renderLenders();renderLenderBadge();
  toast(lab+(editing?' updated':' saved'));
}

/* ---- statement (date range or all) → PDF & Excel, sheet-style ---- */
function lenderStatementData(l,from,to){
  const all=[...(l.txns||[])].sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  let opening=0; const rows=[];
  all.forEach(t=>{ const delta=lenderTxnDelta(t);
    if(from && (t.date||'')<from){ opening+=delta; return; }
    if(to && (t.date||'')>to) return;
    rows.push({...t,delta,commAmt:(t.type==='swipe'?Math.round(((+t.gross||0)-(+t.amount||0))*100)/100:0)}); });
  let run=opening; rows.forEach(r=>{ run+=r.delta; r.run=Math.round(run*100)/100; });
  const totalOwed=rows.reduce((a,r)=>a+(r.delta>0?r.delta:0),0);
  const totalPaid=rows.reduce((a,r)=>a+(r.delta<0?-r.delta:0),0);
  const commission=rows.reduce((a,r)=>a+(r.commAmt||0),0);
  return {opening:Math.round(opening*100)/100,rows,totalOwed:Math.round(totalOwed*100)/100,totalPaid:Math.round(totalPaid*100)/100,commission:Math.round(commission*100)/100,closing:Math.round(run*100)/100};

async function buildLenderStatementPdf(id,from,to){
  const l=lenderById(id); if(!l)return;
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return; }
  toast('Preparing statement…',0);
  const holder=document.createElement('div');

  holder.innerHTML=`<div id="stmtArea">${lenderStatementHtml(l,from,to)}</div>`;
  document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#stmtArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); } else { let left=imgH,pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){pdf.addPage();pos-=ph;} } }
    const fn='statement_'+(l.name||'lender').replace(/[^\w.-]+/g,'_')+'_'+(from||'all')+'_'+(to||todayStr())+'.pdf';
    const url=URL.createObjectURL(pdf.output('blob')); const a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('Statement ready — '+fn);
  }catch(e){ toast('Could not build the statement PDF',1); }
  finally{ document.body.removeChild(holder); }
}

/* =========================================================
   ONLINE ORDERS / ONLINE PURCHASES
   Orders placed on online platforms (Amazon, Noon, AliExpress, …) live here,
   separate from ordinary purchases, and DO NOT affect stock or cost while in
   transit. When status becomes "Delivered" the order converts into a real
   purchase — that is when its goods enter inventory.
   Payment is OPTIONAL at order time (some platforms charge up front, some on
   delivery). Any prepayment uses the same cash/card/gift machinery as purchases
   and is fully reversible: cancelling an order reverts its prepayment (cash back
   to the wallet, card charge removed, gift balance restored). On delivery the
   prepayment carries over to the new purchase as already-paid.
   ========================================================= */
const ONLINE_STATUS=[
  {k:'ordered',  lab:'Ordered',   tag:'bank',    ic:'🧾'},
  {k:'shipped',  lab:'Shipped',   tag:'partial', ic:'🚚'},
  {k:'delivered',lab:'Delivered', tag:'ok',      ic:'📦'},
  {k:'returned', lab:'Returned',  tag:'adjust',  ic:'↩'},
  {k:'cancelled',lab:'Cancelled', tag:'due',     ic:'✕'}
];
function onlStatusInfo(k){ return ONLINE_STATUS.find(s=>s.k===k)||ONLINE_STATUS[0]; }
function onlStatusTag(k){ const i=onlStatusInfo(k); return `<span class="tag ${i.tag}">${i.ic} ${i.lab.toUpperCase()}</span>`; }
function onlItemsArr(o){ return (o&&o.items&&o.items.length)?o.items:[]; }
function onlGross(o){ return onlItemsArr(o).reduce((a,it)=>a+(+it.qty||0)*(+it.rate||0),0); }
function onlDiscount(o){ const g=onlGross(o); return Math.min(g,Math.max(0,+o.discount||0)); }
function onlTotal(o){ return Math.max(0,onlGross(o)-onlDiscount(o)); }
function onlQty(o){ return onlItemsArr(o).reduce((a,it)=>a+(+it.qty||0),0); }
function onlFirstName(o){ const its=onlItemsArr(o); const f=productById(its[0]?.productId); return f?f.name:'—'; }
function allOnlinePlatforms(){ return uniqSorted((DB.online||[]).map(o=>o.platform)); }
function pendingOnline(){ return (DB.online||[]).filter(o=>o.status==='ordered'||o.status==='shipped'); }
function renderOnlineBadge(){ const b=$('#onlBadge'); if(!b)return; const n=pendingOnline().length;
  if(n>0){ b.textContent=n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
/* dashboard alert — online orders still in transit, overdue ones flagged first */
function onlineAlertBanner(){
  if(!canView('online')) return '';

  const rank=o=>{ const od=o.expectedDate&&o.expectedDate<today; return od?0:(o.expectedDate?1:2); };
  const list=[...pend].sort((a,b)=> rank(a)-rank(b) || ((a.expectedDate||'zzzz')<(b.expectedDate||'zzzz')?-1:1));
  const overdue=list.filter(o=>o.expectedDate&&o.expectedDate<today).length;
  const rows=list.slice(0,6).map(o=>{
    const od=o.expectedDate&&o.expectedDate<today;
    const eta=o.expectedDate?(od?`<span class="badge-due">OVERDUE · ${fmtDate(o.expectedDate)}</span>`:`<span style="color:var(--muted);font-size:12px">ETA ${fmtDate(o.expectedDate)}</span>`):`<span style="color:var(--muted2);font-size:12px">no ETA</span>`;

  const more=list.length>6?`<div style="margin-top:6px;font-size:12.5px;color:var(--muted)">+${list.length-6} more in Online Orders…</div>`:'';
  const head=overdue>0?`${overdue} online order${overdue>1?'s':''} overdue · ${list.length} in transit`:`${list.length} online order${list.length>1?'s':''} in transit`;
  return `<div class="urgent-banner" style="border-color:#2563eb;background:linear-gradient(180deg,var(--brandsoft),var(--panel));animation:none">

/* a payment-line object built from the order's optional prepayment fields (null when nothing prepaid) */
function onlPayObj(o){ if(!o||!(+o.payAmt>0))return null;
  return {method:o.payMethod||'cash',amount:+o.payAmt||0,cardId:o.payCardId||'',giftId:o.payGiftId||'',lenderId:o.payLenderId||'',lenderCardId:o.payLenderCardId||'',commission:+o.payCommission||0,deductPct:+o.payDeductPct||0,payRef:o.payRef||'',ref:o.payRef||'',date:o.payDate||o.orderDate}; }
/* apply the prepayment's wallet effect (card charge / gift spend / borrowed-card swipe). Cash is
   derived in cashEntries() so it needs no action here. Tagged with the order id so it can be reverted. */
function applyOnlinePay(o){ const pm=onlPayObj(o); if(!pm)return; const note='Online order '+(o.ref||'')+(o.platform?' · '+o.platform:''); const date=pm.date||o.orderDate||todayStr();
  if(pm.method==='card'&&pm.cardId){ const c=cardById(pm.cardId); if(c)chargeCard(c,pm.amount,date,note,o.id); }
  else if(payMethodInfo(pm.method).savedGift&&pm.giftId){ const g=giftById(pm.giftId); if(g)spendGift(g,pm.amount,date,note,o.id); }
  else if(pm.method==='cardborrow'&&pm.lenderId){ postLenderSwipe(pm.lenderId,pm.lenderCardId,pm.amount,pm.commission,date,note,o.id); } }
/* undo the prepayment's wallet effect (used on cancel, edit re-sync, and delete). Cash reverts by
   the order no longer being counted in cashEntries() once it is cancelled/edited. */
function revertOnlinePay(o){ if(!o)return; unlinkPurchaseFromCards(o.id); unlinkPurchaseFromGifts(o.id); unlinkPurchaseFromLenders(o.id); }

function saveOnline(id){
  if(!requireOnline())return;
  const items=onlItems.filter(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)).map(it=>({productId:it.productId,qty:+it.qty,rate:+it.rate}));
  if(!items.length)return toast('Add at least one product with qty & cost',1);
  const platform=$('#o_plat').value.trim(); if(!platform)return toast('Enter the platform / store',1);
  const gross=items.reduce((a,it)=>a+it.qty*it.rate,0);
  const discount=Math.min(gross,Math.max(0,+($('#o_disc').value||0)));
  const tot=Math.max(0,gross-discount);
  // optional prepayment
  const payAmt=Math.max(0,+($('#o_payamt')?.value||0));
  const payMethod=$('#o_paymethod')?.value||'cash', info=payMethodInfo(payMethod);
  let payCardId='', payGiftId='', payDeductPct=0, payRef='', payLenderId='', payLenderCardId='', payCommission=0;
  if(payAmt>0){
    if(payAmt>tot+0.01)return toast('Paid amount can’t exceed the order total '+money(tot),1);
    if(payMethod==='card'||info.savedCard){ payCardId=$('#o_paycard')?.value||''; if(payMethod==='card'&&!payCardId)return toast('Pick a card for the card payment',1); }
    if(info.savedGift){ payGiftId=$('#o_paygift')?.value||''; if(!payGiftId)return toast('Pick a gift card for the gift-card payment',1); }
    if(payMethod==='cardborrow'){ payLenderId=_onlPay.lenderId||''; payLenderCardId=_onlPay.lenderCardId||''; payCommission=Math.max(0,Math.min(100,+_onlPay.commission||0)); if(!payLenderId)return toast('Pick a lender for the borrowed-card payment',1); if(!payLenderCardId)return toast('Pick which card for the borrowed-card payment',1); }
    if(payMethod==='cash'){ payDeductPct=Math.max(0,Math.min(100,+($('#o_paydeduct')?.value||0))); }
    if(info.ref && !info.savedCard && !info.savedGift && payMethod!=='cardborrow'){ payRef=($('#o_payref')?.value||'').trim(); if(info.ref==='mandatory'&&!payRef)return toast(info.refLabel.replace(/ \((required|optional)\)/,'')+' is required',1); }
  }
  const payDate=$('#o_paydate')?.value||$('#o_date').value||todayStr();
  const data={platform,orderNo:($('#o_orderno')?.value||'').trim(),supplier:$('#o_sup').value.trim(),orderDate:$('#o_date').value||todayStr(),expectedDate:$('#o_exp').value||'',tracking:$('#o_track').value.trim(),notes:$('#o_notes').value.trim(),items,discount,
    payAmt,payMethod:payAmt>0?payMethod:'',payCardId,payGiftId,payDeductPct,payRef,payLenderId,payLenderCardId,payCommission,payDate:payAmt>0?payDate:''};
  if(id){
    const rec=(DB.online||[]).find(x=>x.id===id); if(!rec)return; if(rec.status==='delivered')return toast('Delivered orders are purchases now',1);
    revertOnlinePay(rec);            // undo the old prepayment's wallet effect
    data.orderNo = data.orderNo || rec.orderNo || rec.ref || '';
    Object.assign(rec,data);
    if(rec.status!=='cancelled') applyOnlinePay(rec);   // re-apply the new prepayment (a cancelled order stays reverted)
    logAct('edit','online order',rec.ref,`Edited · ${items.length} item(s) · ${money(tot)}${payAmt>0?' · paid '+money(payAmt):''}`);
    save();closeModal();renderOnline();renderBell();
    toast('Online order updated'+(isOwner()?'':' · admin notified'));
    return;
  }
  if(!Array.isArray(DB.online))DB.online=[];
  if(!DB.counters.online)DB.counters.online=0;
  DB.counters.online++; const ref='ONL-'+String(DB.counters.online).padStart(4,'0');
  const o={id:uid(),ref,status:'ordered',byId:session.id,createdTs:todayStr(),purchaseId:'',...data};
  if(!o.orderNo) o.orderNo = ref;
  DB.online.push(o);
  applyOnlinePay(o);
  logAct('create','online order',ref,`New · ${items.length} item(s) · ${platform} · ${money(tot)}${payAmt>0?' · paid '+money(payAmt):''}`);
  save();closeModal();renderOnline();renderBell();
  toast('Online order '+ref+' saved'+(payAmt>0?' · '+money(payAmt)+' paid':''));
}
function setOnlineStatus(id,status){

  confirmBox('Cancel this order?',`Mark online order <b>${esc(o.ref)}</b> as cancelled? It will not be added to inventory.`+how+(isOwner()?'':' The admin will be notified.'),()=>{

function reopenOnline(id){

/* return a delivered order: remove the stocked purchase (stock out) and refund every payment
   back to its original method, then mark the order Returned (kept for the record). */
function returnOnline(id){
  if(!requireOnline())return;
  const o=(DB.online||[]).find(x=>x.id===id); if(!o||o.status!=='delivered')return;
  const linked=o.purchaseId&&DB.purchases.some(p=>p.id===o.purchaseId);
  const paid=(+o.payAmt>0)?money(+o.payAmt):'the amount paid';
  confirmBox('Return this order?',`Return online order <b>${esc(o.ref)}</b>? The stocked goods are removed from inventory and ${paid} is reverted to its original pay mode — a card charge is removed, cash goes back to the wallet, a gift-card balance is restored, or a vendor-card swipe is reversed.`+(isOwner()?'':' The admin will be notified.'),()=>{
    if(linked) commitPurchaseDelete(o.purchaseId);   // reverses stock + every card/gift/lender/cash charge of the purchase
    else revertOnlinePay(o);                          // fallback: undo any order-tagged prepayment

function confirmDeliver(id){
  if(!requireOnline())return;
  const o=(DB.online||[]).find(x=>x.id===id); if(!o||o.status==='delivered')return;
  const items=onlItemsArr(o); if(!items.length)return toast('This order has no products to stock',1);
  const tot=onlTotal(o), pm=onlPayObj(o), prepaid=pm?Math.min(pm.amount,tot):0, bal=Math.max(0,tot-prepaid);
  // payment collected at delivery (optional)
  let dAmt=Math.max(0,+($('#d_payamt')?.value||0));
  const dMethod=$('#d_paymethod')?.value||'cash', dInfo=payMethodInfo(dMethod);
  let dCardId='',dGiftId='',dDeduct=0,dRef='',dLenderId='',dLenderCardId='',dCommission=0;
  if(dAmt>0){
    if(dAmt>bal+0.01) dAmt=bal;                       // never collect more than the balance
    if(dMethod==='card'||dInfo.savedCard){ dCardId=$('#d_paycard')?.value||''; if(dMethod==='card'&&!dCardId)return toast('Pick a card for the card payment',1); }
    if(dInfo.savedGift){ dGiftId=$('#d_paygift')?.value||''; if(!dGiftId)return toast('Pick a gift card for the gift-card payment',1); }
    if(dMethod==='cardborrow'){ dLenderId=_delPay.lenderId||''; dLenderCardId=_delPay.lenderCardId||''; dCommission=Math.max(0,Math.min(100,+_delPay.commission||0)); if(!dLenderId)return toast('Pick a lender for the borrowed-card payment',1); if(!dLenderCardId)return toast('Pick which card for the borrowed-card payment',1); }
    if(dMethod==='cash'){ dDeduct=Math.max(0,Math.min(100,+($('#d_paydeduct')?.value||0))); }
    if(dInfo.ref&&!dInfo.savedCard&&!dInfo.savedGift&&dMethod!=='cardborrow'){ dRef=($('#d_payref')?.value||'').trim(); if(dInfo.ref==='mandatory'&&!dRef)return toast(dInfo.refLabel.replace(/ \((required|optional)\)/,'')+' is required',1); }
  }
  const today=todayStr(), dDate=$('#d_paydate')?.value||today;
  revertOnlinePay(o);                                 // drop the order-tagged prepay charge; re-applied under the purchase
  if(!DB.counters.purchase)DB.counters.purchase=0;
  DB.counters.purchase++; const purchaseId=uid(), pref='PUR-'+String(DB.counters.purchase).padStart(4,'0');
  const supplier=o.platform+(o.supplier?(' · '+o.supplier):''), note='Purchase '+pref+' · '+supplier;
  const payments=[]; let paid=0;
  if(prepaid>0&&pm){ payments.push({id:uid(),date:pm.date||today,amount:prepaid,method:pm.method,cardId:pm.cardId||'',giftId:pm.giftId||'',lenderId:pm.lenderId||'',lenderCardId:pm.lenderCardId||'',commission:pm.commission||0,deductPct:pm.deductPct||0,payRef:pm.payRef||'',ref:'Prepaid online'}); paid+=prepaid;
    if(pm.method==='card'&&pm.cardId){ const c=cardById(pm.cardId); if(c)chargeCard(c,prepaid,pm.date||today,note,purchaseId); }
    else if(payMethodInfo(pm.method).savedGift&&pm.giftId){ const g=giftById(pm.giftId); if(g)spendGift(g,prepaid,pm.date||today,note,purchaseId); }
    else if(pm.method==='cardborrow'&&pm.lenderId){ postLenderSwipe(pm.lenderId,pm.lenderCardId,prepaid,pm.commission,pm.date||today,note,purchaseId); } }
  if(dAmt>0){ payments.push({id:uid(),date:dDate,amount:dAmt,method:dMethod,cardId:dCardId,giftId:dGiftId,lenderId:dLenderId,lenderCardId:dLenderCardId,commission:dCommission,deductPct:dDeduct,payRef:dRef,ref:'Paid on delivery'}); paid+=dAmt;
    if(dMethod==='card'&&dCardId){ const c=cardById(dCardId); if(c)chargeCard(c,dAmt,dDate,note,purchaseId); }
    else if(dInfo.savedGift&&dGiftId){ const g=giftById(dGiftId); if(g)spendGift(g,dAmt,dDate,note,purchaseId); }
    else if(dMethod==='cardborrow'&&dLenderId){ postLenderSwipe(dLenderId,dLenderCardId,dAmt,dCommission,dDate,note,purchaseId); } }
  const payTag = payments.length===0?'cash':(payments.length===1?payments[0].method:'split');
  DB.purchases.push({id:purchaseId,ref:pref,byId:session.id,date:today,supplier,items:items.map(it=>({productId:it.productId,qty:+it.qty,rate:+it.rate})),discount:+o.discount||0,payment:payTag,paid,payments,fromOnline:o.id,onlineRef:o.ref});
  o.status='delivered'; o.deliveredDate=today; o.purchaseId=purchaseId;
  logAct('deliver','online order',o.ref,`Delivered → stocked as ${pref} · ${money(tot)} · paid ${money(paid)}`);
  logAct('create','purchase',pref,`From online order ${o.ref} · ${items.length} item(s) · ${money(tot)}`);
  save();closeModal();renderOnline();if(typeof renderPurchases==='function')renderPurchases();renderBell();renderOnlineBadge();
  const balLeft=Math.max(0,tot-paid);
  toast('📦 '+o.ref+' delivered — stocked as '+pref+(balLeft<=0.01?' (fully paid)':' · '+money(balLeft)+' balance in Purchases'));
  const active=$('.nav-item.active')?.dataset.view; if(active==='dashboard')go('dashboard'); else if(active==='purchases')renderPurchases();
}
function delOnline(id){

function saleProdOpts(sel,eng){ eng=eng||computeEngine(); if(!DB.products.length)return '<option value="">— add a product first —</option>';

/* stock available for THIS line = product stock − qty already used by OTHER lines of the same product */
function saleLineAvail(i,eng){ const it=saleDraft[i]; if(!it||!it.productId)return 0; eng=eng||computeEngine();
  const used=saleDraft.reduce((a,x,j)=> a + (j!==i && x.productId===it.productId ? (+x.qty||0):0), 0);
  return saleAvail(it.productId,eng) - used; }
function saleHintHtml(i,eng){ const it=saleDraft[i]; if(!it||!it.productId)return 'Search &amp; pick a product (most recent shown first)';
  const bp=avgBuyPrice(it.productId,eng), avail=saleLineAvail(i,eng), over=(+it.qty||0)>avail+1e-9;
  return `Avg buy price <b style="color:var(--gold2)">${money(bp)}</b> <span style="opacity:.6">(${avgWindowLabel()})</span> · available <b style="color:${over?'var(--red)':'var(--green)'}">${num(Math.max(0,avail))}</b>${over?` · <span class="blink" style="color:#fff;background:var(--red);padding:1px 7px;border-radius:6px;font-weight:800">⚠ only ${num(Math.max(0,avail))} in stock</span>`:''}${(+it.rate>0&&+it.rate<bp)?` · <span style="color:var(--red)">below cost</span>`:''}`; }

let _salePaidTouched=false;
function saleCalc(){
  const eng=computeEngine();
  const sub=saleDraft.reduce((a,i)=>a+(+i.qty||0)*(+i.rate||0),0);
  const disc=+($('#s_disc')?.value||0);
  const base=Math.max(0,sub-disc);
  const mode=$('#s_vatmode')?.value||'none', r=+S().vatPercent||0;
  let vat=0,total=base,net=base;
  if(mode==='inclusive'){ vat=Math.round(base*r/(100+r)*100)/100; net=Math.round((base-vat)*100)/100; total=base; }
  else if(mode==='exclusive'){ vat=Math.round(base*r/100*100)/100; total=Math.round((base+vat)*100)/100; net=base; }
  const box=$('#s_tot'); if(!box)return;
  const paidEl=$('#s_paid');
  if(paidEl && !_salePaidTouched) paidEl.value = +total.toFixed(2);   // auto-fill full until user edits
  let received=+((paidEl&&paidEl.value)||0); if(received>total)received=total;
  const bal=total-received;
  const payM=$('#s_pay')?.value, ded=payM==='cash'?(+($('#s_deduct')?.value)||0):0;
  const netCash=received*(1-ded/100);
  box.innerHTML=`<div class="totrow"><span>Subtotal</span><span>${money(sub)}</span></div>
    ${disc>0?`<div class="totrow"><span>Discount</span><span>− ${money(disc)}</span></div>`:''}
    ${mode!=='none'?`<div class="totrow"><span>VAT ${r}%${mode==='inclusive'?' (incl.)':''}</span><span>${money(vat)}</span></div>`:''}
    <div class="totrow grand"><span>Total</span><span>${money(total)}</span></div>
    <div class="totrow"><span>Received now</span><span>${money(received)}</span></div>
    ${ded>0?`<div class="totrow"><span>Cash discount ${ded}%</span><span>− ${money(received-netCash)}</span></div><div class="totrow" style="color:var(--green)"><span>Net cash to wallet</span><span>${money(netCash)}</span></div>`:''}
    <div class="totrow" style="font-weight:800;color:${bal>0.01?'var(--red)':'var(--green)'}"><span>${bal>0.01?'Credit — to collect later':'Fully paid'}</span><span>${money(bal>0?bal:0)}</span></div>`;
  box._t={sub,disc,vat,total,net,mode};
  /* live per-row amount + stock warning */
  $$('#s_rows .li-row').forEach((row,i)=>{ if(!saleDraft[i])return;
    const amt=row.querySelector('input[disabled]'); if(amt)amt.value=num((+saleDraft[i].qty||0)*(+saleDraft[i].rate||0));
    const qtyIn=row.querySelector('input:not([disabled])'); const over=saleDraft[i].productId&&(+saleDraft[i].qty||0)>saleLineAvail(i,eng)+1e-9;
    if(qtyIn)qtyIn.classList.toggle('qty-over',!!over);
    const hint=row.nextElementSibling; if(hint&&hint.classList.contains('li-hint'))hint.innerHTML=saleHintHtml(i,eng);
  });
  setFlow('s_flow',[
    saleDraft.some(it=>it.productId&&(+it.qty>0)&&it.rate!==''&&(+it.rate>=0)),
    !!(paidEl&&paidEl.value!==''&&received>0),
    total>0 && received>0 && bal<=0.01
  ]);
}
function saveSale(id,print){
  if(!requireOnline())return;
  const items=saleDraft.filter(i=>i.productId&&(+i.qty>0)&&i.rate!==''&&(+i.rate>=0));
  if(!items.length)return toast('Add at least one item with qty & rate',1);
  // block selling more than available stock (accounting for this sale's own existing qty when editing)
  const eng=computeEngine(), req={}; items.forEach(i=>req[i.productId]=(req[i.productId]||0)+(+i.qty||0));
  for(const pid in req){ const avail=saleAvail(pid,eng); if(req[pid]>avail+1e-9){ const pr=productById(pid); return toast(`Not enough stock for ${pr?pr.name:'item'} — available ${num(avail)}, needed ${num(req[pid])}`,1); } }
  const t=$('#s_tot')._t, method=$('#s_pay').value;
  const deductPct=method==='cash'?(+($('#s_deduct')?.value)||0):0;
  const paidRaw=$('#s_paid').value;
  if(paidRaw==='')return toast('Enter the amount received now — put 0 if the customer pays later',1);
  let paid=Math.max(0,+paidRaw);
  if(paid>t.total+0.01) return toast(`Amount received ${money(paid)} exceeds the bill total ${money(t.total)} — overpayment isn't allowed. Reduce the amount.`,1);
  const payMeta={}; if(deductPct>0)payMeta.deductPct=deductPct;
  const base={date:$('#s_date').value,customer:$('#s_cust').value.trim(),custPhone:$('#s_phone').value.trim(),
    custAddress:$('#s_addr').value.trim(),custVat:$('#s_vat').value.trim(),billNo:($('#s_billno')?.value||'').trim(),collectedBy:($('#s_collby')?.value||session.id),
    items:items.map(i=>({productId:i.productId,qty:+i.qty,rate:+i.rate})),
    payment:method,discount:+($('#s_disc').value||0),vatMode:t.mode,
    subtotal:t.sub,vat:t.vat,net:t.net,vatPercent:t.mode!=='none'?(+S().vatPercent||0):0,total:t.total};
  const bal=Math.round((t.total-paid)*100)/100;
  const creditNote = bal>0.01 ? `<br><br>⚠ Sold for <b>${money(t.total)}</b> but only <b>${money(paid)}</b> received now — balance <b style="color:var(--red)">${money(bal)}</b> will be tracked as credit in Payments.` : '';
  if(id){ // EDIT — confirm; workers route to admin approval
    const rec=DB.sales.find(x=>x.id===id); const inv=rec?rec.invoiceNo:'';
    const data={...base,paid,payments:paid>0?[{id:uid(),date:base.date,amount:paid,method,...payMeta,ref:'Updated'}]:[]};
    data.billNo = base.billNo || (rec&&rec.billNo) || inv || '';
    if(!isOwner()) return confirmBox('Send for approval?',`Editing invoice <b>${esc(inv)}</b> needs admin approval. Send this change to the admin?${creditNote}`,()=>queueApproval('sale','edit',id,inv,data),'Send');
    return confirmBox('Save changes?',`Update invoice <b>${esc(inv)}</b>? Stock, profit & payments will recalculate.${creditNote}`,()=>{
      commitSale(id,data); save();closeModal();renderSales();toast('Sale updated'+(print?' · opening bill':'')); if(print)setTimeout(()=>openSalePdf(id),120); },'Save');
  }
  // NEW sale
  const commitNew=()=>{
    DB.counters.sale++; const inv=S().invoicePrefix+String(DB.counters.sale).padStart(4,'0'); const nid=uid();
    DB.sales.push({id:nid,invoiceNo:inv,byId:session.id,...base,billNo:base.billNo||inv,paid,payments:paid>0?[{id:uid(),date:base.date,amount:paid,method,...payMeta,ref:'Initial'}]:[]});
    save();closeModal();renderSales();toast('Sale saved '+(print?'· opening bill':''));
    if(print)setTimeout(()=>openSalePdf(nid),120);
  };
  if(bal>0.01) return confirmBox('Credit sale — balance due',`Sold for <b>${money(t.total)}</b> but only <b>${money(paid)}</b> received now.<br>The balance <b style="color:var(--red)">${money(bal)}</b> will be tracked as credit in Payments.<br><br>Save this sale?`,commitNew,'Save Sale');
  commitNew();
}
function delSale(id){
  if(!requireOnline())return;

  if(!isOwner()) return confirmBox('Send for approval?',`Deleting invoice <b>${esc(inv)}</b> needs admin approval. Send this delete request to the admin?`,()=>queueApproval('sale','delete',id,inv,null),'Send');

/* ---------- build a real A4 PDF blob of the bill ---------- */
async function buildSalePdf(id){
  const s=DB.sales.find(x=>x.id===id); if(!s)return null;
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return null; }
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;z-index:-1';
  holder.innerHTML=invoiceHtml(s);
  document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#invoiceArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); }
    else { let left=imgH, pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }
    const filename=String(s.invoiceNo||'invoice').replace(/[^\w.-]+/g,'_')+'.pdf';
    return {blob:pdf.output('blob'), filename, sale:s};
  }catch(e){
    toast('Could not build the PDF'+(String(e).includes('Tainted')||String(e).includes('SecurityError')?' — a logo/seal image blocks it; use a local upload':''),1);
    return null;
  }finally{ document.body.removeChild(holder); }
}
/* ---------- OPEN BILL: view the bill as a PDF (new tab; print from there if needed) ---------- */
async function openSalePdf(id){
  toast('Preparing PDF…',0);
  const r=await buildSalePdf(id); if(!r)return;
  const url=URL.createObjectURL(r.blob);
  const w=window.open(url,'_blank');
  if(!w){ // popup blocked — fall back to a download so the bill is never lost
    const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
    toast('Popup blocked — bill saved as PDF ('+r.filename+')',0);
  } else toast('Bill opened as PDF');
  setTimeout(()=>URL.revokeObjectURL(url),60000);   // keep it alive long enough for the viewer to load
}
/* ---------- SHARE BILL: save the bill as a PDF file ---------- */
async function pdfSale(id){

  const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();

}
/* ---------- SHARE icon: send the PDF to WhatsApp (native share sheet) ---------- */
async function shareSale(id){
  toast('Preparing PDF…',0);
  const r=await buildSalePdf(id); if(!r)return;
  const s=r.sale, cap=saleSummaryText(s);
  const file=new File([r.blob], r.filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Invoice '+s.invoiceNo, text:cap}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }   // user cancelled the share sheet
  }
  // fallback (desktop / no file-share): save the PDF then open the WhatsApp chat so it can be attached
  const url=URL.createObjectURL(r.blob);
  const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  let phone=(s.custPhone||'').replace(/[^\d]/g,''); if(phone.startsWith('0'))phone='971'+phone.slice(1);
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(cap+'\n\n(Bill saved as PDF — please attach it here.)'),'_blank');

/* Auto-add a horizontal-scroll affordance (nudging arrow + edge fade) to EVERY wide
   table so the right-hand columns (Edit/Delete, balances, actions) are never silently
   cut off. Any .table-wrap not already inside a .scrollx gets wrapped once. */
function enhanceScrollx(){
  $$('.table-wrap').forEach(w=>{ const p=w.parentElement;
    if(p && !p.classList.contains('scrollx')){ const sx=document.createElement('div'); sx.className='scrollx';
      p.insertBefore(sx, w); sx.appendChild(w); } });
  $$('.scrollx').forEach(sx=>{ const w=sx.querySelector('.table-wrap'); if(!w)return;
    if(!sx._arrows){ sx._arrows=1; ['left','right'].forEach(dir=>{
      const b=document.createElement('button'); b.type='button'; b.className='sx-arrow '+dir;
      b.textContent=dir==='right'?'›':'‹'; b.setAttribute('aria-label',dir==='right'?'Scroll table right':'Scroll table left');
      // don't let the button take focus — that makes the browser jump the whole page to it
      b.addEventListener('mousedown',e=>e.preventDefault());
      b.addEventListener('click',e=>{ e.preventDefault();
        w.scrollBy({left:(dir==='right'?1:-1)*Math.max(180,w.clientWidth*0.7),behavior:'smooth'}); });
      sx.appendChild(b); }); }
    const upd=()=>{ sx.classList.toggle('scrollable', w.scrollWidth>w.clientWidth+2);
      sx.classList.toggle('at-end', w.scrollLeft+w.clientWidth>=w.scrollWidth-2);
      sx.classList.toggle('at-start', w.scrollLeft<=2); };
    upd(); if(!w._sxBound){ w._sxBound=1; w.addEventListener('scroll',upd,{passive:true}); } });
}
if(!window._sxResize){ window._sxResize=1; window.addEventListener('resize',()=>{ try{enhanceScrollx();}catch(e){} }); }
/* re-run whenever #main content changes (view switch, search filter, etc.) */
function initScrollxObserver(){ const main=document.getElementById('main'); if(!main||window._sxObs)return; window._sxObs=1;
  let raf=0; new MutationObserver(()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ try{enhanceScrollx();}catch(e){} }); })
    .observe(main,{childList:true,subtree:true}); }

function recordPay(kind,id){
  const rec = kind==='sale'? DB.sales.find(s=>s.id===id) : DB.purchases.find(p=>p.id===id);
  if(!rec)return;
  const total = kind==='sale'? rec.total : purchaseTotal(rec);
  const bal = total-(rec.paid||0);
  openModal(kind==='sale'?'Collect Payment':'Pay Supplier',`
    <p style="margin:0 0 14px;color:var(--muted);font-size:13.5px">${kind==='sale'?'Invoice':'Ref'} <b style="color:var(--text)">${esc(kind==='sale'?rec.invoiceNo:rec.ref)}</b> · Balance <b style="color:var(--amber)">${money(bal)}</b></p>
    <div class="grid3">
      <div class="field"><label>Amount (${S().currency})</label><input id="pm_amt" type="number" min="0" step="any" value="${(+bal.toFixed(2))}"></div>
      <div class="field"><label>Date</label><input id="pm_date" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Method</label><select id="pm_method">
        <option value="cash">Cash</option><option value="card">Card</option><option value="bank">Bank Transfer</option><option value="cheque">Cheque</option></select></div>
    </div>
    <div class="field"><label>Reference (optional)</label><input id="pm_ref" placeholder="e.g. receipt no. / card ••1234"></div>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn-sm btn-green" onclick="savePay('${kind}','${id}')">Save Payment</button>`);
}
function savePay(kind,id){
  if(!requireOnline())return;
  const rec = kind==='sale'? DB.sales.find(s=>s.id===id) : DB.purchases.find(p=>p.id===id);
  const total = kind==='sale'? rec.total : purchaseTotal(rec);
  let amt=+$('#pm_amt').value; if(!(amt>0))return toast('Enter a valid amount',1);
  const bal=total-(rec.paid||0);
  if(amt>bal+0.01) return toast(`Amount ${money(amt)} exceeds the outstanding balance ${money(bal)} — overpayment isn't allowed.`,1);
  rec.paid=(rec.paid||0)+amt; if(!rec.payments)rec.payments=[];
  rec.payments.push({id:uid(),date:$('#pm_date').value,amount:amt,method:$('#pm_method').value,ref:$('#pm_ref').value.trim()||(kind==='sale'?'Collection':'Payment')});
  save();closeModal();
  toast(kind==='sale'?'Payment collected':'Payment recorded');
  const active=$('.nav-item.active')?.dataset.view;
  if(active==='payments')renderPayments(); else if(active==='sales')renderSales(); else if(active==='purchases')renderPurchases(); else go(active||'dashboard');
}

/* add a purchase charge to a card + auto redeem points (respecting monthly cap) */
function chargeCard(c,amount,date,note,srcPurchaseId){
  if(!c.txns)c.txns=[];
  c.txns.push({id:uid(),date,type:'purchase',amount:+amount||0,note:note||'Purchase',srcPurchaseId});
  const cfg=cardCashbackCfg(c), pct=cfg.pct;
  if(pct>0 && amount>0){ const used=cardCashbackUsed(c,date);
    let disc=amount*pct/100; if(cfg.cap>0) disc=Math.min(disc,Math.max(0,cfg.cap-used)); disc=Math.round(disc*100)/100;
    if(disc>0) c.txns.push({id:uid(),date,type:'discount',amount:disc,note:'Cashback '+pct+'%',srcPurchaseId}); }
}

/* ========== ACTIVITY LOG ==========
   Every EDIT and DELETE — by anyone, including the Owner — is appended here so
   there is a permanent trail. Records: when, who, what action, on which record,
   and a short human summary. Append-only (no clear button, by design). Attributed
   to the acting user; approved worker changes carry the requester + approver. */
let _logActor=null;   // set by approveReq so an approved change is attributed to the requester
function logAct(action,entity,ref,detail){
  if(!DB.activity)DB.activity=[];
  const who=_logActor||{id:(session&&session.id)||'',name:(session&&session.name)||'—'};
  DB.activity.push({id:uid(),ts:new Date().toISOString(),byId:who.id||'',byName:who.name||'—',via:who.via||'direct',action,entity,ref:ref||'',detail:detail||''});

function queueApproval(kind,action,targetId,ref,payload){
  if(!requireOnline())return;

  DB.approvals.push({id:uid(),ts:todayStr(),byId:session.id,byName:session.name,kind,action,targetId,ref,payload:payload||null,status:'pending'});

/* apply an edited purchase's data to the record + re-sync card ledger */
function commitPurchase(id,data){
  const rec=DB.purchases.find(x=>x.id===id); if(!rec)return;
  const beforeT=purchaseTotal(rec);
  ['productId','qty','rate','cardId','cardRef'].forEach(k=>delete rec[k]);
  Object.assign(rec,data);
  unlinkPurchaseFromCards(id); unlinkPurchaseFromGifts(id); unlinkPurchaseFromLenders(id);
  (data.payments||[]).forEach(s=>{ if(s.method==='card'&&s.cardId){ const c=cardById(s.cardId); if(c)chargeCard(c,s.amount,data.date,'Purchase '+rec.ref+(data.supplier?' · '+data.supplier:''),id); }
    else if(s.giftId){ const g=giftById(s.giftId); if(g)spendGift(g,s.amount,data.date,'Purchase '+rec.ref+(data.supplier?' · '+data.supplier:''),id); }
    else if(s.method==='cardborrow'&&s.lenderId){ postLenderSwipe(s.lenderId,s.lenderCardId,s.amount,s.commission,data.date,'Purchase '+rec.ref+(data.supplier?' · '+data.supplier:''),id); } });
  logAct('edit','purchase',rec.ref,`total ${money(beforeT)} → ${money(purchaseTotal(rec))} · paid ${money(rec.paid||0)}${rec.supplier?' · '+rec.supplier:''}`);
}
function commitSale(id,data){ const rec=DB.sales.find(x=>x.id===id); if(!rec)return; const beforeT=rec.total; Object.assign(rec,data);
  logAct('edit','sale',rec.invoiceNo,`total ${money(beforeT)} → ${money(data.total)} · received ${money(data.paid||0)}${rec.customer?' · '+rec.customer:''}`); }
function commitPurchaseDelete(id){ const rec=DB.purchases.find(p=>p.id===id);
  if(rec)logAct('delete','purchase',rec.ref,`total ${money(purchaseTotal(rec))}, ${purchaseItems(rec).length} item(s)${rec.supplier?' · '+rec.supplier:''}`);
  unlinkPurchaseFromCards(id); unlinkPurchaseFromGifts(id); unlinkPurchaseFromLenders(id); DB.purchases=DB.purchases.filter(p=>p.id!==id); }
function commitSaleDelete(id){ const rec=DB.sales.find(s=>s.id===id);
  if(rec)logAct('delete','sale',rec.invoiceNo,`total ${money(rec.total)}${rec.customer?' · '+rec.customer:''}`);
  unlinkSaleFromGifts(id); DB.sales=DB.sales.filter(s=>s.id!==id); }
function approveReq(id){
  if(!requireOnline())return;
  const r=(DB.approvals||[]).find(x=>x.id===id); if(!r||r.status!=='pending')return;
  const apply=()=>{
    _logActor={id:r.byId,name:r.byName,via:'approved by '+session.name};   // attribute to the requester
    if(r.action==='delete'){ r.kind==='purchase'?commitPurchaseDelete(r.targetId):commitSaleDelete(r.targetId); }
    else { r.kind==='purchase'?commitPurchase(r.targetId,r.payload):commitSale(r.targetId,r.payload); }
    _logActor=null;
    r.status='approved'; r.decidedTs=todayStr(); r.decidedBy=session.name;
    save(); renderApprovals(); renderApprovalsBadge(); renderBell(); toast('Approved & applied');
  };
  confirmBox('Approve request?', `${r.action==='delete'?'Delete':'Apply the edit to'} ${r.kind} <b>${esc(r.ref)}</b> requested by ${esc(r.byName)}? Linked cash & card entries will be recalculated.`, apply, 'Approve');
}

      value="${sel?esc(sel.v):''}" oninput="cardPickResolve('${idBase}')" onchange="cardPickResolve('${idBase}')">
    <datalist id="${idBase}_dl">${dl}</datalist>
    <input type="hidden" id="${idBase}" value="${selectedId||''}">`;
}
function cardPickResolve(idBase){
  const st=window._cardPick[idBase]; if(!st)return;
  const raw=($('#'+idBase+'_q')?.value||'').trim(), q=raw.toLowerCase();
  if(raw && st.extras.some(x=>x.toLowerCase()===q)){ const hidden=$('#'+idBase); if(hidden)hidden.value=''; if(st.onpick)st.onpick('',raw); return; }
  let hit=st.opts.find(o=>o.v.toLowerCase()===q);                                   // exact (picked from list)
  if(!hit && q){ const m=st.opts.filter(o=>o.v.toLowerCase().includes(q)); if(m.length===1)hit=m[0]; } // unique partial
  const id=hit?hit.id:''; const hidden=$('#'+idBase); if(hidden)hidden.value=id;
  if(st.onpick)st.onpick(id,raw);
}

/* live "available after" preview inside the card-entry modal */
let _ctBase=0,_ctSign=1,_ctNeg=false;
function ctCalcAfter(){
  const el=$('#ct_after'); if(!el)return;
  const amt=+($('#ct_amt')?.value)||0;
  const after=_ctBase + _ctSign*amt;
  el.textContent=money(after);
  el.style.color = after<-0.005 ? 'var(--red)' : 'var(--green)';
  const w=$('#ct_warn'); if(w) w.style.display=(after<-0.005 && !_ctNeg) ? 'block' : 'none';
}
function cardTxnModal(id,type,txnId){

      <input type="checkbox" id="ct_cash" checked disabled style="width:18px;height:18px;accent-color:var(--brand)"><span style="font-size:14px;font-weight:600">Deposited from your cash box (deducts from Cash Book)</span></label>`
    :(type==='recharge'||type==='payment')?`<label style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);padding:11px 13px;border-radius:11px;cursor:pointer">

/* =========================================================
   CARD PREFERENCE  (which card to use next)
   Ranks active cards by the cashback they'd earn on a spend, gated by the
   available balance and the monthly cashback cap. Cashback in the UAE isn't
   credited at the till — it posts in the statement cycle — so it's shown here
   as "pending", with the date it will actually be credited (the statement /
   due date). Purely advisory: nothing is charged from this screen.
   ========================================================= */
/* cashback still allowed in the current cap period before the cap is hit (∞ = no cap).
   Accepts a full date or a 'YYYY-MM' month (normalised to mid-month). */
function cashbackCapRemaining(c,dateOrM){ const cfg=cardCashbackCfg(c); if(cfg.cap<=0)return Infinity;
  const d = dateOrM ? (String(dateOrM).length===7 ? dateOrM+'-15' : dateOrM) : todayStr();
  return Math.max(0, cfg.cap-cardCashbackUsed(c,d)); }
/* cashback a spend of `amount` would earn on this card, respecting the cap */
function expectedCashback(c,amount,dateOrM){ const cfg=cardCashbackCfg(c); if(cfg.pct<=0||amount<=0)return 0;
  return Math.min(amount*cfg.pct/100, cashbackCapRemaining(c,dateOrM)); }
/* cashback already accrued this cap period (pending until it posts on the statement) */
function pendingCashback(c){ return cardCashbackUsed(c,todayStr()); }
/* shared ranking so the on-screen table and the Excel/PDF exports always agree */
function cardPrefRanked(amount,onlyFit){
  const today=todayStr();
  let cards=activeCards().map(c=>{
    const cfg=cardCashbackCfg(c);
    const av=cardAvailable(c), pct=cfg.pct, capRem=cashbackCapRemaining(c,today);
    const fits = cfg.ignoreLimit ? true : (amount<=0 ? true : (av>=amount || cardAllowsNeg(c)));
    const cb = amount>0 ? expectedCashback(c,amount,today) : 0;
    const due=cardDueDate(c), dl=daysUntil(due);
    return {c,av,pct,capRem,fits,cb,due,dl,pending:pendingCashback(c),ignoreLimit:cfg.ignoreLimit};
  });
  if(onlyFit) cards=cards.filter(x=>x.fits);
  cards.sort((a,b)=> (b.fits-a.fits) || (amount>0 ? (b.cb-a.cb) : (b.pct-a.pct)) || (b.av-a.av));
  return cards;
}
/* table rows (array-of-arrays, with header) for export — holder & bank in their own columns */
function cardPrefExportRows(){
  const amount=Math.max(0,+($('#pref_amt')?.value)||0), onlyFit=!!$('#pref_fit')?.checked;
  const cards=cardPrefRanked(amount,onlyFit);
  const header=['Rank','Card','Holder','Bank','Available','Cashback %'];
  if(amount>0) header.push('Earns on '+amount);
  header.push('Cap Left','Pending Cashback','Cashback Credited');
  const rows=[header];
  cards.forEach((x,i)=>{
    const r=[i+1, x.c.name, cardOwnerLabel(x.c), x.c.bank||'', num2(x.av), x.pct||0];
    if(amount>0) r.push(x.cb>0?num2(x.cb):0);
    r.push(x.capRem===Infinity?'No cap':num2(x.capRem), x.pending>0?num2(x.pending):0, fmtDate(isoDate(cardStatementDate(x.c))));
    rows.push(r);
  });
  return {rows,cards,amount};
}
function exportCardPrefExcel(){
  const {rows,cards}=cardPrefExportRows();
  if(!cards.length){ toast('No active cards to export',1); return; }
  exportExcel('card_preference_'+todayStr()+'.xlsx',[{name:'Card Preference',rows}]);
}
/* printable table → PDF (same offscreen html2canvas → jsPDF pattern as the other reports) */
function cardPrefReportHtml(){
  const {rows,cards,amount}=cardPrefExportRows(); if(!cards.length)return '';
  const st=S(), head=rows[0], body=rows.slice(1);
  const rt=(idx,len)=> (idx>=4 && idx!==len-1) ? 'right' : 'left';
  const th=head.map((h,idx)=>`<th style="text-align:${rt(idx,head.length)};padding:7px 9px;border-bottom:2px solid #222;font-size:11px;white-space:nowrap">${esc(String(h))}</th>`).join('');
  const trs=body.map(r=>`<tr>${r.map((v,idx)=>`<td style="text-align:${rt(idx,r.length)};padding:6px 9px;border-bottom:1px solid #e3e3e3;font-size:11px">${esc(String(v))}</td>`).join('')}</tr>`).join('');
  return `<div id="prefPdfArea" style="width:760px;background:#fff;color:#111;padding:24px;font-family:Arial,Helvetica,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px">
      <div><div style="font-size:20px;font-weight:800">⭐ Card Preference</div>
        <div style="font-size:12px;color:#666">Ranked ${amount>0?('for '+money(amount)):'by cashback %'} · ${cards.length} active card(s)</div></div>
      <div style="text-align:right;font-size:12px;color:#444"><b>${esc(st.company||'')}</b><br>${fmtDate(todayStr())}</div>
    </div>
    <table style="width:100%;border-collapse:collapse"><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>
    <div style="margin-top:14px;color:#888;font-size:10px">Cashback posts on each card's statement date, not at the till. Advisory only.</div>
  </div>`;
}
async function buildCardPrefPdf(){
  if(typeof html2canvas==='undefined' || !(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF engine not loaded — connect to the internet once to cache it',1); return null; }
  const html=cardPrefReportHtml(); if(!html){ toast('No active cards to export',1); return null; }
  const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;z-index:-1';
  holder.innerHTML=html; document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder.querySelector('#prefPdfArea'),{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const imgH=canvas.height*pw/canvas.width;
    if(imgH<=ph){ pdf.addImage(img,'JPEG',0,0,pw,imgH); } else { let left=imgH,pos=0; while(left>0){ pdf.addImage(img,'JPEG',0,pos,pw,imgH); left-=ph; if(left>0){ pdf.addPage(); pos-=ph; } } }
    return {blob:pdf.output('blob'), filename:'card_preference_'+todayStr()+'.pdf'};
  }catch(e){ toast('Could not build the PDF',1); return null; }
  finally{ document.body.removeChild(holder); }
}
async function pdfCardPref(){ toast('Preparing PDF…',0); const r=await buildCardPrefPdf(); if(!r)return;
  const url=URL.createObjectURL(r.blob); const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); toast('PDF ready — '+r.filename); }
