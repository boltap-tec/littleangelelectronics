  closeModal(); toast('All data cleared — reset to empty app'); logout();
}
/* ===== END DEV-ONLY ===== */

/* =========================================================
   MODAL / CONFIRM
   ========================================================= */
/* ============================================================
   MULTI-PICK — a searchable checkbox list for choosing several
   products in one go. Floats above the current modal (its own
   overlay, so it never closes the form behind it); the caller
   supplies the items and gets back the ticked values to append
   as rows. Reused by Purchase, Sales and Online order forms.
   ============================================================ */
function openMultiPick(cfg){
  if(!document.getElementById('mpickCss')){
    const st=document.createElement('style'); st.id='mpickCss';
    st.textContent=`
    .mpick-back{position:fixed;inset:0;z-index:99994;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px}
    .mpick{width:min(560px,96vw);max-height:min(82vh,640px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
    .mpick-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
    .mpick-head h4{margin:0;font-size:15.5px;flex:1}
    .mpick-srch{margin:10px 12px 6px;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;font-size:14.5px;outline:none}
    .mpick-srch:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    .mpick-list{flex:1;overflow:auto;padding:2px 8px 8px;-webkit-overflow-scrolling:touch}
    .mpick-opt{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text);line-height:1.35}
    .mpick-opt:hover{background:var(--panel2)}
    .mpick-opt input{width:17px;height:17px;accent-color:var(--brand);flex:0 0 auto;margin-top:1px}
    .mpick-opt.dis{opacity:.5;cursor:default}
    .mpick-opt small{color:var(--muted);display:block;font-size:11.5px;margin-top:1px}
    .mpick-none{padding:18px;color:var(--muted);text-align:center;font-size:13px}
    .mpick-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
    .mpick-count{margin-right:auto;color:var(--muted);font-size:13px}
    @media(max-width:620px){ .mpick{width:auto;left:8px;right:8px;max-height:84vh} }`;
    document.head.appendChild(st);
  }
  const chosen=new Set();
  const back=document.createElement('div'); back.className='mpick-back';
  const box=document.createElement('div'); box.className='mpick';
  box.innerHTML=`<div class="mpick-head"><h4>${esc(cfg.title||'Pick products')}</h4><button class="close-x" data-x>×</button></div>
    <input class="mpick-srch" type="text" placeholder="Type to search…">
    <div class="mpick-list"></div>
    <div class="mpick-foot"><span class="mpick-count">0 selected</span>
      <button class="btn-sm btn-ghost" data-x>Cancel</button>
      <button class="btn-sm btn-gold" data-add disabled>Add</button></div>`;
  back.appendChild(box); document.body.appendChild(back);
  const srch=box.querySelector('.mpick-srch'), list=box.querySelector('.mpick-list'),
        countEl=box.querySelector('.mpick-count'), addBtn=box.querySelector('[data-add]');
  function close(){ back.remove(); }
  function foot(){ countEl.textContent=chosen.size+' selected'; addBtn.disabled=!chosen.size; addBtn.textContent=chosen.size?`Add ${chosen.size}`:'Add'; }
  function render(){
    const terms=srch.value.toLowerCase().split(/\s+/).filter(Boolean);
    const rows=(cfg.items||[]).filter(it=>terms.every(t=>it.label.toLowerCase().includes(t)||(it.sub||'').toLowerCase().includes(t)));
    list.innerHTML=rows.length? rows.map(it=>`<label class="mpick-opt${it.disabled?' dis':''}">
        <input type="checkbox" value="${esc(it.value)}" ${it.disabled?'disabled':''} ${chosen.has(it.value)?'checked':''}>
        <span>${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></label>`).join('')
      : '<div class="mpick-none">No matches</div>';
  }
  render(); foot(); setTimeout(()=>srch.focus(),30);
  srch.addEventListener('input',render);
  list.addEventListener('change',e=>{ const cb=e.target.closest('input[type=checkbox]'); if(!cb)return;
    if(cb.checked)chosen.add(cb.value); else chosen.delete(cb.value); foot(); });
  box.addEventListener('click',e=>{ if(e.target.closest('[data-x]'))close(); });
  addBtn.addEventListener('click',()=>{ const vals=[...chosen]; close(); if(vals.length&&cfg.onAdd)cfg.onAdd(vals); });
  back.addEventListener('mousedown',e=>{ if(e.target===back)close(); });
}
function openModal(title,body,foot){
  $('#modalRoot').innerHTML=`<div class="modal-back" onmousedown="window._mdOnBack=(event.target===this)" onmouseup="if(event.target!==this)window._mdOnBack=false" onclick="if(event.target===this&&window._mdOnBack)closeModal()">
    <div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${foot||''}</div></div></div>`;
  markRequired($('#modalRoot'));
}
/* highlight every field whose label ends with "*": bright star + brightened label + accented input */
function markRequired(scope){ if(!scope)return;
  scope.querySelectorAll('label').forEach(lab=>{
    if(lab.dataset.rq)return;
    if(/\*\s*$/.test(lab.textContent) && !lab.querySelector('.req-star')){
      lab.dataset.rq='1';
      lab.innerHTML=lab.innerHTML.replace(/\*(\s*)$/,'<span class="req-star">*</span>$1');
      const f=lab.closest('.field'); if(f)f.classList.add('req');
    }
  });
}
function closeModal(){$('#modalRoot').innerHTML='';}
function confirmBox(title,msg,onYes,yesLabel){
  openModal(title,`<p style="margin:0;color:var(--muted);font-size:14.5px;line-height:1.6">${msg}</p>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn-sm btn-red" id="cfmYes">${yesLabel||'Yes, continue'}</button>`);
  $('#cfmYes').onclick=()=>{closeModal();onYes&&onYes();};
}

/* ============================================================
   SEARCHABLE DROPDOWNS
   Turns any long native <select> into a type-to-filter picker.
   Auto-applies to selects with >= 8 options (all product lists),
   and to any select tagged class="srch" (card pickers), so you can
   search products / cards / long lists everywhere they're chosen.
   Reuses each select's own value + onchange, so nothing else changes,
   and it re-reads options live so it survives the app's re-renders.
   ============================================================ */
(function(){
  const TH=5;
  const enh=s=>s&&s.tagName==='SELECT'&&!s.multiple&&!s.disabled&&!s.dataset.noSrch
    &&(s.classList.contains('srch')||s.options.length>=TH);
  let pop=null,back=null,curSel=null,items=[],activeIdx=0,eatClick=false,openW=0;

  function injectCss(){
    if(document.getElementById('srchCss'))return;
    const st=document.createElement('style'); st.id='srchCss';
    st.textContent=`
    .srch-back{position:fixed;inset:0;z-index:99990;background:transparent}
    .srch-pop{position:fixed;z-index:99991;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
      box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;max-height:min(56vh,430px)}
    .srch-pop>input{margin:8px 8px 6px;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);
      border-radius:9px;font-size:14.5px;outline:none}
    .srch-pop>input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    .srch-list{overflow:auto;padding:0 6px 8px;-webkit-overflow-scrolling:touch}
    .srch-opt{padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text);line-height:1.35}
    .srch-opt small{color:var(--muted)}
    .srch-opt.on{background:var(--brandsoft)}
    .srch-opt.sel{outline:1px solid var(--brand);outline-offset:-1px}
    .srch-none{padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:620px){
      .srch-back{background:rgba(0,0,0,.4)}
      .srch-pop{left:8px!important;right:8px!important;width:auto!important;top:auto!important;bottom:8px!important;
        max-height:72vh;border-radius:16px}
    }`;
    document.head.appendChild(st);
  }
  function close(){ if(pop)pop.remove(); if(back)back.remove(); pop=back=curSel=null; items=[]; activeIdx=0; }
  function fmt(t){ const m=t.split(' — '); return m.length>1? esc(m[0])+' <small>— '+esc(m.slice(1).join(' — '))+'</small>' : esc(t); }

  function open(sel){
    injectCss(); close(); curSel=sel; openW=window.innerWidth;
    back=document.createElement('div'); back.className='srch-back';
    /* dismiss on a full click (down+up) rather than mousedown: tearing the backdrop
       out on mousedown let the trailing click fall through to the modal behind and close it */
    back.addEventListener('mousedown',e=>e.preventDefault());
    back.addEventListener('click',close);
    pop=document.createElement('div'); pop.className='srch-pop';
    const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Type to search…';
    const list=document.createElement('div'); list.className='srch-list';
    pop.append(inp,list); document.body.append(back,pop);

    const r=sel.getBoundingClientRect(), w=Math.max(r.width,260);
    pop.style.width=w+'px';
    pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px';
    const place=()=>{ const ph=pop.offsetHeight;
      pop.style.top=(r.bottom+6+ph<=window.innerHeight||r.top<ph)
        ? Math.min(r.bottom+6,Math.max(8,window.innerHeight-ph-8))+'px'
        : Math.max(8,r.top-6-ph)+'px'; };

    const all=[...sel.options].map(o=>({value:o.value,text:o.textContent||'',dis:o.disabled}));
    function render(q){
      const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
      items=all.filter(o=>!o.dis&&(terms.every(t=>o.text.toLowerCase().includes(t))));
      if(activeIdx>items.length-1)activeIdx=items.length-1; if(activeIdx<0)activeIdx=0;
      list.innerHTML=items.length
        ? items.map((o,i)=>`<div class="srch-opt${o.value===sel.value?' sel':''}${i===activeIdx?' on':''}" data-i="${i}">${fmt(o.text)}</div>`).join('')
        : '<div class="srch-none">No matches</div>';
      place();
    }
    function ensure(){ const el=list.querySelector('.srch-opt.on'); if(el)el.scrollIntoView({block:'nearest'}); }
    function pick(i){ const o=items[i]; if(!o){close();return;} sel.value=o.value; close(); sel.dispatchEvent(new Event('change',{bubbles:true})); }

    activeIdx=Math.max(0,all.filter(o=>!o.dis).findIndex(o=>o.value===sel.value));
    /* on phones, don't auto-focus the search box — that pops the keyboard, whose
       viewport resize would close the picker the instant it opens. Desktop still focuses. */
    const smallScreen=window.matchMedia&&window.matchMedia('(max-width:620px)').matches;
    render(''); if(!smallScreen)setTimeout(()=>inp.focus(),0); ensure();
    inp.addEventListener('input',()=>{ activeIdx=0; render(inp.value); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();activeIdx++;render(inp.value);ensure();}
      else if(e.key==='ArrowUp'){e.preventDefault();activeIdx--;render(inp.value);ensure();}
      else if(e.key==='Enter'){e.preventDefault();pick(activeIdx);}
      else if(e.key==='Escape'){e.preventDefault();close();}
    });
    /* keep focus in the search box on press, but commit the choice on the full click:
       picking on mousedown removed the option mid-gesture, so the browser re-targeted the
       trailing click onto the modal behind and closed the whole screen */
    list.addEventListener('mousedown',e=>{ if(e.target.closest('.srch-opt'))e.preventDefault(); });
    list.addEventListener('click',e=>{ const el=e.target.closest('.srch-opt'); if(el){e.preventDefault();e.stopPropagation();pick(+el.dataset.i);} });
  }

  document.addEventListener('mousedown',e=>{
    const sel=e.target.closest?e.target.closest('select'):null;
    if(sel&&enh(sel)){ e.preventDefault(); e.stopPropagation();
      if(curSel===sel){close();}
      else { open(sel);
        /* a tap also fires a synthesized click; on touch it lands on the backdrop we
           just opened and would close the picker instantly. Swallow that one click. */
        eatClick=true; setTimeout(()=>{eatClick=false;},600); } }
  },true);
  document.addEventListener('click',e=>{
    if(eatClick){ eatClick=false; if(!(pop&&pop.contains(e.target))){ e.preventDefault(); e.stopPropagation(); return; } }
    const sel=e.target.closest?e.target.closest('select'):null;
    if(sel&&enh(sel)){ e.preventDefault(); e.stopPropagation(); }
  },true);
  document.addEventListener('keydown',e=>{
    const sel=e.target;
    if(!pop&&sel&&sel.tagName==='SELECT'&&enh(sel)&&['Enter',' ','ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault(); open(sel); }
  },true);
  document.addEventListener('scroll',e=>{ if(pop&&!pop.contains(e.target))close(); },true);
  /* close on a real resize / orientation change, but ignore height-only changes —
     those are the mobile keyboard opening, which must not dismiss the picker. */
  window.addEventListener('resize',()=>{ if(pop&&window.innerWidth!==openW)close(); });
})();

/* boot */
applyTheme();
$('#loginBadge').innerHTML=logoMark(58);
restoreSession();   // keep the user logged in across refreshes
document.addEventListener('click',e=>{ const w=$('#bellWrap'); if(w&&!w.contains(e.target))$('#bellPop')?.classList.add('hidden');
  const ww=$('#walletWrap'), wc=$('#walletChip'); if((!ww||!ww.contains(e.target))&&(!wc||!wc.contains(e.target)))$('#walletPop')?.classList.add('hidden'); });
/* pull the shared cloud copy (if configured), merge it, then subscribe for live updates */
cloudPull().then(ok=>{
  cloudSubscribe();               // start live sync from other devices (no-op if cloud is off)
  updateOnlineUI();               // show the offline banner if we booted without a connection
  if(!ok) return;
  applyTheme();
  reSync();                       // cloud data merged in — re-point session & refresh the screen
}).finally(()=>updateOnlineUI());
</script>
