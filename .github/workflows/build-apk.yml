name: Build Android APK

# Builds an installable Android APK from index.html in the cloud — no tools needed
# on your side. Run it from the Actions tab (Run workflow), or it runs on push.
# The finished APK is attached to the run as a downloadable artifact: "little-angel-apk".

on:
  workflow_dispatch:
  push:
    branches: [cards-usage-report, main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-1024.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: ae.littleangel.electronics
      APP_NAME: "Little Angel Electronics"
      CAP: "^6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-24.04 runner ships with the Android SDK preinstalled; just
      # make sure the licenses are accepted so Gradle can fetch what it needs.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Scaffold Capacitor project & copy the web app
        run: |
          set -e
          mkdir -p build-apk/www build-apk/assets
          # the app + its assets become the bundled, offline web layer
          cp index.html build-apk/www/
          cp manifest.webmanifest sw.js build-apk/www/ 2>/dev/null || true
          cp icon.svg icon-maskable.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png build-apk/www/ 2>/dev/null || true
          # launcher-icon source for @capacitor/assets (1024x1024)
          cp icon-1024.png build-apk/assets/icon.png
          cd build-apk
          npm init -y >/dev/null
          npm install "@capacitor/core@${CAP}" "@capacitor/cli@${CAP}" "@capacitor/android@${CAP}"
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android

      - name: Generate branded launcher icons
        continue-on-error: true
        working-directory: build-apk
        run: |
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f1a33' --iconBackgroundColorDark '#0a1120'

      - name: Build debug APK
        working-directory: build-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp build-apk/android/app/build/outputs/apk/debug/app-debug.apk "out/little-angel-electronics.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-angel-apk
          path: out/little-angel-electronics.apk
          if-no-files-found: error
